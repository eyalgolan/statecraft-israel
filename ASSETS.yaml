    source: "In-engine capture: real screenshots of the game's own WebGL build (Unity 6000.3.25f1, Build.Web with -compression disabled). build-m3-start.jpg: main at 6c54c95, taken 2026-10-18 in headed Chrome for Testing at a 1920x1080 viewport, DPR 1, driven over CDP with tools/headed.py's Browser, no flag (the start screen's code and layout are unchanged on main at 8dae186). The others: taken 2026-10-20 from a build of main at 8dae186, in headless Chrome for Testing at a 1920x1080 viewport, DPR 1, driven over CDP with Playwright through the real start screen's New game (build-he-map.jpg with ?lang=he); scaled to 1568x882 and saved as JPEG (quality 80). Map derived from Copernicus DEM (NOTICE); the portraits on the Cabinet screen are the rows in ASSETS.portraits.yaml; the event-card photograph CC BY 4.0 with its credit line in the picture (Meitar Collection / National Library of Israel; NOTICE); the start screen's painting AI-generated (CC0, its row above)"
    status: verified
    note: "Screenshots of the game, not AI images; the AI-made parts they show are the start screen's painting and Tal Heuberger's 3D models (Tripo Studio, their rows above). CC BY-SA 4.0 as for the Steam kit's screenshots (coordinator ruling, 2026-10-15): the screenshots show the CC BY-SA 4.0 bakes of D13 (landuse.png, BiomeColours.bytes, RouteRibbons.bytes)."
  - glob: "docs/images/hero-engine-*.jpg"
    licence: CC-BY-SA-4.0
    source: "In-engine render of the game's own map with no interface (a screenshot of the game, not an AI image; the AI-made parts it shows are Tal Heuberger's 3D models, Tripo Studio, their rows above): MapCapture.Promo (unity/Assets/Editor/MapCapture.cs) with -extraPose hero_c:34.76:32.06:36000:12 on the Mobile quality tier (the WebGL tier), 1920x1080, Unity 6000.3.25f1, main at 6c54c95, 2026-10-18; saved as JPEG (quality 84). Map derived from Copernicus DEM. The website's home page hero"
