# Provenance of every image, video, font, audio, 3D-model and map-data file in this repository.
# scripts/oss/check_repo.py --only assets fails when such a file (by extension, or any file git treats as binary, or
# a file under content/map/ or StreamingAssets/map/) matches no rule, when a rule matches nothing (unless allow_empty),
# when a rule lacks glob/licence/source/status, or when a licence is not in scripts/oss/oss_policy.py ALLOWED_LICENCES.
# With --release (the release gate) it also fails on any row marked owner-verify or with licence unknown.
# Globs use fnmatch: '*' also matches '/'. Portrait rows live in ASSETS.portraits.yaml (scripts/oss/commons_licences.py).
# ai_generated: true marks AI output (the future Steam/itch.io disclosure is generated from it).
rules:
  # --- Paid Tripo model contribution: restricted, explicitly offered path exception ---
  - glob: "unity/Assets/Art/CommandModels/*.fbx"
    licence: LicenseRef-Statecraft-Models
    ai_generated: true
    source: "Paid Tripo P2.0 generations, 10–11 October 2026; sanitized per-model provenance and file hashes in docs/command-models.json; https://www.tripo3d.ai/terms section 5.2.2 (checked 2026-10-12)"
    status: verified
    credit: "Original contributing model creator identified in the introducing pull request; LicenseRef-Statecraft-Models"
    note: "Contributing creator authorized public download/use/modification/redistribution on 12 October 2026 with retained rights and a restriction on standalone asset sales and paid asset-pack/marketplace resale without that creator's written permission. Verified records authorization/provenance, not a guarantee of copyrightability, exclusivity or third-party clearance. Custom path exception requires maintainer acceptance before merge; see LICENSING.md and LICENSES/Statecraft-Models.txt."
  - glob: "unity/Assets/Art/CommandModels/*.jpg"
    licence: LicenseRef-Statecraft-Models
    ai_generated: true
    source: "Textures accompanying paid Tripo P2.0 generations, 10–11 October 2026; sanitized per-model provenance and file hashes in docs/command-models.json; https://www.tripo3d.ai/terms section 5.2.2 (checked 2026-10-12)"
    status: verified
    credit: "Original contributing model creator identified in the introducing pull request; LicenseRef-Statecraft-Models"
    note: "Contributing creator authorized public release on 12 October 2026 under the same custom model license. Includes use in commercial games; standalone asset sales and paid asset-pack/marketplace resale require the original contributing creator's written permission. Verified records authorization/provenance, not guaranteed copyright or legal clearance. Maintainer acceptance of the license exception is required before merge."
  - glob: "promo/ref/people/David_Ben-Gurion.jpg"
    licence: Public-Domain
    source: "https://commons.wikimedia.org/wiki/File:David_Ben-Gurion_(D597-087).jpg"
    status: owner-verify
    note: "Retained prior GPO reference; PD-Israel only, no explicit US status. Not the active Ben-Gurion portrait."
  - glob: "promo/ref/people/Moshe_Sharett.jpg"
    licence: Public-Domain
    source: "https://commons.wikimedia.org/wiki/File:Moshe_Sharett_Portrait.jpg"
    status: owner-verify
    note: "Retained prior GPO reference; PD-IsraelGov only, no explicit US status. Not the active Sharett portrait."
  # --- AI-generated concept art: CC0 / no rights claimed (LICENSING.md); published 2026-10-10 before D5 was checked ---
  - glob: "promo/final/0[1-8]-*.png"
    licence: CC0-1.0
    ai_generated: true
    source: "ElevenLabs Image API /v1/flows/image (GPT Image 2.5, Nano Banana Pro), prompts in promo/shots.json, generated 2026-10-08/09 by promo/gen.py; text fixes by promo/patch.py"
    status: owner-verify
    note: "Decision D5: the ElevenLabs Terms of Service for the account's plan at generation time, and the model providers' output terms, allow public redistribution. Concept art, not game footage. 04-cabinet-1948 and 08-defense-1955 are AI likenesses of real ministers made from public-domain reference sheets: never presented as photographs (docs/CONTENT_POLICY.md section 4)."
  - glob: "promo/ref/*-src.jpg"
    licence: CC0-1.0
    ai_generated: true
    source: "Earlier promo/gen.py outputs used as edit inputs for the *_fix shots in promo/shots.json (commit d42bd6b)"
    status: owner-verify
    note: "Decision D-P: the owner confirms these are our own earlier generations, not third-party screenshots; D5 applies."
  - glob: "docs/images/hero-concept-1936.jpg"
    licence: CC0-1.0
    ai_generated: true
    source: "Web copy of promo/final/03-gameplay-1936.png (published 2026-10-10); same provenance as promo/final"
    status: owner-verify
    note: "Owner-ruled README hero, captioned as concept art. Blocker if D5 disallows redistribution: the owner rules, an agent never drops it. D-H: no Civilization VII icon, logo or wordmark."
  - glob: "unity/Assets/UI/StartScreen/declaration-hall.jpg"
    licence: CC0-1.0
    ai_generated: true
    source: "Dreamina (dreamina.capcut.com), model GPT Image 2.5, 2026-10-12, with promo/final/03-gameplay-1936.png as the style reference; the start screen's painting. Option C of promo/start-screen (prompt in promo/start-screen/prompt-c.txt), resized from 1536x864 to 1920x1080 (Lanczos) and saved as JPEG; the Dreamina AI badge is kept"
    status: owner-verify
    note: "Decision D1: AI-only images CC0 / no rights claimed. Content policy: no identifiable real person (the hall from behind the audience, tiny soft-focus figures at the table, the frame between the flags holds an abstract warm blur with no figure or face in it, not a portrait). The model gave 1536x864 with a reference image; Dreamina's own upscale was not run (no free credits left), so the 1920x1080 is a plain resize."
  - glob: "promo/start-screen/declaration-hall-option-*.png"
    licence: CC0-1.0
    ai_generated: true
    source: "Dreamina (dreamina.capcut.com), model GPT Image 2.5, 2026-10-12, 1536x864 as downloaded, with promo/final/03-gameplay-1936.png as the style reference; prompts in promo/start-screen/prompt-b.txt and -c.txt"
    status: owner-verify
    note: "Decision D1: AI-only images CC0 / no rights claimed. Two options for the start screen; C is used."
  - glob: "docs/sources/declaration-1948/*.txt"
    licence: Public-Domain
    source: "The Declaration of the Establishment of the State of Israel: the Hebrew as published in Iton Rishmi (Official Gazette) No. 1, 14 May 1948, via https://he.wikisource.org/wiki/הכרזה_על_הקמת_מדינת_ישראל; the English translation via https://avalon.law.yale.edu/20th_century/israel.asp, checked against the Israel MFA's https://www.gov.il/en/pages/declaration-of-establishment-state-of-israel (all 2026-10-12)"
    status: owner-verify
    note: "The start screen quotes two lines of each (Game.uxml; StartScreenTests checks them against these files). No copyright is claimed or needed: an official State publication of 1948, and the State's copyright in its works (50 years from creation, Israeli Copyright Act 2007, s. 42) has expired in any case. Owner to confirm the legal reading."
  # --- Reference sheets composed from the public-domain portraits ---
  - glob: "promo/ref/*-sheet.jpg"
    licence: Public-Domain
    source: "Reference sheets composed for the edit model (cabinet 1948, defense 1955) from the public-domain portraits in promo/ref/people/"
    status: owner-verify
    note: "Decision D-P: the owner confirms the sheets contain only the public-domain portraits and our plain layout."
  # --- Our own captures and drawings: CC BY 4.0 ---
  - glob: "promo/final/09-m2-flythrough.mp4"
    licence: CC-BY-4.0
    source: "In-engine Unity capture of the M2 map (MapCapture.Flythrough); terrain derived from Copernicus DEM (NOTICE)"
    status: verified
  - glob: "promo/final/10-m2-topdown.png"
    licence: CC-BY-4.0
    source: "In-engine Unity capture of the M2 map (MapCapture.TopDown); terrain derived from Copernicus DEM (NOTICE)"
    status: verified
  - glob: "promo/ref/geo-reference.png"
    licence: CC-BY-4.0
    source: "Drawn by promo/refmap.py from gazetteer coordinates"
    status: verified
  - glob: "docs/images/build-*.jpg"
    licence: CC-BY-4.0
    source: "Real screenshots of the game's own WebGL build, dated in the README caption; map derived from Copernicus DEM, portraits public domain"
    status: verified
  - glob: "docs/images/social-preview.jpg"
    licence: CC-BY-4.0
    source: "Padded copy of docs/images/build-m3-map.jpg, 1280x640, for the GitHub social preview (a real build image, not concept art)"
    status: verified
  - glob: "spikes/m0/evidence/*.jpg"
    licence: CC-BY-4.0
    source: "Screenshots of the M0 spike builds"
    status: verified
  - glob: "unity/Assets/WebGLTemplates/Statecraft/favicon.ico"
    licence: CC-BY-4.0
    source: "Original geometric drawing for the WebGL page's tab icon (issue #47): a gold hexagon with a cream serif I on navy, in the loading page's colours; 16, 32 and 48 px; made 2026-10-11 for PR #169"
    status: verified
    ai_generated: true
    note: "The contributor reports the drawing was AI-assisted (PR #169); flagged for the AI-content disclosure by controller ruling."
  # --- Fonts ---
  - glob: "unity/Assets/UI/Fonts/EBGaramond-*.ttf"
    licence: OFL-1.1
    source: "https://github.com/octaviopardo/EBGaramond12 @ 106a4a6d377987459ae5e68673a4570f13b957fb (unity/Assets/UI/Fonts/SOURCE.txt)"
    status: verified
  - glob: "unity/Assets/UI/Fonts/FrankRuhlLibre/*.ttf"
    licence: OFL-1.1
    source: "https://github.com/fontef/frankruhllibre @ 2372d1998e51dc011f86554c0d23f1ccf44afddf, fonts/ttf/ (unity/Assets/UI/Fonts/FrankRuhlLibre/SOURCE.txt), unmodified"
    status: verified
    note: "The Hebrew face (EB Garamond has no Hebrew glyphs; #193); first used for the start screen's quotations."
  # --- Map data ---
  - glob: "unity/Assets/StreamingAssets/map/heightmap.*"
    licence: Copernicus-DEM
    source: "Copernicus DEM GLO-30 via tools/dem_to_heightmap.py; attribution in NOTICE"
    status: verified
  - glob: "content/map/hexes.json"
    licence: CC-BY-SA-4.0
    source: "tools/hexgrid.py from the heightmap (Copernicus), CHELSA bio12 and IMS station normals; attributions in NOTICE; content/ is CC BY-SA 4.0"
    status: verified
  - glob: "content/map/precip_bio12.*"
    licence: CC0-1.0
    source: "CHELSA V2.1 bio12 1981-2010 via tools/precip_clip.py; citation in NOTICE"
    status: verified
  - glob: "content/map/precip_stations.json"
    licence: IMS-data.gov.il
    source: "Israel Meteorological Service, data.gov.il dataset 481, via tools/ims_normals.py; licence 'Other (Open)' with no licence URL"
    status: owner-verify
    note: "Decision D6 (the M3 plan's deferred 'Legal review of map-data licences' row). Published 2026-10-10 before the check."
  - glob: "content/map/subdistrict*"
    licence: CC-BY-SA-4.0
    source: "tools/borders_digitise.py from the Survey of Palestine map 'Administrative Divisions' (1:750,000, 1946, overprinted May 1947; two Commons scans, SHA-256 in the file) per the 1947 Schedule (Palestine Gazette No. 1552); coast from the Copernicus DEM (NOTICE); the hex layer by tools/borders_bake.py; content/ is CC BY-SA 4.0"
    status: verified
    note: "Decision D-B (owner-delegated, 2026-10-11): allowed; facts redrawn, no image copied. Government of Palestine works of 1945-47, public domain in Israel and the UK since 1997; the file holds facts (where legally defined lines run) redrawn by our own method, which a possible US copyright in the map's drawing does not reach (Feist). Hebrew and Arabic names from Wikipedia, noted per row."
  - glob: "content/map/armistice*"
    licence: CC-BY-SA-4.0
    source: "tools/armistice_digitise.py from the 1949 General Armistice Agreements (UNTS vol. 42) and their annexed maps: Syria, Annex I's MR points and the annexed 1:50,000 map (S/1353/Rev.1: the UN ODS colour scan and the UNISPAL 1-bit scan, SHA-256 in the tool); Lebanon, Art. V.1's international boundary as the Mandate frontier of content/map/subdistricts_1948.geojson; Egypt, Art. VI.1 and VIII.2 with the Survey of Palestine 1:100,000 sheet 9 'Gaza' (Commons, NLI copy) for the Wadi Hasi mouth, Deir Suneid and the highway; the 1950 modus vivendi line from S/1471's signed map (UNISPAL; sheet 2 from the UN Treaty Collection); Jordan from the low-resolution UNISPAL copy of the signed map 1 (source_quality low_res_scan), georeferenced on town coordinates from Wikidata (CC0) and Wikipedia; IBS 46 (1965) a named cross-check only; coast from the Copernicus DEM (NOTICE); the hex layer by tools/armistice_bake.py; content/ is CC BY-SA 4.0"
    status: owner-verify
    note: "Decision D-A: UN documents with symbols are not copyrighted (ST/AI/189/Add.9/Rev.2 para. 2); the Gaza sheet, the Mandate frontier and Jordan map 1's 1:250,000 base fall under D-B (Government of Palestine); S/1471's base sheets are a Survey of Israel reprint of about 1949-50 (outside D-B; facts only taken). Only the lines' positions are taken, redrawn by our own method. Status draft until the owner's fact check and sensitivity review."
  - glob: "content/map/settlements_1948.yaml"
    licence: CC-BY-SA-4.0
    source: "Coordinates from the Wikipedia API (prop=coordinates) and tools/settlement_hexes.py; per-settlement URLs and check dates in settlements_1948.yaml"
    status: verified
  - glob: "content/map/settlement_hexes.yaml"
    licence: CC-BY-SA-4.0
    source: "Generated by tools/settlement_hexes.py from settlements_1948.yaml and hexes.json"
    status: verified
  - glob: "content/map/settlement_population_1945.yaml"
    licence: CC-BY-SA-4.0
    source: "Village Statistics, 1945 (Government of Palestine), figures read from https://en.wikipedia.org/wiki/Village_Statistics,_1945 on 2026-10-11; per-row sources in the file"
    status: owner-verify
    note: "Presentation only (settlement kit footprints); the sim never reads it. To be checked against a scan of the 1945 publication."
  - glob: "content/map/localities_1948.*"
    licence: CC-BY-SA-4.0
    source: "1948 localities of 1,000+ people and Bedouin camp totals: populations and 1948 names from Village Statistics, 1945 (Government of Palestine) as transcribed on Wikipedia, revision 1359600351 (CC BY-SA 4.0, attribution in each row's sources); coordinates, today's names and Hebrew/Arabic labels from Wikidata (CC0); camp areas read at load from content/map/subdistrict_hexes_1948.yaml. Read 2026-10-11; per-row sources in the YAML. localities_1948.tsv is its baked runtime form (tools/localities_bake.py), with the same rows and no new facts"
    status: owner-verify
    note: "Presentation only (map kits and labels); the sim never reads it. Rows with match low or manual need the owner's check; VS figures not yet checked against a scan."
  - glob: "content/map/route*_1948.yaml"
    licence: CC-BY-SA-4.0
    source: "Railways and main roads of May 1948 (issue #35): traced by tools/routes_1948.py on the Survey of Palestine 1:250,000 map of 1946 (public domain; scans and georeferencing by Palestine Open Maps, https://palopenmaps.org/en/maps?basemap=pal250k1946) between waypoints at Wikipedia API (CC BY-SA) and Wikidata (CC0) coordinates; per-route sources and check dates in routes_1948.yaml"
    status: verified
    note: "Public domain checked 2026-10-11: PD-UKGov (expired Crown copyright: 50 years from publication for published works, which HMSO treats as worldwide) and PD-scan, as Wikimedia Commons files the 1946 Survey of Palestine sheets (e.g. https://commons.wikimedia.org/wiki/File:Gaza_sh._04,_1946.jpg). Palestine Open Maps' About page calls its maps public domain under the UK Copyright, Designs and Patents Act and publishes no terms of its own for its tiles or georeferencing; the traced lines are our own derivative and copy none of its layers. No OpenStreetMap (ODbL) geometry is copied: OSM and OpenHistoricalMap lines are only measured against (tools/routes_accuracy.py, docs/routes.md)."
  - glob: "content/map/units_1948.yaml"
    licence: CC-BY-SA-4.0
    source: "The 1948 brigades, 101 Squadron and the first navy ships, with their dated positions (docs/units.md, Units in play): facts and place coordinates read from English and Hebrew Wikipedia (CC BY-SA; Wikipedia API prop=coordinates) and Wikidata (CC0), and the S-199 markings from Eduard Info 11/2025 pp. 53-54 (facts only, no text or image copied); per-row sources and check dates in the file"
    status: owner-verify
    note: "Presentation only (the map's unit tokens); the sim never reads it, so the content hash does not move (UnitsInPlayTests). Rows marked wikipedia_only are drafts until checked against a published history (Lorch, The Edge of the Sword) or the IDF and Defense Establishment Archives."
  # --- Baked map textures (derived from the heightmap) ---
  - glob: "unity/Assets/Textures/Map/landuse.png"
    licence: Copernicus-DEM
    source: "tools/land_bake.py (issue #33): the land-use colour and weight (procedural field parcels with farm tracks, garrigue, terraces and scrub) placed by: slope and water from the Copernicus DEM-derived heightmap (Copernicus-DEM); rainfall from CHELSA V2.1 bio12 (CC0-1.0) bias-corrected by the IMS station normals of content/map/precip_stations.json (data.gov.il dataset 481, IMS-data.gov.il, decision D6); content/map/hexes.json biomes (this project's own content, CC-BY-SA-4.0); and the town coordinates of content/map/settlements_1948.yaml (Wikipedia API, CC-BY-SA-4.0) for the citrus belt. Procedural, not AI-generated; attribution in NOTICE"
    status: owner-verify
    note: "Decision D13 (docs/oss/DECISIONS.md): the owner rules the licence of textures derived from DEM, CHELSA, IMS and coordinate inputs."
  - glob: "unity/Assets/Textures/*"
    licence: Copernicus-DEM
    source: "tools/terrain_bake.py from the Copernicus DEM GLO-30-derived heightmap (unity/Assets/StreamingAssets/map/heightmap.*): AO, curvature, sky-view (Map/terrain_bake.png), coast distance (Map/coast.png) and the AO copy (Map/ao.png); attribution in NOTICE"
    status: verified
