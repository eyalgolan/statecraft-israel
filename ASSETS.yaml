# Provenance of every image, video, font, audio, 3D-model and map-data file in this repository.
# scripts/oss/check_repo.py --only assets fails when such a file (by extension, or any file git treats as binary, or
# a file under content/map/ or StreamingAssets/map/) matches no rule, when a rule matches nothing (unless allow_empty),
# when a rule lacks glob/licence/source/status, or when a licence is not in scripts/oss/oss_policy.py ALLOWED_LICENCES.
# With --release (the release gate) it also fails on any row marked owner-verify or with licence unknown.
# Globs use fnmatch: '*' also matches '/'. Portrait rows live in ASSETS.portraits.yaml (scripts/oss/commons_licences.py).
# ai_generated: true marks AI output (the future Steam/itch.io disclosure is generated from it).
rules:
  # --- AI-generated concept art: CC0 / no rights claimed (LICENSING.md); published 2026-10-10 before D5 was checked ---
  - glob: "promo/final/0[1-8]-*.png"
    licence: CC0-1.0
    ai_generated: true
    source: "ElevenLabs Image API /v1/flows/image (GPT Image 2.5, Nano Banana Pro), prompts in promo/shots.json, generated 2026-10-08/09 by promo/gen.py; text fixes by promo/patch.py"
    status: verified
    note: "Decision D5: the ElevenLabs Terms of Service for the account's plan at generation time, and the model providers' output terms, allow public redistribution. Concept art, not game footage. 04-cabinet-1948 and 08-defense-1955 are AI likenesses of real ministers made from public-domain reference sheets: never presented as photographs (docs/CONTENT_POLICY.md section 4). Covered by D5, D-H and D-P. Owner, 17 Oct 2026 (#879, issuecomment-6233249635): 'Yes, flip all 3'."
  - glob: "promo/ref/*-src.jpg"
    licence: CC0-1.0
    ai_generated: true
    source: "Earlier promo/gen.py outputs used as edit inputs for the *_fix shots in promo/shots.json (commit d42bd6b)"
    status: verified
    note: "Decision D-P: the owner confirms these are our own earlier generations, not third-party screenshots; D5 applies. D-P (owner, 17 Oct 2026)."
  - glob: "docs/images/hero-concept-1936.jpg"
    licence: CC0-1.0
    ai_generated: true
    source: "Web copy of promo/final/03-gameplay-1936.png (published 2026-10-10); same provenance as promo/final"
    status: verified
    note: "Owner-ruled README hero, captioned as concept art. D-H: no Civilization VII icon, logo or wordmark. Covered by D5 and D-H. Owner, 17 Oct 2026 (#879, issuecomment-6233249635): 'Yes, flip all 3'."
  - glob: "unity/Assets/UI/StartScreen/declaration-hall.jpg"
    licence: CC0-1.0
    ai_generated: true
    source: "ElevenLabs Image API (Pro plan, decision D5), model GPT Image 2.5 Sunburst (gpt-image-2.5-sunburst), 2K, quality high, 2026-10-12 (#268); the start screen's painting, native 2048x1152, saved as JPEG (quality 90), no upscale. Take 1: prompt promo/start-screen/prompt-d.txt, with the previous painting (this file as merged in #255: Dreamina option C, resized to 1920x1080) as the composition reference and promo/final/03-gameplay-1936.png as the style reference. Take 2 (used): prompt promo/start-screen/prompt-d-edit.txt, an edit of take 1 that changes only the row of figures at the table. The previous painting (Dreamina, #255) showed sunbeams through the windows"
    status: verified
    note: "Decision D1: AI-only images CC0 / no rights claimed. Its composition reference is a Dreamina output, so it is covered by D-D, decided (owner, 2026-10-14, docs/oss/DECISIONS.md): approved for free, non-commercial distribution and CC0 marking; before any paid release the owner confirms commercial rights for the plan used or replaces the image. History: on 14 May 1948 some of the hall's windows were darkened for fear of an air raid, so the painting shows the windows covered with blackout cloth and the hall lit by lamps, with no daylight. Source: Ynet, '110 שנות היסטוריה: סיפורו של הבית שבו נולדה המדינה', 6 May 2022, https://www.ynet.co.il/architecture/article/rkgpx4bi5 ('וחלק מהחלונות הואפלו מחשש לתקיפה אווירית'), cited by https://en.wikipedia.org/wiki/Independence_Hall_(Israel) ('windows were darkened over fears of an air raid'); both checked 2026-10-12. The lamps themselves are not in the source. Content policy: no identifiable real person (the hall from behind the audience; the figures at the table are a soft, even row of tiny dark-haired silhouettes with an empty place at the centre, so no one reads as a speaker; the frame between the flags holds an abstract warm blur with no figure or face in it, not a portrait). An ElevenLabs output carries no provenance badge; the start screen's source line says 'Painting: AI-generated.'"
  - glob: "promo/start-screen/declaration-hall-option-*.png"
    licence: CC0-1.0
    ai_generated: true
    source: "Dreamina (dreamina.capcut.com), model GPT Image 2.5, 2026-10-12, 1536x864 as downloaded, with promo/final/03-gameplay-1936.png as the style reference; prompts in promo/start-screen/prompt-b.txt and -c.txt"
    status: verified
    note: "Decision D1: AI-only images CC0 / no rights claimed. Two options for the start screen; C is used. Decision D-D decided (owner, 2026-10-14, docs/oss/DECISIONS.md): approved for free, non-commercial distribution and CC0 marking; before any paid release the owner confirms commercial rights for the plan used or replaces the image."
  - glob: "unity/Assets/Art/Settlements/Prototype/Models/b*"
    licence: CC0-1.0
    ai_generated: true
    source: "Tripo Studio (tripo3d.ai), paid Max plan, made 10-13 October 2026 from concept images generated in the same studio, by Tal Heuberger (PR #507). Building modules decimated to 3,608-8,000 triangles in Blender 4.4; colour maps made at 1024 px and committed at 512 px (2x2 box average, JPEG quality 90, issue #659; owner ruling of 15 October 2026: plain git, only what ships, no masters). The masters and per-model records (prompts, task ids, credits) are kept outside the repository. The texture paths from the author's machine inside each FBX are blanked to same-length placeholders (owner ruling, 15 October 2026, PR #675)."
    status: verified
    artist: "Tal Heuberger"
    note: "The 23 single-building models of PR #507, brought over on their own in issue #659 (step 1). Tripo Terms of User Agreement (last updated 11 July 2025), s. 5.2.2: paid users have all rights in their Outputs, including to distribute and license them; s. 3.2 allows commercial and non-commercial use. CC0 / no rights claimed, as for the other AI-only assets (D1). Decided (owner, 2026-10-15, issue #659): 'they are ok to use'."
  - glob: "docs/sources/declaration-1948/*.txt"
    licence: Public-Domain
    source: "The Declaration of the Establishment of the State of Israel: the Hebrew as published in Iton Rishmi (Official Gazette) No. 1, 14 May 1948, via https://he.wikisource.org/wiki/הכרזה_על_הקמת_מדינת_ישראל; the English translation via https://avalon.law.yale.edu/20th_century/israel.asp, checked against the Israel MFA's https://www.gov.il/en/pages/declaration-of-establishment-state-of-israel (all 2026-10-12)"
    status: verified
    note: "The start screen quotes two lines of each (Game.uxml; StartScreenTests checks them against these files). No copyright is claimed or needed: an official State publication of 1948, and the State's copyright in its works (50 years from creation, Israeli Copyright Act 2007, s. 42) has expired in any case. Owner, 17 Oct 2026 (#879, issuecomment-6233249635): 'Approve both'."
  # --- Reference sheets composed from the public-domain portraits ---
  - glob: "promo/ref/*-sheet.jpg"
    licence: Public-Domain
    source: "Reference sheets composed for the edit model (cabinet 1948, defense 1955) from the public-domain portraits in promo/ref/people/"
    status: verified
    note: "Decision D-P: the owner confirms the sheets contain only the public-domain portraits and our plain layout. D-P (owner, 17 Oct 2026)."
