  - glob: "content/map/subdistrict*"
    licence: CC-BY-SA-4.0
    source: "tools/borders_digitise.py from the Survey of Palestine map 'Administrative Divisions' (1:750,000, 1946, overprinted May 1947; two Commons scans, SHA-256 in the file) per the 1947 Schedule (Palestine Gazette No. 1552); coast from the Copernicus DEM (NOTICE); the hex layer by tools/borders_bake.py; content/ is CC BY-SA 4.0. subdistrict_hexes_1948.tsv is the YAML's baked runtime form (tools/regions_bake.py, issue #321), with the same rows and no new facts"
    status: verified
    note: "Decision D-B (owner-delegated, 2026-10-11): allowed; facts redrawn, no image copied. Government of Palestine works of 1945-47, public domain in Israel and the UK since 1997; the file holds facts (where legally defined lines run) redrawn by our own method, which a possible US copyright in the map's drawing does not reach (Feist). Hebrew names from the Palestine Gazette's 1945 Hebrew schedule (owner ruling, 2026-10-23, #196), Arabic names from Wikipedia, noted per row."
  - glob: "content/map/armistice*"
    licence: CC-BY-SA-4.0
    source: "tools/armistice_digitise.py from the 1949 General Armistice Agreements (UNTS vol. 42) and their annexed maps: Syria, Annex I's MR points and the annexed 1:50,000 map (S/1353/Rev.1: the UN ODS colour scan and the UNISPAL 1-bit scan, SHA-256 in the tool); Lebanon, Art. V.1's international boundary as the Mandate frontier of content/map/subdistricts_1948.geojson; Egypt, Art. VI.1 and VIII.2 with the Survey of Palestine 1:100,000 sheet 9 'Gaza' (Commons, NLI copy) for the Wadi Hasi mouth, Deir Suneid and the highway; the 1950 modus vivendi line from S/1471's signed map (UNISPAL; sheet 2 from the UN Treaty Collection); Jordan from the low-resolution UNISPAL copy of the signed map 1 (source_quality low_res_scan), georeferenced on town coordinates from Wikidata (CC0) and Wikipedia; IBS 46 (1965) a named cross-check only; coast from the Copernicus DEM (NOTICE); the hex layer by tools/armistice_bake.py; content/ is CC BY-SA 4.0. armistice_hexes_1949.tsv is the YAML's baked runtime form (tools/regions_bake.py, issue #321), with the same rows and no new facts"
    status: verified
    note: "Decision D-A: UN documents with symbols are not copyrighted (ST/AI/189/Add.9/Rev.2 para. 2); the Gaza sheet, the Mandate frontier and Jordan map 1's 1:250,000 base fall under D-B (Government of Palestine); S/1471's base sheets are a Survey of Israel reprint of about 1949-50 (outside D-B; facts only taken). Only the lines' positions are taken, redrawn by our own method. Status draft until the owner's fact check and sensitivity review. Decision D-A decided (owner, 2026-10-14, docs/oss/DECISIONS.md): the rulings accepted as recorded; no archive request for a full-resolution Jordan scan now (it can be requested later)."
  - glob: "content/map/control*"
    licence: CC-BY-SA-4.0
    source: "tools/control_digitise.py from Israel State Archives map 6158/1 ('Palestine: the partition lines and the front lines', 1949, ISA-PMO-GovernmentSecretary-R0005czg; the NYU Faculty Digital Archive copy, hdl 2451/72921, SHA-256 in the tool; source_quality low_res_scan), georeferenced on its printed 10-km Palestine grid; its red (9 July 1948), blue (18 July 1948) and green (end of October 1948) front lines traced; the dates of the operations from Wikipedia; from each 1949 agreement's date the sides of content/map/armistice_lines_1949.geojson (D-A); the Mandate outline of content/map/subdistricts_1948.geojson (D-B); the hex layer by tools/control_bake.py; for 15 May - 10 June 1948 (#674, owner decision of 16 October 2026) the 9 July lines with the CIA's 'Military Situation - 18 May 1948' map (CIA-RDP78-01617A004700010003-6, the Wayback copy, SHA-256 in the tool; georeferenced on its graticule ticks) for the one dashed border traced (Safad-Hula) and the 1947 sub-districts (D-B) as cuts; content/ is CC BY-SA 4.0. control_hexes_1948_49.tsv is the YAML's baked runtime form (tools/regions_bake.py, issue #321), with the same rows and no new facts"
    status: verified
    note: "Decision D-C (owner, 2026-10-14): allowed. A 1949 Israeli state work, out of copyright in Israel (Copyright Act 2007 s. 42); a possible URAA US term in its drawing does not reach the facts taken (where a front line ran on a date: Feist); its base is a Survey of Palestine sheet (D-B). Only the lines' positions are taken, redrawn by our own method; no image is copied or committed. The CIA map (#674) is a US federal work, not protected by US copyright (17 USC 105); facts only, redrawn, no image committed. Status draft, owner-verify: the owner's fact check and sensitivity review before a shareable build."
  - glob: "content/map/settlements_1948.yaml"
