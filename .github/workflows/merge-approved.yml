name: Merge approved

# Squash-merges an open pull request into main once the maintainer has approved its latest commit and every check
# on that commit has passed (owner ruling, 2026-10-11). Outside contributors get no write access; this job merges for
# them. It runs from main's copy of this file and never checks out, builds or runs pull-request code, so the write
# token never meets outside code. It starts when CI finishes (workflow_run runs in this repository's context with a
# write token, also for forks), when a review is submitted (for a fork's pull request GitHub gives that run a read-only
# token, so its merge is refused and the next CI or timer run merges), on a timer as a fallback (GitHub runs
# schedules late or not at all under load), and by hand. It reads only numbers, SHAs and states from the API, never titles;
# the body is read only inside jq, for the licence tick, and never reaches the shell.
#
# A pull request merges only when all of these hold on its current head commit:
# - it targets main, is not a draft, and GitHub reports it MERGEABLE (no conflicts);
# - the maintainer's most recent review is APPROVED and was made on that exact commit (a later push needs a new
#   approval);
# - the four CI checks below exist on that commit and each concluded SUCCESS (a first-time contributor's run that is
#   still waiting for approval has no results, so it waits);
# - unless the maintainer opened it, its body ticks the template's licence line ("[x] I contribute this under the terms
#   in `CONTRIBUTING.md`", [x] or [X]); an unticked or waived pull request waits for the maintainer to merge it by hand.
# A pull request that passes all of these but is behind main is not tried: the main ruleset needs branches up to date,
# so gh would refuse it. The run says it waits, and it merges once it is updated (#2698).
# GitHub does not start other workflows from a merge made with this token, so CI on main is not re-run by it.
#
# A refused merge is tolerated only when it is expected (#2698): the head moved after this run read it (GitHub then
# reports a head other than the approved SHA), or a review run met "Resource not accessible by integration" (the fork's
# read-only token above). Any other failure is printed, the remaining pull requests are still tried, and the run fails.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_review:
    types: [submitted]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: merge-approved
  cancel-in-progress: false

jobs:
  merge:
    name: Merge approved pull requests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MAINTAINER: eyalgolan
      REQUIRED_CHECKS: "Sim (dotnet test)|Tools (pytest)|Repo policy|Changelog"
    steps:
      - name: Merge every pull request that is approved and green
        run: |
          set -euo pipefail
          failed=0
          prs=$(gh pr list --state open --base main --limit 100 --json number --jq '.[].number')
          for n in $prs; do
            ready=$(gh pr view "$n" --json author,body,isDraft,mergeable,mergeStateStatus,headRefOid,reviews,statusCheckRollup --jq '
              . as $p
              | ([$p.reviews[] | select(.author.login == env.MAINTAINER)] | last) as $r
              | (env.REQUIRED_CHECKS | split("|")) as $need
              | ($p.isDraft | not)
                and $p.mergeable == "MERGEABLE"
                and $r != null and $r.state == "APPROVED" and $r.commit.oid == $p.headRefOid
                and ($need | all(. as $x | [$p.statusCheckRollup[] | select(.name == $x)]
                                 | length > 0 and all(.conclusion == "SUCCESS")))
                and ($p.author.login == env.MAINTAINER
                     or ($p.body // "" | test("\\[[xX]\\] I contribute this under the terms in")))
              | if . | not then "no" elif $p.mergeStateStatus == "BEHIND" then "behind" else $p.headRefOid end')
            if [ "$ready" = "no" ]; then
              echo "#$n: not ready"
              continue
            fi
            if [ "$ready" = "behind" ]; then
              echo "#$n: approved and green but behind main; it waits until it is updated"
              continue
            fi
            echo "#$n: approved and green at $ready, merging"
            if out=$(gh pr merge "$n" --squash --match-head-commit "$ready" 2>&1); then
              echo "#$n: merged"
              continue
            fi
            printf '%s\n' "$out"
            now=$(gh pr view "$n" --json headRefOid --jq '.headRefOid')
            if [ "$now" != "$ready" ]; then
              echo "#$n: merge refused, the head moved to $now; a later run checks the new head"
            elif [ "$GITHUB_EVENT_NAME" = pull_request_review ] && grep -qF 'Resource not accessible by integration' <<<"$out"; then
              echo "#$n: merge refused, a review run for a fork's pull request has a read-only token; the next CI or timer run merges"
            else
              echo "::error::#$n: merge failed for a reason this workflow does not expect; see the gh output above"
              failed=1
            fi
          done
          exit "$failed"
