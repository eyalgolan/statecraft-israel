name: Site

# Publishes the playable demo on GitHub Pages: the latest release's *-web-pages.zip unpacked at /demo/
# (https://eyalgolan.github.io/statecraft-israel/demo/), with a root page and a 404 page that redirect to it. The
# website that used to be built here (site/, Astro) was removed on 31 Oct 2026; this file keeps its name because the
# nightly release job dispatches it by file name (tools/nightly_publish.py). Pull requests that change this file only
# build and check the pages. Deploying runs on main only (the github-pages environment allows main only), so a
# published release starts a run on main instead of deploying from its tag. The demo never comes from git: it is a
# release asset (docs/RELEASING.md, step 5). No secret is used.

on:
  push:
    branches: [main]
    paths: [".github/workflows/site.yml"]
  pull_request:
    paths: [".github/workflows/site.yml"]
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  on-release:
    name: Site (start a deploy on main for the release)
    if: github.event_name == 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Run this workflow on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --repo "$GITHUB_REPOSITORY" --ref main

  build:
    name: Site (demo pages)
    if: github.event_name != 'release'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Unpack the latest release's Pages build at /demo/
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Every failure stops the run, so Pages keeps serving the last good deploy: no release, no
          # *-web-pages.zip in it, an empty or incomplete zip, or a lookup error never deploys an empty site.
          # `gh release view/download` without a tag resolve the latest non-prerelease, so read the newest
          # published (non-draft) release's tag from the list and pass it to both calls.
          tag="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName // empty')"
          if [ -z "$tag" ]; then
            echo "::error::No published release: nothing to deploy."
            exit 1
          fi
          asset="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name | select(endswith("-web-pages.zip"))] | first // empty')"
          if [ -z "$asset" ]; then
            echo "::error::No *-web-pages.zip in the latest release ($tag): nothing to deploy."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/web-pages" dist/demo
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$RUNNER_TEMP/web-pages" --clobber
          unzip -q -o "$RUNNER_TEMP/web-pages/$asset" -d dist/demo
          test -f dist/demo/index.html
          jq -e '.shareable == true' dist/demo/event-photos.json > /dev/null
          echo "Demo at /demo/ from $asset ($tag)"
      - name: Write the root page, a redirect to /demo/
        run: |
          set -euo pipefail
          cat > dist/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=./demo/">
          <title>Statecraft: Israel</title>
          </head>
          <body>
          <p><a href="./demo/">Play Statecraft: Israel</a></p>
          </body>
          </html>
          HTML
          grep -q 'url=./demo/' dist/index.html
      - name: Write the 404 page, a redirect to /demo/ for every missing path
        # Pages serves 404.html at any depth (old /en/..., /he/..., /media/... links), so it names the absolute path.
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          [[ "$REPO_NAME" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::Unexpected repository name: $REPO_NAME"; exit 1; }
          demo="/$REPO_NAME/demo/"
          cat > dist/404.html <<HTML
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=$demo">
          <title>Statecraft: Israel</title>
          </head>
          <body>
          <p><a href="$demo">Play Statecraft: Israel</a></p>
          </body>
          </html>
          HTML
          grep -q "url=$demo\"" dist/404.html
      - name: Keep the pages for deploying
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Site (deploy to GitHub Pages)
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
