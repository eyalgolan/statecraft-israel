name: Site

# Builds the website (site/, issue #393) and checks it: both languages for every page, a label on every image and video,
# nothing loaded from another origin (site/scripts/check-site.mjs). Pull requests only build. Deploying to GitHub Pages
# runs on main only once the owner has enabled Pages and set the repository variable SITE_DEPLOY to "true"; until then
# the deploy job is skipped. With a custom domain, set the variables SITE_URL (https://<domain>) and SITE_BASE (/) and
# add site/public/CNAME (site/README.md). No secret is used; dependencies install with --ignore-scripts.

on:
  push:
    branches: [main]
    paths: ["site/**", "content/**", "docs/images/**", "docs/sources/**", "promo/final/**", "unity/Assets/UI/EventImages/**", "unity/Assets/UI/Portraits/**", "ASSETS.yaml", "ASSETS.portraits.yaml", "README.md", "README.he.md", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "content/**", "docs/images/**", "docs/sources/**", "promo/final/**", "unity/Assets/UI/EventImages/**", "unity/Assets/UI/Portraits/**", "ASSETS.yaml", "ASSETS.portraits.yaml", "README.md", "README.he.md", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Site (astro build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and check
        working-directory: site
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASE: ${{ vars.SITE_BASE }}
        run: npm run build
      - name: Keep the built site for deploying
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SITE_DEPLOY == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Site (deploy to GitHub Pages)
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SITE_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
