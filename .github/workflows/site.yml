name: Site

# Builds the website (site/, issue #393) and checks it: both languages for every page, a label on every image and video,
# nothing loaded from another origin (site/scripts/check-site.mjs). Pull requests only build. Deploying to GitHub Pages
# runs on main only once the owner has enabled Pages and set the repository variable SITE_DEPLOY to "true"; until then
# the deploy job is skipped. With a custom domain, set the variables SITE_URL (https://<domain>) and SITE_BASE (/) and
# add site/public/CNAME (site/README.md). No secret is used; dependencies install with --ignore-scripts.

on:
  push:
    branches: [main]
    paths: ["site/**", "content/**", "docs/images/**", "docs/sources/**", "promo/final/**", "unity/Assets/UI/EventImages/**", "unity/Assets/UI/Portraits/**", "ASSETS.yaml", "ASSETS.portraits.yaml", "README.md", "README.he.md", ".github/workflows/site.yml"]
  pull_request:
    paths: ["site/**", "content/**", "docs/images/**", "docs/sources/**", "promo/final/**", "unity/Assets/UI/EventImages/**", "unity/Assets/UI/Portraits/**", "ASSETS.yaml", "ASSETS.portraits.yaml", "README.md", "README.he.md", ".github/workflows/site.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Site (astro build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        working-directory: site
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and check
        working-directory: site
        env:
          ASTRO_TELEMETRY_DISABLED: "1"
          SITE_URL: ${{ vars.SITE_URL }}
          SITE_BASE: ${{ vars.SITE_BASE }}
        run: npm run build
      - name: Add the playable demo, when the latest release has a Pages build
        # The demo is the release's *-web-pages.zip (Build.Web -decompressionFallback; docs/RELEASING.md, step 5),
        # unpacked at /demo/. It never comes from git (the Play page explains why). No such asset yet: the site
        # deploys without it.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SITE_DEPLOY == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Lookup failures (auth, network, rate limit) must fail the step, not deploy without the demo: no
          # error swallowing. Only two quiet skips: no releases at all, and a latest release without the zip.
          # `gh release view/download` without a tag resolve the latest non-prerelease, and every release is a
          # prerelease (docs/RELEASING.md step 6), so read the tag from the list and pass it to both calls.
          tag="$(gh release list --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName // empty')"
          if [ -z "$tag" ]; then
            echo "No releases yet: deploying without the demo."
            exit 0
          fi
          asset="$(gh release view "$tag" --json assets --jq '[.assets[].name | select(endswith("-web-pages.zip"))] | first // empty')"
          if [ -z "$asset" ]; then
            echo "No *-web-pages.zip in the latest release ($tag): deploying without the demo."
            exit 0
          fi
          mkdir -p /tmp/web-pages site/dist/demo
          gh release download "$tag" --pattern "$asset" --dir /tmp/web-pages --clobber
          unzip -q -o "/tmp/web-pages/$asset" -d site/dist/demo
          test -f site/dist/demo/index.html
          jq -e '.shareable == true' site/dist/demo/event-photos.json > /dev/null
          echo "Demo at /demo/ from $asset"
      - name: Keep the built site for deploying
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SITE_DEPLOY == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Site (deploy to GitHub Pages)
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.SITE_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
