name: CI

# Nothing here uses a secret, calls a paid API, runs an AI agent or pushes anywhere. Pull requests from forks run
# untrusted code (MSBuild targets, pytest conftest files, uv inline scripts), so the token is read-only, checkouts keep
# no credentials, and there is no secret to steal. A pull request can also edit this file and make its own checks green;
# CODEOWNERS review of any .github/ diff is the guard (docs/UNTRUSTED_PR_REVIEW.md). There is no CLA or DCO check:
# contributions come in under the repository licences (inbound = outbound, GitHub Terms of Service D.6; decision D2).
# Unity edit-mode tests are not run here; CONTRIBUTING.md, "What CI runs", says why.
# No `schedule:` and no `pull_request_target`, on purpose. Every action is pinned to a commit SHA
# (scripts/oss/pin_actions.py). The job names are the required checks in scripts/oss/github/ruleset-main-review.json;
# a test keeps the two identical.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

env:
  UV_PYTHON: "3.12"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sim:
    name: Sim (dotnet test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.401"
      # VSTest exits 0 when it finds no tests; TreatNoTestsAsError makes a break in test discovery fail (#2532).
      - name: Simulation and content tests
        run: dotnet test sim/Statecraft.sln -c Release --nologo -- RunConfiguration.TreatNoTestsAsError=true

  tools:
    name: Tools (pytest)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # tools/tests/test_package_release.py runs the sim's release gate (dotnet run --project sim/Statecraft.Cli).
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.401"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.5"
          # Dependencies are declared inline (uv run --with, # /// script), so there is no lock file to hash.
          cache-dependency-glob: |
            tools/**/*.py
            scripts/oss/**/*.py
      - name: Data tool tests
        run: uv run --with pytest==9.1.1 --with rasterio==1.5.2 --with numpy==2.5.3 --with pyyaml==6.0.3 --with pillow==12.3.0 --with requests==2.32.5 --with pyproj==3.8.0 pytest tools/tests -q

  policy:
    name: Repo policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.5"
          # Dependencies are declared inline (uv run --with, # /// script), so there is no lock file to hash.
          cache-dependency-glob: |
            tools/**/*.py
            scripts/oss/**/*.py
      - name: Policy checker tests
        run: uv run --with pytest==9.1.1 --with pyyaml==6.0.3 --with requests==2.32.5 pytest scripts/oss/tests -q
      - name: Licences, provenance, secrets and required files at the tip
        run: uv run scripts/oss/check_repo.py

  changelog:
    name: Changelog
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # Was 5: the fetch-depth 0 checkout of the PR merge ref took up to the whole 5 minutes and the job was cancelled (#2409, #2417, #2398).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Every commit and ref, but file contents only on demand: the full fetch took up to ~5 min of this job's 5.
          filter: blob:none
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.5"
          # Dependencies are declared inline (uv run --with, # /// script), so there is no lock file to hash.
          cache-dependency-glob: |
            tools/**/*.py
            scripts/oss/**/*.py
      - name: A user-visible change carries a CHANGELOG line or the no-changelog label
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SKIP_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'no-changelog') }}
        run: uv run scripts/oss/changelog_check.py --base "$BASE_SHA" --head "$HEAD_SHA" --skip-label "$SKIP_LABEL"
      # Only a person signs a row off (#375): no commit with an AI co-author trailer may add, change or remove a reviewed_by
      # or reviewed_on line in content/, unless the PR's "AI assistance" section discloses the AI help (owner, 4 November
      # 2026: "Yes, it counts"); even then it may not remove one. CI checks only that the section exists, is not a "no"
      # (no / none / not / n/a / nothing) and names a check; the reviewer reads what was checked and how. It needs every
      # commit of the PR (fetch-depth 0 above) and fails closed. The description is read by the guard from the runner's
      # event file ($GITHUB_EVENT_PATH), never put into this shell line or an env value. The job does not run on a
      # description edit: push again after changing the "AI assistance" section.
      - name: Only a person signs a row off (reviewed_by and reviewed_on)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run scripts/oss/reviewed_by_guard.py --base "$BASE_SHA" --head "$HEAD_SHA" --pr-event "$GITHUB_EVENT_PATH"
