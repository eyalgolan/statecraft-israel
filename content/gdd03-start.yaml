# R-CAMP-003.
# Owner ruling, 3 November 2026: "Tel Aviv's camp is Tel HaShomer; add Jerusalem" (recorded on #1719, issuecomment-6602125415).
# research_notes/gdd-phase-4-sourcing.md: Schneller, 17 March 1948: the British evacuated the camp and handed it to
