# as an army base. The source note separately records its training role.
ruleset: gdd-0.3
military_camps:
  - { city: tel_aviv, location: military_tel_litvinsky } # Existing cities.yaml camp; the ruling names it Tel HaShomer.
  - { city: jerusalem, location: military_schneller }
