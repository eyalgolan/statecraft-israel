      - { office: welfare_minister, from: 1952-12-24, to: 1954-01-26, sources: *gov4 }
      - { office: religions_minister, from: 1954-01-26, to: 1955-06-29, sources: *gov5 }
      - { office: welfare_minister, from: 1954-01-26, to: 1955-06-29, sources: *gov5 }
      # Sixth Government, split where the Third Knesset convened (15 August 1955): from then he sat for the National
