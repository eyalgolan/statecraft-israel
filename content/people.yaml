    competence: 6
    loyalty: 5
    portrait: { file: promo/ref/people/Aharon_Zisling.jpg, license: Public domain, source: "https://commons.wikimedia.org/wiki/File:Aharon_Zisling.jpg", focus_y: 0.34 }
    offices:
      # Provisional Government terms: Knesset position records, government 0. They split each term at 14 February 1949,
