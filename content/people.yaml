    offices:
      - { office: finance_minister, from: 1948-05-14, to: 1949-03-10, sources: *prov }
      - { office: finance_minister, from: 1949-03-10, to: 1950-11-01, sources: &first [*gov1_k, &bga { url: "https://bengurionarchive.bgu.ac.il/en/node/14566", checked: 2026-10-09 }] }
      # Trade and Industry from 22 March 1949, not 10 March: on 8 March 1949 the Prime Minister named Kaplan Minister of
      # Finance only and said the unassigned portfolios would follow in the coming weeks or days; on 22 March he told the
      # Knesset the government had decided that, for now, Kaplan would run Trade and Industry and Shapira Health (plenum
      # 1_ptm_250087.pdf, p. 192). The Knesset position record also starts both terms on 22 March. Issue #310.
      - office: trade_minister
        from: 1949-03-22
        to: 1950-11-01
        sources: &first_22_march
          - *gov1_k
          - { url: "https://fs.knesset.gov.il/1/Plenum/1_ptm_250087.pdf", checked: 2026-10-12 }
          - { url: "https://fs.knesset.gov.il/1/Plenum/1_ptm_250177.pdf", checked: 2026-10-12 }
          - &gov1_pdf { url: "https://main.knesset.gov.il/mk/government/documents/gov1.pdf", checked: 2026-10-12 }
      - { office: finance_minister, from: 1950-11-01, to: 1951-10-08, sources: &gov2 [*gov2_k] }
      - office: finance_minister
        from: 1951-10-08
        to: 1952-06-25
        sources:
          - *gov3
          - { url: "https://fs.knesset.gov.il/2/Plenum/2_ptm_250662.pdf", checked: 2026-10-11 }
      # 25 June 1952: Kaplan leaves Finance and remains Deputy PM without portfolio; primary Knesset proceeding.
      - office: deputy_prime_minister
        from: 1952-06-25
        to: 1952-07-13
        sources: &june_1952
          - { url: "https://fs.knesset.gov.il/2/Plenum/2_ptm_250662.pdf", checked: 2026-10-11 }
          - { url: "https://production.oknesset.org/pipelines/data/members/kns_persontoposition/kns_persontoposition.csv", checked: 2026-10-11 }
          - { url: "https://en.wikipedia.org/wiki/Eliezer_Kaplan", checked: 2026-10-11 }
      - { office: minister_without_portfolio, from: 1952-06-25, to: 1952-07-13, sources: *june_1952 }
    status: fact-checked
