# yaml-language-server: $schema=./schema/people.schema.json
# Offices and dates are historical facts (sourced per term). competence/loyalty are game-balance values, not facts. A
# term's `party` (when set) is the list the holder sat for in that government; otherwise `party` of the person applies.
# An empty person `party` means the person sat for no list (non-MK ministers, the President). Periods are [from, to).
# Terms without `to` continue beyond the content range (the game ends on 1 January 1957). Terms are split per government
# (Provisional, First 1949-03-10, Second 1950-11-01, Third 1951-10-08, Fourth 1952-12-24, Fifth 1954-01-26, Sixth
# 1955-06-29, Seventh 1955-11-03). Ben-Gurion's 1948 Prime Minister and Defense terms are not split before the Fourth
# Government. 1952-1956 terms (#26) follow the Knesset's own position records (knesset.gov.il OData,
# KNS_PersonToPosition, one query per government; the Knesset's web pages return a bot challenge), checked against
# he.wiki and en.wiki and, for each government's formation and the mid-term changes, the Knesset plenum record
# (fs.knesset.gov.il). The Knesset data split the Sixth Government's terms at 15 August 1955, when the Third Knesset
# convened; they are merged here except where the holder's list changed (Hapoel HaMizrachi and Mizrachi MKs sat for the
# National Religious Front in the Third Knesset). People added for 1952-1956 have neutral game ratings (competence 5,
# loyalty 5), like the deputies. living: false is set only after confirming each person's death date (en.wikipedia.org
# infobox; 2026-10-09 for the 1948-49 cabinet, 2026-10-10 for people added in M3). Portraits: public-domain files
# fetched with license check (promo/CREDITS.md). Deputy ministers (Efrati, Shari, Kahana) and Kaplan's Deputy Prime
# Minister title are historical-only titles (offices.yaml `historical_only: true`); sources in research_notes/M3 content
# 1950-51/deputy-titles.md. portrait.focus_y: the face centre's height as a share of the picture (0 top, 1 bottom),
# measured on each picture; the event card keeps it in view (playtest 2, P2-5). For people in office from 1948 to 1952,
# the Hebrew name cites the Knesset's person record (KNS_Person) and birth and death dates cite the Knesset member pages
# (Internet Archive copies, as the live pages return a bot challenge) or the President's Office pages. Wikipedia stays
# only for a value those records do not give or give differently (issue #457). title_he_form: feminine marks a person
# whose Hebrew office titles take the offices.yaml title_he_f (שרת העבודה), sourced like the other biography values; it
# is left out for the masculine title_he. Every person in the Knesset's government position records for governments 0-7
# (KNS_PersonToPosition) was checked against KNS_Person.GenderDesc on 2026-10-15: Golda Meir is the only woman. The
# people outside those records (the Presidents and the Chiefs of Staff) are men.
people:
  - id: ben_gurion
    name: David Ben-Gurion
    name_he: דוד בן-גוריון
    name_he_review: agent-checked
    born: 1886-10-16
    died: 1973-12-01
    biography_sources:
      name_he: [{ url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_Person(2198)", checked: 2026-10-14 }]
      born: [&bg_mk { url: "https://web.archive.org/web/20181229220523/http://www.knesset.gov.il:80/mk/eng/mk_eng.asp?mk_individual_id_t=684", checked: 2026-10-14 }]
      died: [*bg_mk, { url: "https://m.knesset.gov.il/EN/About/Pages/bg.aspx", checked: 2026-10-11 }]
    living: false
    party: mapai
    competence: 9
    loyalty: 10
    portrait: { file: promo/ref/people/David_Ben-Gurion_NARA_1951.jpg, license: Public domain, source: "https://commons.wikimedia.org/wiki/File:Photograph_of_President_Truman_in_the_Oval_Office%2C_evidently_receiving_a_Menorah_as_a_gift_from_the_Prime_Minister_of..._-_NARA_-_200318.jpg", focus_y: 0.4 }
    offices:
      # Prime Minister and Defense from 14 May 1948 until the Fourth Government. The Knesset position records hold both
      # without a break from 14 May 1948, split at each government and each Knesset; the Third Government records end
      # both on 24 December 1952.
      - office: prime_minister
        from: 1948-05-14
        to: 1952-12-24
        sources: &bg_1948
          - &gov0_k { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=GovernmentNum%20eq%200", checked: 2026-10-14 }
          - &gov1_k { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=GovernmentNum%20eq%201", checked: 2026-10-14 }
          - &gov2_k { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=GovernmentNum%20eq%202", checked: 2026-10-14 }
          - &gov3 { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=GovernmentNum%20eq%203", checked: 2026-10-14 }
      - { office: defense_minister, from: 1948-05-14, to: 1952-12-24, sources: *bg_1948 }
      # Fourth Government. He resigned on 7 December 1953 and en.wiki shows Sharett acting from then; the Knesset
      # records and he.wiki keep him in both offices until the Fifth Government took office on 26 January 1954, which is
      # used.
      - office: prime_minister
        from: 1952-12-24
        to: 1954-01-26
        sources: &gov4
          - &gov4_k { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=GovernmentNum%20eq%204", checked: 2026-10-12 }
          - { url: "https://he.wikipedia.org/wiki/ממשלת_ישראל_הרביעית", checked: 2026-10-12 }
          - { url: "https://en.wikipedia.org/wiki/Fourth_government_of_Israel", checked: 2026-10-12 }
          # Ben-Gurion's statement of 22 December 1952 naming the ministers, and the oath on 24 December.
          - { url: "https://fs.knesset.gov.il/2/Plenum/2_ptm_250689.pdf", checked: 2026-10-12 }
          - { url: "https://fs.knesset.gov.il/2/Plenum/2_ptm_250350.pdf", checked: 2026-10-12 }
      - { office: defense_minister, from: 1952-12-24, to: 1954-01-26, sources: *gov4 }
      # The four General Zionist ministers resigned on 25 May 1953 and returned on 3 June 1953. On 25 May the Prime
      # Minister told the Knesset that until the government met he would, by custom, be responsible for the four vacated
      # ministries (plenum 2_ptm_250584.pdf, p. 1383); on 3 June the Knesset approved their return and they made their
      # declarations again (2_ptm_250727.pdf, pp. 1481, 1502). Rationing goes with Trade and Industry (see Bernstein).
      # The Knesset position records show the four terms without a break; the plenum record of the resignation and the
      # new declarations is used (issue #314).
      - office: interior_minister
        from: 1953-05-25
        to: 1953-06-03
        sources: &gz_1953
          - &gz_resign { url: "https://fs.knesset.gov.il/2/Plenum/2_ptm_250584.pdf", checked: 2026-10-12 }
          - &gz_return { url: "https://fs.knesset.gov.il/2/Plenum/2_ptm_250727.pdf", checked: 2026-10-12 }
      - { office: trade_minister, from: 1953-05-25, to: 1953-06-03, sources: *gz_1953 }
      - { office: rationing_minister, from: 1953-05-25, to: 1953-06-03, sources: *gz_1953 }
      - { office: transportation_minister, from: 1953-05-25, to: 1953-06-03, sources: *gz_1953 }
      - { office: health_minister, from: 1953-05-25, to: 1953-06-03, sources: *gz_1953 }
      # Back as Minister of Defense when Lavon resigned on 21 February 1955 (Fifth Government).
      - office: defense_minister
        from: 1955-02-21
        to: 1955-06-29
        sources: &gov5
          - &gov5_k { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=GovernmentNum%20eq%205", checked: 2026-10-12 }
          - { url: "https://he.wikipedia.org/wiki/ממשלת_ישראל_החמישית", checked: 2026-10-12 }
          - { url: "https://en.wikipedia.org/wiki/Fifth_government_of_Israel", checked: 2026-10-12 }
          # Sharett's statement of 25 January 1954 naming the ministers.
          - { url: "https://fs.knesset.gov.il/2/Plenum/2_ptm_250778.pdf", checked: 2026-10-12 }
      - office: defense_minister
        from: 1955-06-29
        to: 1955-11-03
        sources: &gov6
          - &gov6_k { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=GovernmentNum%20eq%206", checked: 2026-10-12 }
          - { url: "https://he.wikipedia.org/wiki/ממשלת_ישראל_השישית", checked: 2026-10-12 }
          - { url: "https://en.wikipedia.org/wiki/Sixth_government_of_Israel", checked: 2026-10-12 }
          # Sharett's statement of 29 June 1955 naming the parties and the twelve ministers.
          - { url: "https://fs.knesset.gov.il/2/Plenum/2_ptm_250532.pdf", checked: 2026-10-12 }
      # Seventh Government (to 7 January 1958, after the content range).
      - office: prime_minister
        from: 1955-11-03
        sources: &gov7
          - &gov7_k { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=GovernmentNum%20eq%207", checked: 2026-10-12 }
          - { url: "https://he.wikipedia.org/wiki/ממשלת_ישראל_השביעית", checked: 2026-10-12 }
          - { url: "https://en.wikipedia.org/wiki/Seventh_government_of_Israel", checked: 2026-10-12 }
          # Ben-Gurion's statement of 2 November 1955 naming the ministers.
          - { url: "https://fs.knesset.gov.il/3/Plenum/3_ptm_251309.pdf", checked: 2026-10-12 }
      - { office: defense_minister, from: 1955-11-03, sources: *gov7 }
      # Justice while Rosen was out of the government, 13 to 28 February 1956: Knesset records and en.wiki (citing
      # HaBoker, 8 February, and Haaretz, 29 February 1956); the plenum heard of Rosen's resignation on 13 February and
      # of his return on 28 February. he.wiki's table shows no break.
      - office: justice_minister
        from: 1956-02-13
        to: 1956-02-28
        sources: &rosen_1956
          - *gov7_k
          - { url: "https://en.wikipedia.org/wiki/Seventh_government_of_Israel", checked: 2026-10-12 }
          - { url: "https://fs.knesset.gov.il/3/Plenum/3_ptm_251333.pdf", checked: 2026-10-12 }
          - { url: "https://fs.knesset.gov.il/3/Plenum/3_ptm_251016.pdf", checked: 2026-10-12 }
      # Held Education after Remez died in office on 19 May 1951 (en.wiki and he.wiki Second Government). The Knesset
      # position records have no Education row between Remez's death and the Third Government, and the plenum records
      # have Sharett standing in for Education while Ben-Gurion was abroad (Begin on 30 May 1951, 1_ptm_254469; Sharett
      # answering as acting minister on 27 June 1951, 1_ptm_254275). No primary record of the term was found (#457).
      - { office: education_minister, from: 1951-05-19, to: 1951-10-08, sources: &second [&second_en { url: "https://en.wikipedia.org/wiki/Second_government_of_Israel", checked: 2026-10-10 }, &second_he { url: "https://he.wikipedia.org/wiki/ממשלת_ישראל_השנייה", checked: 2026-10-10 }] }
      # Held Transportation after Pinkas died in office on 14 August 1952, until the Fourth Government was sworn in on
      # 24 December 1952 (Knesset data: Ben-Gurion 14 Aug - 24 Dec 1952; Serlin from 24 Dec). Serlin and Sapir are not
      # authored yet (#26), so the seat shows as vacant from 24 December rather than keeping a wrong holder.
      - { office: transportation_minister, from: 1952-08-14, to: 1952-12-24, sources: [{ url: "https://en.wikipedia.org/wiki/Third_government_of_Israel", checked: 2026-10-11 }, { url: "https://en.wikipedia.org/wiki/Ministry_of_Transport_and_Road_Safety", checked: 2026-10-11 }, { url: "https://production.oknesset.org/pipelines/data/members/kns_persontoposition/kns_persontoposition.csv", checked: 2026-10-11 }] }
    status: fact-checked
