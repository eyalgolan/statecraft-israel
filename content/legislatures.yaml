legislatures:
  # body_he (#558): the Knesset's name for the body (KNS_KnessetDates) and its he.wiki title. The First Knesset mirrors
  # its English name, "Constituent Assembly (First Knesset)" (owner, 2026-10-14): he.wiki's "האספה המכוננת" (the
  # election's title; the page redirects to the First Knesset) with the First Knesset's title.
  # body_he_review: agent-checked marks a name an AI agent checked against its sources and no person has read yet
  # (CONTENT_POLICY section 2, rule 6; owner, 2026-10-15); a native speaker reviews it (#564) and then removes the flag.
  - id: provisional_state_council
    body: Provisional State Council
    body_he: "מועצת המדינה הזמנית"
    body_he_sources:
      - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_KnessetDates", checked: 2026-10-14 }
      - { url: "https://he.wikipedia.org/wiki/מועצת_המדינה_הזמנית", checked: 2026-10-14 }
    # from: the Declaration of Independence (clause 12, minutes of 14 May 1948, 0_ptm_258580) has the People's Council
    # act as the Provisional State Council "from the termination of the Mandate, being tonight, the eve of Sabbath" (15
    # May 1948), and the Knesset's KNS_KnessetDates gives Knesset 0 a PlenumStart of 15 May 1948. The proclamation
    # adopted at the same sitting says the council was established by the Declaration of 14 May (issue #457). to: the
    # first convening of the Knesset (14 February 1949). Per its article the council was founded 12 April 1948. It last
    # met on 10 February 1949, its 40th sitting (minutes, https://fs.knesset.gov.il/0/Plenum/0_ptm_250008.pdf; the
    # article gives 3 February).
    from: 1948-05-15
    to: 1949-02-14
    size: 37
    # The Law and Administration Ordinance, 1948, section 5, has the Provisional Government's budget fixed by an
    # ordinance of the council. The council adopted the January 1949 Budget Ordinance unanimously (sitting 33, 30
    # December 1948, printed page 20) and the January-March 1949 Budget Ordinance 21-1 (sitting 38, 27 January 1949,
    # printed page 11). research_notes/budget-approval-1948-56.md (#3).
    budget_approval: true
    seats:
      mapai: 10
      mapam: 3
      general_zionists: 4
      new_aliyah: 3
      mizrachi: 3
      hapoel_hamizrachi: 2
      agudat_yisrael: 2
      sephardim: 1
      ahdut_haavoda_poalei_tzion: 1
      poale_zion_left: 1
      hatzohar: 3
      poalei_agudat_yisrael: 1
      maki: 1
      wizo: 1
      yemenite_association: 1
    sources:
      # en.wikipedia's Provisional State Council article is kept for one value, named per #457: the seat
      # distribution by list. from and to rest on the 14 May 1948 minutes (0_ptm_258580) and KNS_KnessetDates
      # (Knesset 0 PlenumFinish 1949-02-14); 1_ptm_250172 is the opening sitting on 14 February 1949. The article's
      # one Independent seat is Gruenbaum, whose Knesset 0 faction row reads "הציונים הכלליים" (#457), so it counts
      # with general_zionists (4 = the article's 3 + Gruenbaum).
      - { url: "https://en.wikipedia.org/wiki/Provisional_State_Council", checked: 2026-10-09 }
      - { url: "https://fs.knesset.gov.il/0/Plenum/0_ptm_258580.pdf", checked: 2026-10-14 }
      - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_KnessetDates", checked: 2026-10-14 }
      - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=PersonID%20eq%205904%20and%20KnessetNum%20eq%200", checked: 2026-10-18 }
      - { url: "https://fs.knesset.gov.il/1/Plenum/1_ptm_250172.pdf", checked: 2026-10-14 }
      # budget_approval.
      - { url: "https://fs.knesset.gov.il/0/law/0_lsr_312670.pdf", checked: 2026-10-14 }
      - { url: "https://fs.knesset.gov.il/0/Plenum/0_ptm_250001.pdf", checked: 2026-10-14 }
      - { url: "https://fs.knesset.gov.il/0/Plenum/0_ptm_250006.pdf", checked: 2026-10-14 }
    status: fact-checked
  - id: first_knesset
    body: Constituent Assembly (First Knesset)
    body_he: "האספה המכוננת (הכנסת הראשונה)"
    body_he_sources:
      - { url: "https://he.wikipedia.org/wiki/הכנסת_הראשונה", checked: 2026-10-14 }
      - { url: "https://he.wikipedia.org/wiki/הבחירות_לאספה_המכוננת", checked: 2026-10-14 }
    # en.wiki's Knesset article gives "20 January" for the election, which conflicts; the Knesset's First Knesset page gives 25 January 1949, which is used.
    elected: 1949-01-25
    from: 1949-02-14
    # Sat until the Second Knesset convened. The government resigned on 14 February 1951; in April 1951 the Knesset
    # passed the Transition to the Second Knesset Law (4 April) and the law fixing the election for 30 July 1951 (12 April),
    # as published in Sefer HaChukim 73 and 74.
    to: 1951-08-20
    size: 120
    # The 1949/50 Budget Law passed 60-25 (sitting 74, 31 August 1949, printed page 1508) and the 1950/51 Budget Law
    # 44-25 (sitting 159, 29 June 1950, printed page 1977). research_notes/budget-approval-1948-56.md (#3).
    budget_approval: true
    seats:
      mapai: 46
      mapam: 19
      united_religious_front: 16
      herut: 14
      general_zionists: 7
      progressive: 5
      sephardim: 4
      maki: 4
      democratic_list_nazareth: 2
      fighters_list: 1
      wizo: 1
      yemenite_association: 1
    sources:
      - { url: "https://web.archive.org/web/20160303211859/http://www.knesset.gov.il/history/eng/eng_hist1_s.htm", checked: 2026-10-14 }
      - { url: "https://www.gov.il/BlobFolder/guide/election-committee-history/en/history_election-dates_knesset1-results.pdf", checked: 2026-10-14 }
      - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_KnessetDates", checked: 2026-10-14 }
      - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=KnessetNum%20eq%201", checked: 2026-10-14 }
      - { url: "https://fs.knesset.gov.il/1/Plenum/1_ptm_250172.pdf", checked: 2026-10-14 }
      - { url: "https://fs.knesset.gov.il/1/Plenum/1_ptm_250266.pdf", checked: 2026-10-14 }
      - { url: "https://fs.knesset.gov.il/1/law/1_lsr_208917.PDF", checked: 2026-10-14 }
      - { url: "https://fs.knesset.gov.il/1/law/1_lsr_208021.PDF", checked: 2026-10-14 }
      - { url: "https://fs.knesset.gov.il/1/Plenum/1_ptm_250280.pdf", checked: 2026-10-14 }
      - { url: "https://fs.knesset.gov.il/2/Plenum/2_ptm_250609.pdf", checked: 2026-10-14 }
      # budget_approval.
      - { url: "https://fs.knesset.gov.il/1/Plenum/1_ptm_250028.pdf", checked: 2026-10-14 }
      - { url: "https://fs.knesset.gov.il/1/Plenum/1_ptm_250044.pdf", checked: 2026-10-14 }
    status: fact-checked
  - id: second_knesset
    body: Second Knesset
    body_he: "הכנסת השנייה"
    body_he_sources:
      - { url: "https://he.wikipedia.org/wiki/הכנסת_השנייה", checked: 2026-10-14 }
      - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_KnessetDates", checked: 2026-10-14 }
    elected: 1951-07-30
    # Convening date from the Knesset's session dates (KNS_KnessetDates) and the record of the first sitting, 20 August 1951.
    from: 1951-08-20
    # Sat until the Third Knesset convened on 15 August 1955 (he.wiki; Open Knesset lists Efrati's Second Knesset
    # service to 15/08/1955 and his Third Knesset service from 15/08/1955).
    to: 1955-08-15
    size: 120
    # The 1951/52 Budget Law passed 50-38 (sitting 37, 31 December 1951, printed page 878) and the 1952/53 Budget Law
    # 48-36 (sitting 75, 1 April 1952, printed page 1858). research_notes/budget-approval-1948-56.md (#3).
    budget_approval: true
    # Election results, identical in the Knesset's Second Knesset page, its faction records on 20 August 1951, IDI and JVL.
    # The United Religious Front ran as four lists (Hapoel HaMizrachi, Mizrachi, Agudat Yisrael, Poalei Agudat Yisrael).
    seats:
      mapai: 45
      general_zionists: 20
      mapam: 15
      hapoel_hamizrachi: 8
      herut: 8
      maki: 5
      progressive: 4
      democratic_list_israeli_arabs: 3
      agudat_yisrael: 3
      sephardim: 2
      poalei_agudat_yisrael: 2
      mizrachi: 2
      progress_and_work: 1
      yemenite_association: 1
      agriculture_and_development: 1
    sources:
      - { url: "https://en.idi.org.il/israeli-elections-and-parties/elections/1951/", checked: 2026-10-10 }
      - { url: "https://www.jewishvirtuallibrary.org/elections-to-the-2nd-knesset-july-1951", checked: 2026-10-10 }
      - { url: "https://web.archive.org/web/20160522174905/https://www.knesset.gov.il/history/eng/eng_hist2_s.htm", checked: 2026-10-14 }
      - { url: "https://fs.knesset.gov.il/1/law/1_lsr_208021.PDF", checked: 2026-10-14 }
      - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_KnessetDates", checked: 2026-10-14 }
      - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=KnessetNum%20eq%202", checked: 2026-10-14 }
      - { url: "https://fs.knesset.gov.il/2/Plenum/2_ptm_250609.pdf", checked: 2026-10-14 }
      # The end date (to: 1955-08-15).
      - { url: "https://he.wikipedia.org/wiki/הכנסת_השלישית", checked: 2026-10-11 }
      - { url: "https://oknesset.org/members/268.html", checked: 2026-10-11 }
      # budget_approval.
      - { url: "https://fs.knesset.gov.il/2/Plenum/2_ptm_250393.pdf", checked: 2026-10-14 }
      - { url: "https://fs.knesset.gov.il/2/Plenum/2_ptm_250298.pdf", checked: 2026-10-14 }
    status: fact-checked
  - id: third_knesset
    body: Third Knesset
    body_he: "הכנסת השלישית"
    body_he_sources:
      - { url: "https://he.wikipedia.org/wiki/הכנסת_השלישית", checked: 2026-10-14 }
      - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_KnessetDates", checked: 2026-10-14 }
    elected: 1955-07-26
    # Convening date from he.wiki (the Third Knesset began its term on 15 August 1955) and Open Knesset's member
    # records (Efrati: Third Knesset from 15/08/1955); the Knesset's own pages could not be opened. Ahdut HaAvoda
    # and Mapam are the two parts of the 1951 Mapam list, which split.
    from: 1955-08-15
    size: 120
    # The 1956/57 Budget Law passed 53-24, 5 abstaining (sitting 111, 22 March 1956, printed page 1612).
    # research_notes/budget-approval-1948-56.md (#3). Open: the 1956/57 law is read, but this Knesset sat until 1959
    # and its 1957-59 budget laws are not.
    budget_approval: true
    open_questions: [budget_approval]
    # Election results, identical in the IDI table and the Jewish Virtual Library table (which cites the Knesset).
    # IDI and JVL name the lists "National Religious Front" and "United Religious Front"; it is the same list.
    seats:
      mapai: 40
      herut: 15
      general_zionists: 13
      national_religious_front: 11
      ahdut_haavoda_poalei_tzion: 10
      mapam: 9
      religious_torah_front: 6
      maki: 6
      progressive: 5
      democratic_list_israeli_arabs: 2
      progress_and_work: 2
      agriculture_and_development: 1
    sources:
      - { url: "https://en.idi.org.il/israeli-elections-and-parties/elections/1955/", checked: 2026-10-11 }
      - { url: "https://www.jewishvirtuallibrary.org/elections-to-the-3rd-knesset-july-1955", checked: 2026-10-11 }
      - { url: "https://oknesset.org/members/268.html", checked: 2026-10-11 }
      - { url: "https://he.wikipedia.org/wiki/הכנסת_השלישית", checked: 2026-10-11 }
      # budget_approval.
      - { url: "https://fs.knesset.gov.il/3/Plenum/3_ptm_251023.pdf", checked: 2026-10-14 }
    status: fact-checked
