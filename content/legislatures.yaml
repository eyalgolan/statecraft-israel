legislatures:
  - id: provisional_state_council
    body: Provisional State Council
    # from/to are derived handover dates: independence (14 May 1948) and the first convening of the Knesset (14 February 1949).
    # Per its article the council was founded 12 April 1948 and last met 3 February 1949.
    from: 1948-05-14
    to: 1949-02-14
    size: 37
    budget_approval: false
    open_questions: [budget_approval]
    seats:
      mapai: 10
      mapam: 3
      general_zionists: 3
      new_aliyah: 3
      mizrachi: 3
      hapoel_hamizrachi: 2
      agudat_yisrael: 2
      sephardim: 1
      ahdut_haavoda_poalei_tzion: 1
      poale_zion_left: 1
      independent: 1
      hatzohar: 3
      poalei_agudat_yisrael: 1
      maki: 1
      wizo: 1
      yemenite_association: 1
    sources:
      - { url: "https://en.wikipedia.org/wiki/Provisional_State_Council", checked: 2026-10-09 }
    status: fact-checked
  - id: first_knesset
    body: Constituent Assembly (First Knesset)
    # The Knesset article gives "20 January" for the election, which conflicts; the election article (25 January 1949) is the source used.
    elected: 1949-01-25
    from: 1949-02-14
    # Sat until the Second Knesset convened. The government resigned on 14 February 1951; in April 1951 the Knesset
    # passed the Transition to the Second Knesset Law and fixed the election for 30 July 1951 (he.wiki First Knesset).
    to: 1951-08-20
    size: 120
    budget_approval: true
    open_questions: [budget_approval]
    seats:
      mapai: 46
      mapam: 19
      united_religious_front: 16
      herut: 14
      general_zionists: 7
      progressive: 5
      sephardim: 4
      maki: 4
      democratic_list_nazareth: 2
      fighters_list: 1
      wizo: 1
      yemenite_association: 1
    sources:
      - { url: "https://en.wikipedia.org/wiki/1949_Israeli_Constituent_Assembly_election", checked: 2026-10-09 }
      - { url: "https://en.wikipedia.org/wiki/Knesset", checked: 2026-10-09 }
      - { url: "https://he.wikipedia.org/wiki/הכנסת_הראשונה", checked: 2026-10-10 }
    status: fact-checked
  - id: second_knesset
    body: Second Knesset
    elected: 1951-07-30
    # Convening date from he.wiki only (single source; not confirmed elsewhere).
    from: 1951-08-20
    # Sat until the Third Knesset convened on 15 August 1955 (he.wiki; Open Knesset lists Efrati's Second Knesset
    # service to 15/08/1955 and his Third Knesset service from 15/08/1955).
    to: 1955-08-15
    size: 120
    budget_approval: true
    open_questions: [budget_approval]
    # Election results, identical in en.wiki, IDI and JVL. The United Religious Front ran as four lists (Hapoel
    # HaMizrachi, Mizrachi, Agudat Yisrael, Poalei Agudat Yisrael). he.wiki's composition table reflects later mergers.
    seats:
      mapai: 45
      general_zionists: 20
      mapam: 15
      hapoel_hamizrachi: 8
      herut: 8
      maki: 5
      progressive: 4
      democratic_list_israeli_arabs: 3
      agudat_yisrael: 3
      sephardim: 2
      poalei_agudat_yisrael: 2
      mizrachi: 2
      progress_and_work: 1
      yemenite_association: 1
      agriculture_and_development: 1
    sources:
      - { url: "https://en.wikipedia.org/wiki/1951_Israeli_legislative_election", checked: 2026-10-10 }
      - { url: "https://en.idi.org.il/israeli-elections-and-parties/elections/1951/", checked: 2026-10-10 }
      - { url: "https://www.jewishvirtuallibrary.org/elections-to-the-2nd-knesset-july-1951", checked: 2026-10-10 }
      - { url: "https://he.wikipedia.org/wiki/הכנסת_השנייה", checked: 2026-10-10 }
      # The end date (to: 1955-08-15).
      - { url: "https://he.wikipedia.org/wiki/הכנסת_השלישית", checked: 2026-10-11 }
      - { url: "https://oknesset.org/members/268.html", checked: 2026-10-11 }
    status: fact-checked
  - id: third_knesset
    body: Third Knesset
    elected: 1955-07-26
    # Convening date from he.wiki (the Third Knesset began its term on 15 August 1955) and Open Knesset's member
    # records (Efrati: Third Knesset from 15/08/1955); the Knesset's own pages could not be opened. Ahdut HaAvoda
    # and Mapam are the two parts of the 1951 Mapam list, which split.
    from: 1955-08-15
    size: 120
    budget_approval: true
    open_questions: [budget_approval]
    # Election results, identical in the IDI table and the Jewish Virtual Library table (which cites the Knesset).
    # IDI and JVL name the lists "National Religious Front" and "United Religious Front"; it is the same list.
    seats:
      mapai: 40
      herut: 15
      general_zionists: 13
      national_religious_front: 11
      ahdut_haavoda_poalei_tzion: 10
      mapam: 9
      religious_torah_front: 6
      maki: 6
      progressive: 5
      democratic_list_israeli_arabs: 2
      progress_and_work: 2
      agriculture_and_development: 1
    sources:
      - { url: "https://en.idi.org.il/israeli-elections-and-parties/elections/1955/", checked: 2026-10-11 }
      - { url: "https://www.jewishvirtuallibrary.org/elections-to-the-3rd-knesset-july-1955", checked: 2026-10-11 }
      - { url: "https://oknesset.org/members/268.html", checked: 2026-10-11 }
      - { url: "https://he.wikipedia.org/wiki/הכנסת_השלישית", checked: 2026-10-11 }
    status: fact-checked
