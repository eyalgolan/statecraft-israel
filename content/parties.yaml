# yaml-language-server: $schema=./schema/parties.schema.json
# Names as listed in the Provisional State Council, 1949 and 1951 election sources (see legislatures.yaml).
parties:
  # Hebrew names (#558): the short common name where a source gives one, as the English uses (owner, 2026-10-14): the
  # he.wiki title or its lead (מפא"י, מפ"ם, מק"י, הצה"ר), else the Knesset's faction record (KNS_Faction, the Knesset
  # given in the URL). `independent` has no list name to source and stays English. Open owner question: Hatzohar, he.wiki's
  # acronym הצה"ר or the Knesset 0 record's "התנועה הרווזיוניסטית" (PR #558 body).
  # name_he_review: agent-checked marks a name an AI agent checked against its sources and no person has read yet
  # (CONTENT_POLICY section 2, rule 6; owner, 2026-10-15); a native speaker reviews it (#564) and then removes the flag.
  - { id: mapai, name: Mapai, name_he: 'מפא"י', name_he_review: agent-checked, name_he_sources: [{ url: "https://he.wikipedia.org/wiki/מפא%22י", checked: 2026-10-14 }] }
  - { id: mapam, name: Mapam, name_he: 'מפ"ם', name_he_review: agent-checked, name_he_sources: [{ url: "https://he.wikipedia.org/wiki/מפ%22ם", checked: 2026-10-14 }] }
