# GDD v0.1 objectives (docs/GDD.md "Objectives" and "Historical events on objective completion"; docs/gdd/objective-card.md).
# Completing an objective records it, scores it and fires its card (R-OBJ-001 to R-OBJ-003); only the GDD loop completes one.
# Sourced facts and links only: the points and the timing bonus are design values in rules.yaml's mvp: block (D-B6 and D-B2,
# #456). Objective 3 is the three-part infrastructure objective decided on #782 and #791 (R-OBJ-005, R-OBJ-006).
objectives:
  - id: railway
    part_of: establish_key_infrastructure
    name: Lay the Haifa–Tel Aviv rail link
    # Q-UI-2's owner-approved Hebrew action label (#782); no new translation was made for this PR.
    name_he: הנחת מסילה
    name_he_review: agent-checked
    completes_when: { corridor_complete: tlv_haifa_rail }
    reference_date: 1949-09-20
    card: railway_complete
    sources:
      - { url: "https://www.nli.org.il/he/newspapers/hbkr/1949/09/14/01/article/70", checked: 2026-10-14 }
      - { url: "https://www.nli.org.il/he/newspapers/mar/1949/09/22/01/article/21", checked: 2026-10-14 }
  - id: burma_road
    part_of: establish_key_infrastructure
    name: Build the Burma Road corridor
    # Q-UI-2's owner-approved Hebrew action label (#782); no new translation was made for this PR.
    name_he: סלילת כביש
    name_he_review: agent-checked
    completes_when: { corridor_complete: burma_road }
    reference_date: 1948-12-07
    card: burma_road_complete
    sources:
      - { url: "https://www.nli.org.il/he/newspapers/hayomjlm/1948/12/08/01/article/2", checked: 2026-10-14 }
      - { url: "https://www.nli.org.il/he/newspapers/haretz/1948/12/08/01/article/18", checked: 2026-10-14 }
      - { url: "https://www.nli.org.il/he/newspapers/mar/1948/12/07/01/article/10", checked: 2026-10-14 }
  - id: yishuvim
    part_of: establish_key_infrastructure
    name: Establish the designated yishuvim
    # Q-UI-2's owner-approved Hebrew action label (#782); no new translation was made for this PR.
    name_he: הקמת יישוב
    name_he_review: agent-checked
    completes_when: { sites_built: [mefalsim, beit_kama, reim, gilat, kiryat_shmona, beit_shemesh] }
    # The last required founding: Beit Shemesh in December 1950, represented by the monthly turn's 15th (#785).
    reference_date: 1950-12-15
    card: first_new_yishuv
    sources:
      - { url: "https://benyehuda.org/read/14684", checked: 2026-10-14 }
      - { url: "https://www.k-8.co.il/he/faq/3/", checked: 2026-10-17 }
      - { url: "https://www.nli.org.il/he/discover/israel/zionism/zionism-history/maabarot", checked: 2026-10-17 }
  - id: absorb_immigrants
    name: Absorb the immigrants
    name_he: קליטת העולים
    name_he_review: agent-checked
    # R-OBJ-004 (D-B4; owner, 18 October 2026, #738, option (a)): once the Jewish population has reached the milestone,
    # the cities' overflow is at most a share of the people they house and their employed at least a share of civilians.
    completes_when:
      absorbed:
        population_at_least: 1000000   # Q-ABS-1's milestone: the Jewish population passes 1,000,000 (JTA, 22 November 1949)
        overflow_at_most: 0.10         # DESIGN VALUE (Q-ABS-2, proposed, owner may override, #375): no comparable historical value
        employed_at_least: 0.40        # DESIGN VALUE (Q-ABS-2): the 1948 national working share, 43.9% (CBS SA 2, Table 9), rounded down
    # Ingathering of the Exiles Day, 20 December 1949 (JTA; content/events/absorb_immigrants.yaml has the sources).
    reference_date: 1949-12-20
    card: absorb_immigrants                    # content/events/absorb_immigrants.yaml
