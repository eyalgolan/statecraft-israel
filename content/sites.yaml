  - id: camp_80
    name: Camp 80
    # For the native reviewer (#564): "Camp 80", the name Gshur and the Palmach archive use (מחנה 80, also מחנה שמונים).
    name_he: מחנה 80
    # Hex from the Hebrew Wikipedia point 32.4628 N, 34.9866 E (the Camp 80 article, today Bahad Dotan; tools/hexgrid.py),
    # at the north-east entrance to Pardes Hanna-Karkur. No 1948 settlement in the hex.
    q: 2
    r: 13
    # A military training camp (owner, "Both military", 17 October 2026, #927): Gshur describes Gadna training there, which
    # included five settlement nuclei that became part of the Nahal's first intake (research on #785).
    kinds: [military_camp]
    # Q-CAMP-1, R-CAMP-002: the nearest MVP city, Hadera, one hex and about 6.7 km away (Zikhron Ya'akov and Netanya are two
    # hexes).
    city: hadera
    # In the window: the Gadna training of the 1931-born intake, settlement nuclei among them, moved here from Kfar Yona on
    # 13 July 1948, after artillery fire hit that camp during the Ten Days (Gshur, pp. 114-115). The first course ended in
    # early October 1948 (Gshur, pp. 120 and 122: the trainees were made soldiers on 12 September and trained about a
    # month more). The Nahal Association gives September 1948; the IDF-published, footnoted article is preferred
    # (CONTENT_POLICY §1) and the disagreement is recorded here (#785, issuecomment-6237625295). [GAP] The day the
    # course ended. [GAP] No depopulated Arab locality was found in the sources read, but no historical GIS clearance has
    # been done (#785). Sources read by AI agents only; status stays draft.
    sources:
      # Benny Gshur, "From a stocking cap to a tembel hat: the Nahal in its first year", Hevra, Tzava uBitahon Leumi 9
      # (Maarachot, July 2025), pp. 114-115: the move to Camp 80 near Pardes Hanna on 13 July 1948; pp. 120 and 122: the
      # first course's end, early October 1948.
      - { url: "https://www.maarachot.idf.il/media/qyen3yoj/%D7%9E%D7%9B%D7%95%D7%91%D7%A2-%D7%92%D7%A8%D7%91-%D7%9C%D7%9B%D7%95%D7%91%D7%A2-%D7%98%D7%9E%D7%91%D7%9C-%D7%94%D7%A0%D7%97%D7%9C-%D7%91%D7%A9%D7%A0%D7%AA%D7%95-%D7%94%D7%A8%D7%90%D7%A9%D7%95%D7%A0%D7%94.pdf", checked: 2026-10-17 }
      # Nahal Association, "Magal ve-Herev": the training at Camp 80 near Pardes Hanna; the first intake finished in
      # September 1948 (the disagreement above).
      - { url: "https://www.nahal.co.il/%D7%9E%D7%92%D7%9C-%D7%95%D7%97%D7%A8%D7%91/", checked: 2026-10-17 }
      # Hebrew Wikipedia, "Batar Dotan" (Camp 80), the revision read for the note: the coordinates of the hex.
      - { url: "https://he.wikipedia.org/w/index.php?oldid=43463565", checked: 2026-10-15 }
    status: draft
  - id: tzrifin
    name: Tzrifin
    name_he: צריפין
