    # D-F1 review.
    q: 14
    r: 2
    kinds: [yishuv]
    # 18 July 1949, the first families and the start of the settlement (owner, #785): 14 families of immigrants from
    # Yemen arrived (Hebrew Wikipedia, citing Goldstein, not read), and the municipality's chronology gives the same day
