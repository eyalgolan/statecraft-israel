    # Sources read by AI agents only; status stays draft. The 1949 Bahad 4 date rests on Hebrew Wikipedia alone here (no
    # citation there); the #785 research adds Israel Hayom and English Wikipedia, which no person has read either.
    sources:
      # Hebrew Wikipedia, "Tzrifin", the revision read for the note: the coordinates and the capture on 18-19 May 1948
      # (citing Al HaMishmar and Haaretz, 20 May 1948, not read).
      - { url: "https://he.wikipedia.org/w/index.php?oldid=43963697", checked: 2026-10-15 }
      # Hebrew Wikipedia, "Bahad 4", the revision read for the note: at Tzrifin from 1949 (year only, no citation).
      - { url: "https://he.wikipedia.org/w/index.php?oldid=43873223", checked: 2026-10-15 }
      # Leshem-Shefer, historical survey of Tzrifin's Compound 1 (January 2016): the camp's place between Road 44, Rishon
      # LeZion, Derekh Haim Herzog and Road 4313, Compound 1's grid point, 1939-46 plans and maps, and the camp taken by
