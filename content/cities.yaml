    employed_share: { value: 0.426, status: sourced, date: 1948-11-08, sources: [{ url: "https://www.cbs.gov.il/he/publications/DocLib/shnaton_saruk/shnaton1950_num1.pdf", checked: 2026-10-15 }] }
    housing_capacity: { value: 248, status: design }   # DESIGN VALUE: owner-set balance, not a historical figure (D-D1, Q-START-1: the start people)
    job_slots: { value: 106, status: design }   # DESIGN VALUE: owner-set balance, not a historical figure (D-C6, Q-START-1: the start employed)
    # D-D5 (owner, 14 October 2026): one military camp and one Hakhshara exist at the start, a design assumption, not a
