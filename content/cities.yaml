# The MVP's twelve Jewish cities and towns (the `city` and `town` rows of map/settlements_1948.yaml) and their start values
# (GDD "Cities and construction"; docs/rules/mvp.md R-CITY-001 to R-CITY-007; GDD Phase 3 PR 1, #732). The six kibbutzim and
# moshavim are not cities in Phase 3 (Q-START-4, owner, 15 October 2026, #375).
#
# Every value says what it is (R-CITY-006):
# - sourced: read from the source named. derived: computed from sourced values. wikipedia-only: an owner-accepted
#   Wikipedia figure. These name their sources (with checked dates) and the day or month they describe.
# - design: a labelled design value, not a historical figure for this city (Q-CUT-1, R-LOOP-005; DesignValuesTests lists
#   each one, and changing one is a balance edit that re-pins the goldens).
#
# people: residents of all groups on the census day, 8 November 1948 (the Registration of Population), used as the start
# on 15 May 1948 ("Census values + defaults", owner, 15 October 2026, on #569). The census counted the people who
# arrived between May and November 1948; Phase 3 PR 2 handles them (Q-ARRV-3). Source: CBS, Statistical Abstract of
# Israel No. 14 (1963), Table 11, "Population in settlements numbering above 5,000 inhabitants on 31 XII 1962
# (1948-1962)", pp. 30-31, unless the row says otherwise. Research: #569, research_notes/GDD phase 3/.
#
# employed_share: the share of the people in work on 8 November 1948 (mobilised soldiers counted in their civilian
# occupation, CBS note).
# - Five cities: the city's share in CBS, Statistical Abstract of Israel No. 1 (1949/50), Registration of Population
#   (8 XI 1948), Table 9, "Jewish population by occupational status and sex (%)", p. 26. It is a share of the Jewish
#   population, applied here to all residents.
# - Seven towns with no city share: the national share, 314,781 working of 716,678 Jews, 43.9% (CBS, Statistical
#   Abstract of Israel No. 2 (1950/51), Table 9, p. 24), as a design value (Q-START-1, owner, 15 October 2026, #375).
#
# housing_capacity and job_slots: no source gives either for any city (#569: "Housing, 0 of 12"; the census counts
# working people, not job slots). Design values (Q-START-1): housing equal to the start people, job slots equal to the
# start employed, so every city starts full and every arrival needs a housing or industry project.
#
# Units (R-CITY-007): counts are population units of rules.yaml mvp.people_per_unit people (D-A1). The loader turns people
# into units to the nearest unit (a half rounds up), with at least 1 for a city with people (Q-START-2, owner,
# 15 October 2026, #375), and the employed to the nearest unit of people times employed_share. housing_capacity and
# job_slots are already in units.
cities:
  - id: jerusalem
    people: { value: 83984, status: sourced, date: 1948-11-08, sources: [{ url: "https://www.cbs.gov.il/he/publications/DocLib/shnaton_saruk/shnaton1963_num14.pdf", checked: 2026-10-15 }] }
    employed_share: { value: 0.342, status: sourced, date: 1948-11-08, sources: [{ url: "https://www.cbs.gov.il/he/publications/DocLib/shnaton_saruk/shnaton1950_num1.pdf", checked: 2026-10-15 }] }
    housing_capacity: { value: 84, status: design }   # DESIGN VALUE: owner-set balance, not a historical figure (D-D1, Q-START-1: the start people)
    job_slots: { value: 29, status: design }   # DESIGN VALUE: owner-set balance, not a historical figure (D-C6, Q-START-1: the start employed)
  - id: tel_aviv
