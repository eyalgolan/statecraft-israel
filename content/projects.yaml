# City projects (GDD "Cities and construction", city projects; docs/rules/mvp.md R-PROJ-001 to R-PROJ-003). The GDD loop
# only. A project is started in a city on a land hex within rules.yaml map_action_max_distance of the city's settlement hex
# (Q-PROJ-2), paid in full at the start and borrowed if the Treasury is short (Q-PROJ-1, Q-MONEY-3), needs no workers
# (Q-PROJ-3), and when its turns are done adds its capacity, condition and job slots to the city once (R-PROJ-003).
# A transit camp also needs the ma'abarot policy (Q-HOUSE-3, D-D3), which carries its sourced date (rules.yaml map actions).
#
# Every number here is a DESIGN VALUE, not a historical figure. Agents proposed them under "Agents propose design values"
# (owner, 15 October 2026, #375; plan docs/superpowers/plans/2026-10-15-gdd-phase-3.md, PR 0, Q-PROJ-1); the owner may
# override them. Costs are IL millions, turns are monthly turns (the turn of the order is the first), capacity and job
# slots are population units, condition is the change to the city's housing condition (0 to 1, R-HOUSE-001).
#   housing: the `housing` map action's cost and +0.03 (rules.yaml map_actions), and build_yishuv_turns' 6 turns.
#   transit_camp: the `transit_camp` map action's cost; built in one turn, as the map action is; its +0.02 housing turned
#     into a condition cost, since D-D3 makes the camp low-condition.
#   industry: the Mefalsim build's pair (build_yishuv_cost 2, build_yishuv_turns 6).
#   winery: the plan's Q-SPEC-2 values (PR 6: industry's IL 2m and 6 turns, and 10 job slots, more than industry's 5).
#     It needs vineyards (`requires:`, R-PROJ-005), which only Rishon LeZion has (cities.yaml; owner, 20 October 2026, #737).
#   arms_workshop: GDD 0.3 only (`rulesets: [gdd-0.3]`; R-ARMS-004, #1701): the loader leaves it out of every other ruleset.
#     IL 15m and 3 turns (owner, 2 November 2026, #1701 OQ2: "IL 15m, 3 turns (Recommended)"; gdd03-balance.yaml
#     arms_workshop cost 15 and work 3). Built, it gives one workshop worker slot (`worker_slots`, the catalogue's 1) and no
#     housing, condition or job slots. Its cycle (R-ARMS-006) reads workshop.staffed_turns and workshop.cost there; the
#     owner's rulings 27M-11 to 27M-14 and Q55 are in docs/rules/mvp.md R-ARMS-004 to R-ARMS-007.
#   housing_repair: GDD 0.3 only (R-HOUSE-006, #1700, #1703): 0.5 Money and 1 work (maintainer call (not an owner ruling):
#     1 work is one turn of work, as arms_workshop's work 3 is its 3 turns) for +10 percentage points of the city's
#     housing condition (owner, 1 November 2026: "Fixed price 0.5 Money + 1 work"; docs/GDD.md "Housing repair price";
#     gdd03-balance.yaml housing_repair cost 0.5, work 1, condition_pp 10, which the loader checks). No capacity or job
#     slots. It is done on the city's own hex and takes no hex of its own, so it is left as no record once done (owner,
#     3 November 2026: "No hex needed (Recommended)").
#     Its name_he "שיפוץ דיור": native review: owner, 3 Nov 2026 ("Approve 'שיפוץ דיור'", recorded on #564,
#     https://github.com/eyalgolan/statecraft-israel/issues/564#issuecomment-6611646005).
# name: the phrase the player reads in a sentence ("a transit camp").
# name_he: the Hebrew UI's noun for the kind (#1122, owner ruling 3), optional: without it the Hebrew UI shows `name`.
#   Draft wording, not a native-language approval: name_he_review: agent-checked until a native speaker reviews it.
#   For the native reviewer (#564).
projects:
  - { id: housing, name: a housing project, name_he: מיזם דיור, name_he_review: agent-checked, cost: 6, turns: 6, capacity: 5, condition: 0.03, job_slots: 0 }        # DESIGN VALUE: owner-set balance, not a historical figure (D-C6, D-A3, D-D3; Q-PROJ-1, Q-HOUSE-3: permanent housing)
  - { id: transit_camp, name: a transit camp, name_he: מעברה, name_he_review: agent-checked, cost: 1.5, turns: 1, capacity: 5, condition: -0.02, job_slots: 0 }   # DESIGN VALUE: owner-set balance, not a historical figure (D-C6, D-A3, D-D3; Q-PROJ-1, Q-HOUSE-3: the low-condition type)
  - { id: industry, name: an industry project, name_he: מיזם תעשייה, name_he_review: agent-checked, cost: 2, turns: 6, capacity: 0, condition: 0, job_slots: 5 }        # DESIGN VALUE: owner-set balance, not a historical figure (D-C6, D-A3; Q-PROJ-1: job slots)
  - { id: winery, name: a winery, name_he: יקב, name_he_review: agent-checked, cost: 2, turns: 6, capacity: 0, condition: 0, job_slots: 10, requires: vineyards }   # DESIGN VALUE: owner-set balance, not a historical figure (D-D8, D-C6; Q-SPEC-2: the specialised industry)
  - { id: arms_workshop, name: an arms workshop, name_he: סדנת נשק, name_he_review: agent-checked, cost: 15, turns: 3, capacity: 0, condition: 0, job_slots: 0, worker_slots: 1, rulesets: [gdd-0.3] }   # DESIGN VALUE: owner-set balance, not a historical figure (D-G6, D-A3; #1701 OQ2, owner 2 November 2026: IL 15m and 3 turns, the recommended option)
  - { id: housing_repair, name: a housing repair, name_he: שיפוץ דיור, cost: 0.5, turns: 1, capacity: 0, condition: 0.1, job_slots: 0, rulesets: [gdd-0.3] }   # DESIGN VALUE: owner-set balance, not a historical figure (D-D2, D-C6, D-A3; #1700, #1703; owner 1 November 2026: "Fixed price 0.5 Money + 1 work", docs/GDD.md "Housing repair price")
