  - id: syrian_army
    kind: unit
    side: syria
    class: infantry
    movement_points: 3                   # DESIGN VALUE: owner-set balance, not a historical figure (D-G2, Q-MOVE-1, #743: points a turn)
  - id: iraqi_army
    kind: unit
    side: iraq
    class: infantry
    movement_points: 3                   # DESIGN VALUE: owner-set balance, not a historical figure (D-G2, Q-MOVE-1, #743: points a turn)
  - id: arab_liberation_army
    kind: unit
    side: ala
