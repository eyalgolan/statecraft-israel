# The GDD v0.1 population and unit types (GDD "Population and units"; docs/rules/mvp.md R-TRAIN-001 to R-TRAIN-003).
# D-A2: civilians, refugees and recruits are counts per city; a halutz is a movable unit. Every number below is a design
# value: the owner's balance, set or accepted in review (Q-CUT-1, owner, 15 October 2026: "Labelled design values"), not
# a historical figure. DesignValuesTests lists them all (R-LOOP-005).
types:
  - { id: civilian, kind: population }
  - { id: refugee, kind: population }
  - id: recruit                          # civilian to recruit, through basic training (GDD "Progression")
    kind: population                     # a count per city until Phase 5
    facility: military_camp
    training_turns: 3                    # DESIGN VALUE: owner-set balance, not a historical figure (D-A3)
    training_cost: 0.5                   # DESIGN VALUE: owner-set balance, not a historical figure (D-A3: IL millions per group)
  - id: halutz                           # civilian to Halutz, through pioneer training in a Hakhshara (GDD "Progression")
    kind: unit                           # a movable unit (D-A2)
    facility: hakhshara
    training_turns: 4                    # DESIGN VALUE: owner-set balance, not a historical figure (D-A3)
    training_cost: 0.5                   # DESIGN VALUE: owner-set balance, not a historical figure (D-A3: IL millions per group)
  - { id: veteran_halutz, kind: unit }  # a halutz unit after rules.yaml mvp.veteran_halutz_service turns of work (R-VET-001; D-D9); not trained
