# Periods are [from, to): a government's `to` is the day its successor was sworn in.
# name_he (#558): the government's he.wiki article title (the Knesset's OData has no government table).
# name_he_review: agent-checked marks a name an AI agent checked against its sources and no person has read yet
# (CONTENT_POLICY section 2, rule 6; owner, 2026-10-15); a native speaker reviews it (#564) and then removes the flag.
governments:
  - id: provisional_government
    name: Provisional Government
    name_he: "הממשלה הזמנית"
    name_he_sources:
      - { url: "https://he.wikipedia.org/wiki/הממשלה_הזמנית", checked: 2026-10-14 }
    # from: every KNS_PersonToPosition row for GovernmentNum 0 starts 1948-05-14. The Declaration's clause 12
    # (minutes of 14 May 1948, 0_ptm_258580) puts Minhelet HaAm in office "from the termination of the Mandate,
    # tonight", i.e. 15 May; the 14/15 May question is open as #457 item 2. to: the day the First Government was
    # sworn in.
    # coalition: the two en.wiki articles below. The records name the 13 ministers across 17 ministry rows with
    # null factions, so they do not carry the 11-list value. One exception (#457): en.wiki lists Gruenbaum as an
    # independent, but his Knesset 0 faction row (PersonID 5904) reads "הציונים הכלליים" (General Zionists), so he
    # counts with general_zionists.
    from: 1948-05-14
    to: 1949-03-10
    coalition: [mapai, mapam, general_zionists, new_aliyah, mizrachi, hapoel_hamizrachi, agudat_yisrael, sephardim, ahdut_haavoda_poalei_tzion, poale_zion_left]
    sources:
      # coalition rests on these two en.wiki articles, except Gruenbaum's party (his faction row, below).
      - { url: "https://en.wikipedia.org/wiki/Provisional_government_of_Israel", checked: 2026-10-09 }
      - { url: "https://en.wikipedia.org/wiki/Provisional_State_Council", checked: 2026-10-09 }
      - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=GovernmentNum%20eq%200", checked: 2026-10-14 }
      - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=KnessetNum%20eq%200", checked: 2026-10-14 }
      - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=PersonID%20eq%205904%20and%20KnessetNum%20eq%200", checked: 2026-10-18 }
      - { url: "https://fs.knesset.gov.il/0/Plenum/0_ptm_258580.pdf", checked: 2026-10-14 }
      - { url: "https://fs.knesset.gov.il/1/Plenum/1_ptm_250182.pdf", checked: 2026-10-14 }
    status: fact-checked
  - id: first_government
    name: First Government
    name_he: "ממשלת ישראל הראשונה"
    name_he_sources:
      - { url: "https://he.wikipedia.org/wiki/ממשלת_ישראל_הראשונה", checked: 2026-10-14 }
    # Sources differ (8 vs 10 March 1949); 10 March is the Knesset confidence vote recorded in Ben-Gurion's diary.
    from: 1949-03-10
    # Ben-Gurion resigned 15 October 1950 (some pages give 16 October, and 30 October also appears as a
    # dissolution date). The successor was sworn in on 1 November 1950, which is the handover date used here.
    to: 1950-11-01
    coalition: [mapai, united_religious_front, progressive, sephardim, democratic_list_nazareth]
    sources:
      - { url: "https://bengurionarchive.bgu.ac.il/en/node/14566", checked: 2026-10-09 }
      - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=GovernmentNum%20eq%201", checked: 2026-10-14 }
      - { url: "https://fs.knesset.gov.il/1/Plenum/1_ptm_250182.pdf", checked: 2026-10-14 }
      - { url: "https://fs.knesset.gov.il/1/Plenum/1_ptm_250243.pdf", checked: 2026-10-14 }
      - { url: "https://fs.knesset.gov.il/1/Plenum/1_ptm_250247.pdf", checked: 2026-10-14 }
      - { url: "https://web.archive.org/web/20160303211859/http://www.knesset.gov.il/history/eng/eng_hist1_s.htm", checked: 2026-10-14 }
    status: fact-checked
  - id: second_government
    name: Second Government
    name_he: "ממשלת ישראל השנייה"
    name_he_sources:
      - { url: "https://he.wikipedia.org/wiki/ממשלת_ישראל_השנייה", checked: 2026-10-14 }
    # Approved 69-42 with 2 abstentions on 1 November 1950. Resigned 14 February 1951 and served as a transitional
    # government until the Third Government was sworn in on 8 October 1951. From 20 August 1951 its parties are measured
    # against the Second Knesset, where the United Religious Front and the Democratic List of Nazareth held no seats.
    # Their MKs sat there for the lists that join on that day (Knesset faction records, #315): the Front's for Hapoel
    # HaMizrachi, Mizrachi, Agudat Yisrael and Poalei Agudat Yisrael (Shapira's and Levin's Second Knesset rows are 25993
    # and 25938), and Seif el-Din el-Zoubi of the Nazareth list for the Democratic List for Israeli Arabs (row 25856).
    # The two old lists stay, as for the Sixth Government: each list has seats in only one of the two Knessets. That makes
    # 69 of 120.
    from: 1950-11-01
    to: 1951-10-08
    coalition: [mapai, united_religious_front, progressive, sephardim, democratic_list_nazareth]
    coalition_changes:
      - date: 1951-08-20
        joins: [hapoel_hamizrachi, mizrachi, agudat_yisrael, poalei_agudat_yisrael, democratic_list_israeli_arabs]
        sources:
          - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_Faction?$filter=KnessetNum%20eq%202", checked: 2026-10-14 }
          - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=FactionID%20eq%20131", checked: 2026-10-14 }
          - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=FactionID%20eq%20111", checked: 2026-10-14 }
          - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=KnessetNum%20eq%202", checked: 2026-10-14 }
          - { url: "https://web.archive.org/web/20160522174905/https://www.knesset.gov.il/history/eng/eng_hist2_s.htm", checked: 2026-10-14 }
    sources:
      - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=GovernmentNum%20eq%202", checked: 2026-10-14 }
      - { url: "https://fs.knesset.gov.il/1/Plenum/1_ptm_250247.pdf", checked: 2026-10-14 }
      - { url: "https://fs.knesset.gov.il/1/Plenum/1_ptm_250266.pdf", checked: 2026-10-14 }
      - { url: "https://fs.knesset.gov.il/2/Plenum/2_ptm_250617.pdf", checked: 2026-10-14 }
      - { url: "https://web.archive.org/web/20160303211859/http://www.knesset.gov.il/history/eng/eng_hist1_s.htm", checked: 2026-10-14 }
      - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=KnessetNum%20eq%202", checked: 2026-10-14 }
    status: fact-checked
  - id: third_government
    name: Third Government
    name_he: "ממשלת ישראל השלישית"
    name_he_sources:
      - { url: "https://he.wikipedia.org/wiki/ממשלת_ישראל_השלישית", checked: 2026-10-14 }
    # Coalition of 65 seats per he.wiki. Democratic List for Israeli Arabs, Progress and Work and Agriculture and
    # Development were Mapai-affiliated minority lists without ministers. The Progressive Party and the General Zionists
    # were in opposition. Investiture vote 56-40 (he.wiki citing Haaretz, 9 October 1951). Agudat Yisrael and Poalei
    # Agudat Yisrael left the coalition in September 1952 (#278). The Knesset's position record ends Levin's Welfare term
    # on 18 September 1952, and he.wiki's table gives 18 September for the party's exit; he.wiki's text gives 23
    # September, but its own footnote cites a press report of 19 September 1952, so 18 September is used. The Knesset's
    # session list (KNS_PlenumSession) has no plenum sitting between 28 August and 3 November 1952, so there is no
    # plenum record: the position record and he.wiki are the only sources for the date.
    # DECISION FOR THE MAINTAINER (proposal, change it if you prefer another rule): the coalition then held 60 of 120
    # seats, which is half and not more than half. HasMajority stays "more than half", so a vote that needs a majority
    # (SetPolicy, and AllocateBudget while the legislature approves the budget) fails from 18 September to 24 December
    # 1952. Why: it is the simplest rule, it follows the seat count, and it breaks nothing: the historical AI sends no policy or budget order, so a historical run never
    # votes, and a player can still act in other ways (events, cabinet changes, security orders). Other options: a
    # tie-break in favour of the government, or a confidence rule; both need a new rule in the sim.
    from: 1951-10-08
    to: 1952-12-24
    coalition: [mapai, hapoel_hamizrachi, agudat_yisrael, democratic_list_israeli_arabs, mizrachi, poalei_agudat_yisrael, progress_and_work, agriculture_and_development]
    coalition_changes:
      - date: 1952-09-18
        leaves: [agudat_yisrael, poalei_agudat_yisrael]
        sources:
          - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=GovernmentNum%20eq%203", checked: 2026-10-12 }
          - { url: "https://he.wikipedia.org/wiki/ממשלת_ישראל_השלישית", checked: 2026-10-12 }
    sources:
      - { url: "https://he.wikipedia.org/wiki/ממשלת_ישראל_השלישית", checked: 2026-10-12 }
      - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=GovernmentNum%20eq%203", checked: 2026-10-12 }
      - { url: "https://fs.knesset.gov.il/2/Plenum/2_ptm_250617.pdf", checked: 2026-10-14 }
      - { url: "https://web.archive.org/web/20160522174905/https://www.knesset.gov.il/history/eng/eng_hist2_s.htm", checked: 2026-10-14 }
      - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=KnessetNum%20eq%202", checked: 2026-10-14 }
    status: fact-checked
  # Governments of 1952-1956 (#26). Dates and ministers follow the Knesset's position records (knesset.gov.il OData, one
  # query per government), checked against he.wiki and en.wiki and against the plenum record of each formation.
  - id: fourth_government
    name: Fourth Government
    name_he: "ממשלת ישראל הרביעית"
    name_he_sources:
      - { url: "https://he.wikipedia.org/wiki/ממשלת_ישראל_הרביעית", checked: 2026-10-14 }
    # Ben-Gurion named the ministers on 22 December 1952, won the confidence vote on 23 December (63 to 24), and the
    # ministers were sworn in on 24 December, when Hapoel HaMizrachi's Shapira and Burg joined (plenum records). The
    # General Zionists' 20 seats count with the Sephardim (2) and the Yemenite Association (1): those three MKs sat in
    # the General Zionist faction from 10 September 1951 (Knesset faction records; he.wiki gives the faction 23 seats).
    # That makes 87 of 120, as in he.wiki. The General Zionists left on 25 May 1953 and returned on 3 June 1953 (#278),
    # per the plenum records: on 25 May 1953 (evening sitting, 2_ptm_250584.pdf) the Prime Minister told the Knesset,
    # under section 11 of the Transition Law, that the four General Zionist ministers (Rokach, Bernstein, Sapir, Serlin)
    # had resigned; on 3 June 1953 (2_ptm_250727.pdf) the Knesset approved the government's decision to add the four
    # again, and they made their declarations of allegiance. he.wiki gives 26 May and 2 June (citing Davar of 26 May).
    # Without the General Zionists and the three MKs who sat in their faction, the coalition held 64 seats (he.wiki).
    # The position records (KNS_PersonToPosition) show the four ministers' terms without a break. people.yaml follows the
    # plenum record instead: the four terms end on 25 May and start again on 3 June, and the Prime Minister holds the
    # four ministries in between, as he told the Knesset on 25 May (#314).
    from: 1952-12-24
    to: 1954-01-26
    coalition: [mapai, general_zionists, sephardim, yemenite_association, hapoel_hamizrachi, mizrachi, progressive, democratic_list_israeli_arabs, progress_and_work, agriculture_and_development]
    coalition_changes:
      - date: 1953-05-25
        leaves: [general_zionists, sephardim, yemenite_association]
        sources:
          - { url: "https://fs.knesset.gov.il/2/Plenum/2_ptm_250584.pdf", checked: 2026-10-12 }
          - { url: "https://fs.knesset.gov.il/2/Plenum/2_ptm_250724.pdf", checked: 2026-10-12 }
          - { url: "https://he.wikipedia.org/wiki/ממשלת_ישראל_הרביעית", checked: 2026-10-12 }
      - date: 1953-06-03
        joins: [general_zionists, sephardim, yemenite_association]
        sources:
          - { url: "https://fs.knesset.gov.il/2/Plenum/2_ptm_250727.pdf", checked: 2026-10-12 }
          - { url: "https://he.wikipedia.org/wiki/ממשלת_ישראל_הרביעית", checked: 2026-10-12 }
    sources:
      - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=GovernmentNum%20eq%204", checked: 2026-10-12 }
      - { url: "https://he.wikipedia.org/wiki/ממשלת_ישראל_הרביעית", checked: 2026-10-12 }
      - { url: "https://en.wikipedia.org/wiki/Fourth_government_of_Israel", checked: 2026-10-12 }
      - { url: "https://fs.knesset.gov.il/2/Plenum/2_ptm_250689.pdf", checked: 2026-10-12 }
      - { url: "https://fs.knesset.gov.il/2/Plenum/2_ptm_250692.pdf", checked: 2026-10-12 }
      - { url: "https://fs.knesset.gov.il/2/Plenum/2_ptm_250350.pdf", checked: 2026-10-12 }
      - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=KnessetNum%20eq%202%20and%20PositionID%20eq%2054", checked: 2026-10-12 }
    status: fact-checked
  - id: fifth_government
    name: Fifth Government
    name_he: "ממשלת ישראל החמישית"
    name_he_sources:
      - { url: "https://he.wikipedia.org/wiki/ממשלת_ישראל_החמישית", checked: 2026-10-14 }
    # Sharett's first government, approved 75 to 23 on 26 January 1954, with the same parties as the Fourth. The
    # Progressives had not decided on 25 January 1954 and joined on 1 February (#278). On 1 February the Prime Minister
    # told the Knesset that the Progressive Party had decided to return to the coalition and that the government had
    # decided to add Pinchas Rosen as Minister of Justice; the Knesset's position record starts Rosen's Justice term
    # that day.
    from: 1954-01-26
    to: 1955-06-29
    coalition: [mapai, general_zionists, sephardim, yemenite_association, hapoel_hamizrachi, mizrachi, democratic_list_israeli_arabs, progress_and_work, agriculture_and_development]
    coalition_changes:
      - date: 1954-02-01
        joins: [progressive]
        sources:
          - { url: "https://fs.knesset.gov.il/2/Plenum/2_ptm_250778.pdf", checked: 2026-10-12 }
          - { url: "https://fs.knesset.gov.il/2/Plenum/2_ptm_250782.pdf", checked: 2026-10-12 }
          - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=GovernmentNum%20eq%205", checked: 2026-10-12 }
          - { url: "https://he.wikipedia.org/wiki/ממשלת_ישראל_החמישית", checked: 2026-10-12 }
    sources:
      - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=GovernmentNum%20eq%205", checked: 2026-10-12 }
      - { url: "https://he.wikipedia.org/wiki/ממשלת_ישראל_החמישית", checked: 2026-10-12 }
      - { url: "https://en.wikipedia.org/wiki/Fifth_government_of_Israel", checked: 2026-10-12 }
      - { url: "https://fs.knesset.gov.il/2/Plenum/2_ptm_250778.pdf", checked: 2026-10-12 }
      - { url: "https://fs.knesset.gov.il/2/Plenum/2_ptm_250781.pdf", checked: 2026-10-12 }
    status: fact-checked
  - id: sixth_government
    name: Sixth Government
    name_he: "ממשלת ישראל השישית"
    name_he_sources:
      - { url: "https://he.wikipedia.org/wiki/ממשלת_ישראל_השישית", checked: 2026-10-14 }
    # Formed on 29 June 1955 without the General Zionists. Sharett told the Knesset that day that Mapai, Mizrachi,
    # Hapoel HaMizrachi and the Progressive Party had agreed to support it (plenum record); he.wiki agrees. en.wiki's
    # text says the Progressives were dropped, though Rosen stayed at Justice; the plenum record is used. It stayed in
    # office as a caretaker after the 26 July 1955 election. From 15 August 1955 it faces the Third Knesset, where
    # Hapoel HaMizrachi and Mizrachi sat as the National Religious Front (Knesset faction records), so that list is in
    # the coalition too; each list has seats in only one of the two Knessets.
    from: 1955-06-29
    to: 1955-11-03
    coalition: [mapai, hapoel_hamizrachi, mizrachi, national_religious_front, progressive, democratic_list_israeli_arabs, progress_and_work, agriculture_and_development]
    sources:
      - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=GovernmentNum%20eq%206", checked: 2026-10-12 }
      - { url: "https://he.wikipedia.org/wiki/ממשלת_ישראל_השישית", checked: 2026-10-12 }
      - { url: "https://en.wikipedia.org/wiki/Sixth_government_of_Israel", checked: 2026-10-12 }
      - { url: "https://fs.knesset.gov.il/2/Plenum/2_ptm_250532.pdf", checked: 2026-10-12 }
      - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=PersonID%20eq%202661%20and%20KnessetNum%20eq%203", checked: 2026-10-12 }
    status: fact-checked
  - id: seventh_government
    name: Seventh Government
    name_he: "ממשלת ישראל השביעית"
    name_he_sources:
      - { url: "https://he.wikipedia.org/wiki/ממשלת_ישראל_השביעית", checked: 2026-10-14 }
    # Ben-Gurion named the ministers on 2 November 1955 and won the confidence vote on 3 November, 73 to 32 (plenum
    # records). 80 of 120 seats with the three Arab lists (he.wiki; IDI per research_notes/M4 content
    # 1952-56/election-1955.md). It served until 7 January 1958, after the content range, so it has no end date.
    from: 1955-11-03
    coalition: [mapai, national_religious_front, ahdut_haavoda_poalei_tzion, mapam, progressive, democratic_list_israeli_arabs, progress_and_work, agriculture_and_development]
    sources:
      - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=GovernmentNum%20eq%207", checked: 2026-10-12 }
      - { url: "https://he.wikipedia.org/wiki/ממשלת_ישראל_השביעית", checked: 2026-10-12 }
      - { url: "https://en.wikipedia.org/wiki/Seventh_government_of_Israel", checked: 2026-10-12 }
      - { url: "https://fs.knesset.gov.il/3/Plenum/3_ptm_251309.pdf", checked: 2026-10-12 }
      - { url: "https://fs.knesset.gov.il/3/Plenum/3_ptm_251311.pdf", checked: 2026-10-12 }
    status: fact-checked
