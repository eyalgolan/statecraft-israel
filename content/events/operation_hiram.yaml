  - { url: "https://bengurionarchive.bgu.ac.il/node/12338", checked: 2026-10-14 }
  # Izkor, the Ministry of Defense memorial site: Sheikh Abd, the summit above Kibbutz Manara, taken by Qawuqji's
  # forces; fighting there on 22 October 1948; Manara relieved in Operation Hiram.
  - { url: "https://www.izkor.gov.il/%D7%99%D7%A2%D7%A7%D7%91%20%D7%91%D7%95%D7%91%D7%A8/en_7ff130c52733b6aa60625807a0342f08", checked: 2026-10-14 }
  # The Knesset's summary of the War of Independence: Operation Hiram, 29-31 October 1948, took the Upper Galilee.
