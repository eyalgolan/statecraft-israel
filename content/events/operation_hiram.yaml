id: operation_hiram
title: Operation Hiram
text: 'In breach of the truce, the Arab Liberation Army attacked the Sheikh Abd position above Kibbutz Manara on 22 October. Between 29 and 31 October Moshe Carmel''s forces drove it out of the Upper Galilee in Operation Hiram, and a cease-fire took effect on 31 October. {defense_minister} must decide whether the forces stop at the cease-fire or advance further into Lebanon.'
# For the native reviewer (#564): מבצע חירם, צבא ההצלה, משלט שייח' עבד, מנרה, משה כרמל and הגליל העליון
# follow he.wiki "מבצע חירם" ("משלטי שייח' עבד"): https://he.wikipedia.org/wiki/מבצע_חירם
title_he: מבצע חירם
text_he: 'בהפרת ההפוגה תקף צבא ההצלה את משלט שייח׳ עבד שמעל קיבוץ מנרה ב־22 באוקטובר. בין 29 ל־31 באוקטובר הדפו כוחותיו של משה כרמל את צבא ההצלה מן הגליל העליון במבצע חירם, והפסקת אש נכנסה לתוקף ב־31 באוקטובר. ההחלטה אם הכוחות יעצרו עם הפסקת האש או יתקדמו הלאה לתוך לבנון בידי {defense_minister}.'
text_he_review: agent-checked
anchor: soft
tags: [security, war-casualties]
office: defense_minister
# Trigger: the attack on 22 October 1948 and sniping at Manara on 24-25 October (en.wiki "Operation Hiram"; the Acting
# Mediator's report S/1071 dates the attack to the night of 21-22 October and the return to the hills to the night of
# 24-25 October; Ben-Gurion's diary, 22 and 24 October). Dates [C]: 29-31 October, launched on the night of 28-29
# October (en.wiki "Operation Hiram", used here; the Knesset's war summary gives 29-31 October; Ben-Gurion's diary of 28
# October and S/1071 have the attack begin that night); 28-31 October per PalQuest and the original order of 28 October
# [S]; en.wiki "1948 Arab-Israeli War" gives 24 October, an outlier not used. Cease-fire 31 October at 11:00
# (Ben-Gurion's diary, 31 October; S/1071 has the Israeli cease-fire order effective at 0600 GMT). Ben-Gurion declined
# to authorise an advance further into Lebanon, fearing international condemnation (en.wiki "Operation Hiram"): the
# third option. Owner ruling: the text stays military. Research notes facts-1948.md section 8.
# The card is a decision after the fact (owner decision, 15 October 2026, #567;
# docs/superpowers/specs/2026-10-14-event-timing-monthly.md):
# no monthly turn date falls between the attack of 22 October and the launch. The window opens on 31 October, the
# cease-fire, and ends on 15 November. The "protest to the UN" option (a game assumption) is gone: it belonged to the
# decision before the operation.
from: 1948-10-31
to: 1948-11-16
