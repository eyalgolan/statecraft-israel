  # The Acting Mediator's report of 6 November 1948 (S/1071): the Arab Liberation Army took hill positions inside the
  # Israeli truce lines near Manara on the night of 21-22 October; on 28 October Qawuqji's chief of staff told the UN
  # observers his forces would not be withdrawn; on 23 October the Israeli commander said they would be driven out if
  # not removed, and on 29 October Israel told the UN its action was defensive.
  - { url: "https://documents.un.org/api/symbol/access?s=S/1071&l=en&t=pdf", checked: 2026-10-14 }
  # Ben-Gurion's diary (Ben-Gurion Archives): 22 October, Moshe Carmel reports that Qawuqji has taken positions near
  # Manara; 24 October, Qawuqji holds the area and the road to Metulla; 28 October, the operation in the north begins
  # that evening; 29 October, Israel answers the UN observers that it cannot stop while Manara is in danger and Qawuqji
  # has not left the positions; 31 October, at Northern Front headquarters, the order to cease fire at 11 and "Abid"
  # (indexed by the archive as Sheikh Abd) retaken.
