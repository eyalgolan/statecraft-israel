title: >-
  A guard for Jerusalem
title_he: >-
  כוח שישמור על ירושלים
text: >-
  In the record, a US State Department memorandum of 1 July 1948 assumed that proposed demilitarisation would involve the withdrawal of regular and irregular forces from both sides, with a proposed UN armed guard in their place. In its recorded reply of 28 July, the Provisional Government linked its rejection to the Mediator's proposal to place Jerusalem ultimately under Arab rule. On this branch, {prime_minister} must decide whether to continue demilitarisation or return to Israeli military government.
text_he: >-
  בתיעוד ההיסטורי, תזכיר של מחלקת המדינה האמריקנית מ־1 ביולי 1948 העריך שפירוז מוצע יכלול יציאה של כוחות סדירים ובלתי סדירים משני הצדדים, וכוח משמר חמוש מוצע של האו״ם במקומם. בתשובתה המתועדת מ־28 ביולי קשרה הממשלה הזמנית את התנגדותה להצעת המתווך להעביר לבסוף את ירושלים לשלטון ערבי. במסלול הזה, {prime_minister} צריך להחליט אם להמשיך בפירוז או לחזור לממשל צבאי ישראלי.
