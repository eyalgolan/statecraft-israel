# yaml-language-server: $schema=../schema/event.schema.json
id: hula_drainage
title: Draining the Hula
text: 'Drainage works south of Lake Hula, under the Palestine Land Development Company''s concession, reach into the demilitarised zone with Syria. Syria has complained, and the chairman of the armistice commission asks that work stop pending agreement. {prime_minister} must decide.'
# For the native reviewer (#564): Hebrew terminology follows he.wiki "ייבוש החולה" (ימת החולה, החברה להכשרת
# היישוב, השטח המפורז): https://he.wikipedia.org/wiki/ייבוש_החולה
title_he: ייבוש החולה
text_he: 'עבודות הניקוז מדרום לימת החולה, במסגרת הזיכיון של החברה להכשרת היישוב, מגיעות אל השטח המפורז עם סוריה. סוריה התלוננה, ויושב ראש ועדת שביתת הנשק מבקש להפסיק את העבודות עד להשגת הסכמה. על {prime_minister} להחליט.'
text_he_review: agent-checked
anchor: soft
tags: [security]
office: prime_minister
# Works began about 14 February 1951 and Syria complained on 21 February. The window opens on 7 March, when General
# Riley's memo recommended that work stop pending agreement (research notes section 8). FRUS 1951 v.V doc 288 is dated
# 5 March 1951; the notes give 7 March for Riley's request, and both dates are recorded here.
from: 1951-03-07
to: 1951-05-18
# R-SWAMP-002 (Q-SWAMP-2, owner, 17 October 2026, #782): the card is about works in progress, so in the GDD loop it fires
# only while the player's works at the Hula swamp site are in progress. Text, options and sources are unchanged.
site: hula
options:
  - id: continue_works
    text: Continue the works and assert Israel's rights in the zone
    text_he: להמשיך בעבודות ולעמוד על זכויות ישראל באזור
    historical: true
    recommended: true
    effects:
      - { target: security, delta: 0.03 }
      - { target: intl_standing, delta: -0.05 }
  - id: halt
    text: Halt the works until there is agreement
    text_he: להפסיק את העבודות עד להשגת הסכמה
    # Who proposed it: research_notes/Alternate timelines/roads-checked.md (checked by the owner, 19 October 2026).
    alternative:
      basis: debated
      by: the Israeli government, through its delegation to the Mixed Armistice Commission
      date: 1951-03-08
      sources:
        - { url: "https://history.state.gov/historicaldocuments/frus1951v05/d308", checked: 2026-10-17 }
    effects:
      - { target: security, delta: -0.03 }
      - { target: intl_standing, delta: 0.03 }
sources:
