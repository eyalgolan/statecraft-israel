# yaml-language-server: $schema=../schema/event.schema.json
id: bernadotte_assassination
title: The Mediator Assassinated
text: 'Lehi gunmen have assassinated the UN mediator, Count Folke Bernadotte, in Jerusalem, a day after he completed his second plan. {prime_minister} must decide how the government answers the armed groups still outside the IDF: Lehi, and the Irgun battalions in Jerusalem.'
anchor: hard
tags: [security, terror]
office: prime_minister
# Assassinated 17 September 1948 in Katamon, Jerusalem, by Lehi (Bunche's cable of 17 September, S/1004: the murder
# "in Katamon quarter of Jerusalem today by Jewish assailants"; Israel's report to the Security Council, S/1315, dates
# it 17 September; en.wiki "1948 in Israel"; a footnote on en.wiki "Lehi" gives 16 September, an outlier; Ben-Gurion
# told the Provisional State Council on 23 September that the killing was on the Friday, in Jerusalem, and that Lehi
# men had apparently done it; JTA reports the claim by a group calling itself the Fatherland Front, which the
# government called a Lehi splinter and a Lehi source said it did not know). His second plan was completed on
# 16 September (the date of his progress report). About 200 Lehi members were arrested (Ben-Gurion: 184 in Jerusalem
# and 62 in the Tel Aviv district; S/1315: 184 in Jerusalem and 82 in Tel Aviv and other parts of the country by
# 23 September; JTA: hundreds, 200 moved to Jaffa); Yellin-Mor and Shmuelevitz on 29 September (S/1315, found hiding
# in Haifa; en.wiki "Lehi"; JTA's bulletin of 1 October has them taken in Haifa "today"). Dates [C]: emergency
# regulations about 20 September (a UN cable of 21 September; S/1315 has them promulgated on 20 September, with the
# proclamation of Lehi and the Fatherland Front as terrorist organisations in the Official Gazette that day;
# Ben-Gurion told the council the cabinet approved them in principle on the Saturday night, 18 September; JTA's
# bulletins of 20 and 21 September, without datelines, have them promulgated and then signed), the Prevention of
# Terrorism Ordinance No. 33 (its number as the Official Gazette prints it, below) on 23 September (the council's
# minutes, used here, have it adopted on 23 September by 34 votes; S/1315 has the council re-enact the regulations as an
# ordinance that day; the Official Gazette, No. 24 of 29 September, prints it dated 19 Elul 5708, 23 September 1948,
# which supports 23 September for the ordinance and 29 September for its publication, as the Knesset's law database
# has it; [C] en.wiki "Lehi" says three days after). The IDF gave the Jerusalem Irgun 24 hours to disband
# from 12:00 on 20 September (daat.ac.il [S]; Ben-Gurion read the ultimatum to the council on 23 September and said the
# Irgun accepted within the 24 hours); JVL says its battalions disbanded on 20 September, a US consul's report says the
# Irgun agreed on 21 September (FRUS [S]).
# Research notes facts-1948.md section 6.
from: 1948-09-17
to: 1948-09-24
options:
  - id: outlaw
    text: Outlaw Lehi, arrest its members and order the Irgun in Jerusalem to disband into the IDF
    historical: true
    recommended: true
    effects:
      - { target: intl_standing, delta: -0.05 }   # the killing itself, shared by both options (notes section 6)
      - { target: intl_standing, delta: 0.03 }    # partial recovery from the crackdown
      - { target: security, delta: 0.01 }
  - id: investigate_only
    # Game assumption: the notes name no advocate for this option.
    text: Investigate the killing without a general crackdown
    effects:
      - { target: intl_standing, delta: -0.05 }   # the killing itself, shared by both options (notes section 6)
      - { target: intl_standing, delta: -0.10 }
