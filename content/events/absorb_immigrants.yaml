id: absorb_immigrants
title: One million
text: 'On 20 December 1949 Israel marked Ingathering of the Exiles Day: its Jewish population had passed one million. A month earlier, with the arrival of 663 immigrants from Tripoli, the Ministry of Immigration had put the Jewish population at 1,000,000, with 321,991 newcomers since 15 May 1948.'
