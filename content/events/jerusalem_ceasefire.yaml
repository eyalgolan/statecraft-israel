# yaml-language-server: $schema=../schema/event.schema.json
id: jerusalem_ceasefire
title: Cease-fire in Jerusalem
text: 'After talks that began on 28 November, Dayan and Abdullah el-Tell signed a full cease-fire for the Jerusalem area at Government House on 30 November, with UN observers present. {prime_minister} must decide whether Israel keeps to it.'
# For the native reviewer (#564): משה דיין, עבדאללה א-תל, ארמון הנציב and האו״ם follow he.wiki
# (https://he.wikipedia.org/wiki/משה_דיין; https://he.wikipedia.org/wiki/עבדאללה_א-תל;
# https://he.wikipedia.org/wiki/ארמון_הנציב; https://he.wikipedia.org/wiki/האומות_המאוחדות).
title_he: הפסקת אש בירושלים
text_he: 'לאחר שיחות שהחלו ב־28 בנובמבר, חתמו דיין ועבדאללה א־תל על הפסקת אש מלאה באזור ירושלים בארמון הנציב ב־30 בנובמבר, בנוכחות משקיפי האו״ם. ההחלטה אם ישראל תקיים אותה בידי {prime_minister}.'
text_he_review: agent-checked
anchor: hard
tags: [security]
office: prime_minister
# Signed on 30 November 1948 at Government House, UN observers present (FRUS 1948 v.V pt 2, editorial note d800 [V]);
# talks began on 28 November (UN press release [S]). On 23 December el-Tell apparently received new orders and avoided
# further talks (FRUS d844 [S]). Partial releases of prisoners followed [S]. Research notes facts-1948.md section 13b.
# Only a player who put Jerusalem under military government sees this card. The gating is a design inference, not in the
# notes: with a demilitarised city there would be no IDF commander to sign. The card is a decision after the fact
# (owner decision, 15 October 2026, #567;
# docs/superpowers/specs/2026-10-14-event-timing-monthly.md):
# no monthly turn date falls between the talks and the signing, so the window opens on 30 November and ends on
# 15 December, and the text states the signing.
from: 1948-11-30
to: 1948-12-16
requires: [{ event: jerusalem_military_government, option: military_government }]
options:
  - id: keep
    text: Keep to the Jerusalem cease-fire
    text_he: לקיים את הפסקת האש בירושלים
    historical: true
    recommended: true
    effects:
      - { target: security, delta: 0.015 }
  - id: hold_out
    # The alternative named in the notes (section 13b). Game assumption: no one is recorded arguing for it; its effects are
    # design values.
    text: Press on for the Old City and the Latrun road
    text_he: להמשיך ולהילחם על העיר העתיקה ועל דרך לטרון
    alternative: { basis: design }
    effects:
      - { target: security, delta: -0.015 }
      - { target: intl_standing, delta: -0.03 }
sources:
  - { url: "https://history.state.gov/historicaldocuments/frus1948v05p2/d800", checked: 2026-10-10 }
status: fact-checked
