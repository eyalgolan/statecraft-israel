# yaml-language-server: $schema=../schema/event.schema.json
id: armistice_egypt
title: Armistice with Egypt
text: 'Talks in Rhodes have produced an armistice agreement with Egypt. {prime_minister} must decide whether Israel signs.'
# For the native reviewer (#564): Hebrew terminology follows he.wiki "הסכמי שביתת הנשק בתום מלחמת העצמאות":
# https://he.wikipedia.org/wiki/הסכמי_שביתת_הנשק_בתום_מלחמת_העצמאות
title_he: שביתת הנשק עם מצרים
text_he: 'השיחות ברודוס הניבו הסכם שביתת נשק עם מצרים. על {prime_minister} להחליט אם ישראל תחתום עליו.'
text_he_review: agent-checked
anchor: hard
office: prime_minister
from: 1949-02-24
# Hard anchor: fires on the first turn on or after `from`. `to` (exclusive, end of 1949) only makes the window finite,
# so the {prime_minister} placeholder needs a holder through 1949 and not past the holder's death (#1).
to: 1950-01-01
options:
  - id: sign
    text: Sign the armistice
    text_he: לחתום על הסכם שביתת הנשק
    historical: true
    recommended: true
    set_rung: 2
    effects:
      - { target: intl_standing, delta: 0.05 }
  - id: hold_out
    text: Refuse and keep fighting
    text_he: לסרב ולהמשיך בלחימה
    alternative: { basis: design }
    # Owner decision of 17 October 2026 (#937), "Yes, match the others": refusing keeps the war going at rung 4, as on
    # the Jordan, Lebanon and Syria fronts.
    set_rung: 4
    effects:
      - { target: intl_standing, delta: -0.10 }
sources:
  - { url: "https://avalon.law.yale.edu/20th_century/arm01.asp", checked: 2026-10-14 }
  - { url: "https://unispal.un.org/pdfs/634DB5CC6628D5C88525643C00766FB9.pdf", checked: 2026-10-14 }
status: fact-checked
