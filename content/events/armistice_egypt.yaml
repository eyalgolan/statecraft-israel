# yaml-language-server: $schema=../schema/event.schema.json
id: armistice_egypt
title: Armistice with Egypt
text: 'Talks in Rhodes have produced an armistice agreement with Egypt. {prime_minister} must decide whether Israel signs.'
# For the native reviewer (#564): Hebrew terminology follows he.wiki "הסכמי שביתת הנשק בתום מלחמת העצמאות":
# https://he.wikipedia.org/wiki/הסכמי_שביתת_הנשק_בתום_מלחמת_העצמאות
title_he: שביתת הנשק עם מצרים
text_he: 'השיחות ברודוס הניבו הסכם שביתת נשק עם מצרים. על {prime_minister} להחליט אם ישראל תחתום עליו.'
# R-WAR-008 (owner, 9 November 2026, #1709: "Separate early text (Recommended)", "You approve the words (Recommended)";
# the English "Approve as written (Recommended)", the Hebrew "Approve with my choices (Recommended)", with "עם" and
# "התקיימו (Recommended)"): the text when the card is shown before its `from` (the early path), under the
# "Alternative course" banner. No date: an early card's date is the player's.
# It names no Rhodes ("No Rhodes (Recommended)"): an early card can come from the 15 December 1948 turn, and the
# Rhodes talks opened on 13 January 1949 (rhodes_talks.yaml).
# For the native reviewer (#564): early_text_he is agent-written; the owner approved its exact words (#1709, 9 November
# 2026). It keeps the card's terms "שביתת נשק" / "הסכם שביתת נשק" (he.wiki, as noted above).
early_text: 'The front with Egypt has been quiet, and the armistice talks have come sooner than in history: negotiators have reached an armistice agreement with Egypt. {prime_minister} must decide whether Israel signs.'
early_text_he: 'החזית עם מצרים שקטה, ושיחות שביתת הנשק התקיימו מוקדם יותר מאשר בהיסטוריה: המשא ומתן הניב הסכם שביתת נשק עם מצרים. על {prime_minister} להחליט אם ישראל תחתום עליו.'
anchor: hard
front_quiet: egypt
office: prime_minister
# R-TURN-002 (#2551; the owner chose "Move them a turn earlier (Recommended)" on 4 November 2026): the window opens on
# the 15th on or before the decision (signed 24 February 1949; it opened on 1949-02-24), so the card reaches the player
# on the turn before it.
from: 1949-02-15
# Hard anchor: fires on the first turn on or after `from`. `to` (exclusive, end of 1949) only makes the window finite,
# so the {prime_minister} placeholder needs a holder through 1949 and not past the holder's death (#1).
to: 1950-01-01
options:
  - id: sign
    text: Sign the armistice
    text_he: לחתום על הסכם שביתת הנשק
    historical: true
    recommended: true
    set_rung: 2
    effects:
      - { target: intl_standing, delta: 0.05 }
  - id: hold_out
    text: Refuse and keep fighting
    text_he: לסרב ולהמשיך בלחימה
    alternative: { basis: design }
    # Owner decision of 17 October 2026 (#937), "Yes, match the others": refusing keeps the war going at rung 4, as on
    # the Jordan, Lebanon and Syria fronts.
    set_rung: 4
    effects:
      - { target: intl_standing, delta: -0.10 }
sources:
  - { url: "https://avalon.law.yale.edu/20th_century/arm01.asp", checked: 2026-10-14 }
  - { url: "https://unispal.un.org/pdfs/634DB5CC6628D5C88525643C00766FB9.pdf", checked: 2026-10-14 }
status: fact-checked
