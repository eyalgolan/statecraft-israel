# yaml-language-server: $schema=../schema/event.schema.json
id: idf_founding
title: One Army
text: 'Armed forces are being brought into the new Israel Defense Forces, while the Irgun and Lehi still keep their own units. {defense_minister} proposes an order that forbids any armed force other than the IDF.'
anchor: hard
tags: [security]
office: defense_minister
# Date of the order [C]: Ben-Gurion signed it on 26 May 1948 (MoD/IDF Archives), the date used here; JVL says it was
# issued on 28 May 1948. It was published in Official Gazette No. 3 of 31 May 1948 (JVL; the Knesset's law database
# dates its publication 31 May 1948), so the window ends then. The Irgun agreed with the government on 1 June 1948 to
# dissolve into the IDF (Ben-Gurion to the Provisional State Council on 23 June 1948, below), Jerusalem excepted (JVL).
# Research notes facts-1948.md section 3a.
# The window opens on 22 May, the turn date before the order (game timing), so the card reaches the player in the turn
# that covers 26 May.
from: 1948-05-22
to: 1948-06-01
# Security deltas in these war-period events were halved in fix round 1 (review I6): ten of them stacked as permanent
# shifts, which moved end-1948 security from 0.34 to 0.62 with nothing anchoring it.
options:
  - id: one_army
    text: Issue the order and bring every armed force into the IDF
    historical: true
    recommended: true
    effects:
      - { target: security, delta: 0.015 }
  - id: separate_units
    # Game assumption: the notes name no one who argued for this; it is the status quo the order ended.
    text: Leave the Irgun and Lehi units outside the IDF for now
    effects:
      - { target: security, delta: -0.015 }
sources:
  - { url: "https://archives.mod.gov.il/sites/English/Exhibitions/David_Ben_Gurion_and_the_IDF/Pages/The-establishment-of-the-IDF.aspx", checked: 2026-10-10 }
  - { url: "https://jewishvirtuallibrary.org/the-founding-of-the-israel-defense-forces", checked: 2026-10-10 }
  # The Knesset's law database (OData): the Defence Army of Israel Ordinance, 5708-1948, publication date 31 May 1948.
  - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_IsraelLaw(2001303)", checked: 2026-10-14 }
  # Provisional State Council, fifth sitting, 23 June 1948 (Knesset minutes). Ben-Gurion: on 1 June the Irgun's head
  # signed undertakings that its members would enlist in the IDF and take its oath, its arms would be handed to the IDF,
  # and the Irgun and its command would cease to act and exist as a military body in the State of Israel and the area of
  # the Government of Israel; he said these were kept only in part. This is the government's account.
  - { url: "https://fs.knesset.gov.il/0/Plenum/0_ptm_249973.pdf", checked: 2026-10-14 }
status: fact-checked
