# yaml-language-server: $schema=../schema/event.schema.json
id: austerity_1949
title: Austerity
text: 'Food and foreign currency cannot keep pace with the immigrants arriving every week. {rationing_minister}, heading the new Ministry of Rationing and Supply, proposes strict rationing.'
# For the native reviewer (#564): Hebrew terminology follows he.wiki "תקופת הצנע" and the ministry's he.wiki title
# "משרד האספקה והקיצוב": https://he.wikipedia.org/wiki/תקופת_הצנע ; https://he.wikipedia.org/wiki/משרד_האספקה_והקיצוב
# "הצעת ... היא" keeps the sentence the same for a minister of either gender, as in altalena.yaml.
title_he: צנע
text_he: 'אספקת המזון ומטבע החוץ אינן מדביקות את קצב העולים המגיעים מדי שבוע. הצעת {rationing_minister}, בראש משרד האספקה והקיצוב החדש, היא קיצוב מחמיר.'
text_he_review: agent-checked
anchor: hard
office: rationing_minister
# The rationing plan was presented to the Knesset on 26 April 1949, already decided by the cabinet: Dov Yosef told the
# plenum of 26 April that the government had decided on the plan, and JTA of 26 April reports that the cabinet had
# already discussed it ("yesterday") and referred it to the Knesset. he.wiki (austerity) dates the decision itself to
# 26 April and is kept for the lack of foreign-currency reserves. The ministry and Dov Yosef date from 10 March 1949
# (#225).
from: 1949-04-26
to: 1950-01-01
options:
  - id: impose
    text: Impose rationing
    text_he: להנהיג קיצוב
    historical: true
    recommended: true
    set_policy: { rationing: 1.0 }
    effects:
      - { target: food_supply, delta: 0.15 }
      - { target: morale, delta: -0.05 }
  - id: decline
    text: Keep markets free and import more
    text_he: להשאיר את השווקים חופשיים ולהגדיל את היבוא
    alternative: { basis: design }
    effects:
      - { target: fx_reserves, delta: -8 }
      - { target: food_supply, delta: -0.05 }
sources:
  # Kept for the lack of foreign-currency reserves (the article: Israel had none) and its dating of the cabinet
  # decision to 26 April; the Knesset minutes below give the aim of saving foreign currency, not the reserves.
  - { url: "https://he.wikipedia.org/wiki/תקופת_הצנע", checked: 2026-10-10 }
  # First Knesset, 25th sitting, 26 April 1949: Ben-Gurion said more than 210,000 Jews had arrived since the state was
  # founded, more than 102,000 of them since January, and that an austerity regime would reduce dependence on imports
  # and foreign currency; Dov Yosef presented the government's plan, saving foreign currency among its principles.
  - { url: "https://fs.knesset.gov.il/1/Plenum/1_ptm_250102.pdf", checked: 2026-10-14 }
  - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=GovernmentNum%20eq%201", checked: 2026-10-14 }
  # JTA, 26 April 1949: the cabinet had discussed the rationing plan ("yesterday") and referred it to the Knesset.
  - { url: "https://www.jta.org/archive/israeli-knesseth-to-debate-rationing-program-today-plan-to-be-presented-by-ben-gurion", checked: 2026-10-14 }
status: fact-checked
