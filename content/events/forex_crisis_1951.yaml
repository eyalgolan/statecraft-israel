# yaml-language-server: $schema=../schema/event.schema.json
id: forex_crisis_1951
title: Foreign Currency Runs Out
text: 'Drought has forced larger wheat imports, immigration in the first half of the year far exceeded the plan, and about 45 million dollars of short-term credit falls due by December. {finance_minister} proposes asking the United States for about 15 million dollars in immediate aid.'
# For the native reviewer (#564): Hebrew terminology follows he.wiki "תקופת הצנע" (מטבע חוץ, יבוא):
# https://he.wikipedia.org/wiki/תקופת_הצנע . Dollar amounts in words, as the English writes them ("45 million dollars").
# "הצעת ... היא" keeps the sentence the same for a minister of either gender, as in altalena.yaml.
title_he: מטבע החוץ אוזל
text_he: 'הבצורת אילצה להגדיל את יבוא החיטה, העלייה במחצית הראשונה של השנה חרגה בהרבה מן התוכנית, ואשראי קצר מועד בסך כ־45 מיליון דולר עומד לפירעון עד דצמבר. הצעת {finance_minister} היא לבקש מארצות הברית סיוע מיידי בסך כ־15 מיליון דולר.'
text_he_review: agent-checked
anchor: soft
office: finance_minister
# US Ambassador Davis's report of 19 October 1951 (FRUS 1951 v.V doc 513).
from: 1951-10-19
to: 1952-01-01
options:
  - id: request_aid
    text: Ask Washington for emergency aid
    text_he: לבקש מוושינגטון סיוע חירום
    historical: true
    recommended: true
    effects:
      # About $45m of short-term credit matured Oct-Dec 1951 (FRUS d513); that it was paid, not rolled over, is a game
      # assumption (foreign banks and oil companies refused to expand credit at the end of 1951, en.wiki Austerity).
      - { target: fx_reserves, delta: -45 }
      # The notes record the request, not its outcome; the +15 is a game assumption, not a historical claim.
      - { target: fx_reserves, delta: 15 }
      - { target: intl_standing, delta: -0.01 }
  - id: cut_imports
    text: Cut imports further
    text_he: לקצץ עוד ביבוא
    alternative: { basis: design }
    effects:
      - { target: fx_reserves, delta: -45 }
      - { target: food_supply, delta: -0.05 }
      - { target: morale, delta: -0.04 }
sources:
  - { url: "https://history.state.gov/historicaldocuments/frus1951v05/d513", checked: 2026-10-10 }
  # FRUS 1951 v.V doc 514, Davis to the State Department, 21 October 1951: the Israeli Treasury's figures put foreign
  # exchange obligations maturing October to 31 December 1951 at 45.0 million dollars (import credits 32.8, bilateral
  # trade swings 2.0, defence import credits 9.0, oil 1.2) against 26.0 million of expected earnings; it supports
  # Kaplan's request of 19 October for immediate aid.
  - { url: "https://history.state.gov/historicaldocuments/frus1951v05/d514", checked: 2026-10-14 }
  # FRUS 1951 v.V doc 511, Davis, 13 October 1951: the Finance Ministry's secretary-general said reserves were nil and
  # about 15 million dollars was needed to clear arrears; he did not think the government's credit seriously impaired
  # yet, nor short-term commercial credit significantly shut down, but the banks' attitude showed widespread concern.
  - { url: "https://history.state.gov/historicaldocuments/frus1951v05/d511", checked: 2026-10-14 }
  # JTA, 23 October 1951, citing the London Times from Tel Aviv: Finance Ministry officials blamed the crisis on last
  # winter's drought, estimated to have cost 20 to 30 million dollars; and the New York Times, that the government had
  # cut import licences and refused to extend expired but unused credits.
  - { url: "https://www.jta.org/archive/u-s-credits-will-check-foreign-currency-crisis-in-israel", checked: 2026-10-14 }
  # FRUS 1951 v.V doc 515, Kopper to McGhee, 22 October 1951: Israel's reserves nil and about 15 million dollars needed
  # to clear arrears; Israeli officials did not think the government's credit yet seriously impaired, though the banks'
  # attitude showed widespread concern; Manufacturers Trust and National City had formed a consortium and were viewing
  # favourably a loan of upwards of 10 million dollars to Israel.
  - { url: "https://history.state.gov/historicaldocuments/frus1951v05/d515", checked: 2026-10-14 }
  # Kept for one line of the comment above: that foreign banks and oil companies refused to expand credit at the end of
  # 1951. The FRUS and JTA sources here do not say so, and the article's footnote, Seidman (Southern California
  # Interdisciplinary Law Journal 18, 2008), was read and does not say so either.
  - { url: "https://en.wikipedia.org/wiki/Austerity_in_Israel", checked: 2026-10-10 }
status: fact-checked
