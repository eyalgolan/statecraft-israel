# yaml-language-server: $schema=../schema/event.schema.json
id: iraqi_exodus
title: The Jews of Iraq
text: 'Iraq has announced that Jews registered to leave for Israel may go only until 1 March, and some 64,000 people who gave up their citizenship are still waiting to fly. The transit camps are already crowded. {immigration_minister} asks whether to bring everyone at once.'
# For the native reviewer (#564): established names follow he.wiki "מבצע עזרא ונחמיה" and "יהדות עיראק"
# (https://he.wikipedia.org/wiki/מבצע_עזרא_ונחמיה; https://he.wikipedia.org/wiki/יהדות_עיראק); "transit camps" is
# מעברות, as in maabarot_policy.yaml (he.wiki "מעברה").
title_he: יהודי עיראק
text_he: 'עיראק הודיעה שהיהודים שנרשמו לעלות לישראל יוכלו לצאת רק עד 1 במרץ, וכ־64,000 איש שוויתרו על אזרחותם עדיין ממתינים לטיסה. המעברות כבר צפופות. ההחלטה אם להביא את כולם בבת אחת בידי {immigration_minister}.'
anchor: soft
office: immigration_minister
# The asset-freeze law of 10 March 1951; the mass airlift ran through 1951.
# R-TURN-002 (#2833; the owner chose "Move both (Recommended)" on 5 November 2026): the window opens on the 15th on
# or before the decision (the law of 10 March 1951; it opened on 1951-03-10), so the card reaches the player on the turn
# before it.
from: 1951-02-15
to: 1951-07-01
options:
  - id: airlift
    # #2531 (owner, 9 November 2026: "Reword to match (Recommended)"): each option says what its effects do (airlift:
    # housing down, the crowded transit camps; pace: morale and intl_standing down while people wait), following
    # LetMeSleep8h's draft in #2571. For the native reviewer (#564): both option texts in Hebrew are agent-drafted.
    text: Bring everyone as fast as aircraft allow, and crowd the transit camps
    text_he: להביא את כולם מהר ככל שמאפשרים המטוסים, ולדחוס את המעברות
    historical: true
    recommended: true
    effects:
      - { target: housing, delta: -0.04 }
      - { target: morale, delta: 0.03 }
  - id: pace
    text: Pace arrivals to spare the camps, at the cost of waiting
    text_he: להתאים את קצב ההגעה כדי להקל על המעברות, במחיר ההמתנה
    alternative: { basis: design }
    effects:
      - { target: morale, delta: -0.05 }
      - { target: intl_standing, delta: -0.02 }
sources:
