  - { url: "https://in.bgu.ac.il/bgi/iyunim/40/Meir-Glitzenstein.pdf", checked: 2026-10-10 }
  - { url: "https://www.un.org/unispal/document/auto-insert-211728", checked: 2026-10-13 }
  - { url: "https://history.state.gov/historicaldocuments/frus1951v05/d340", checked: 2026-10-13 }
  # JTA, 15 March 1951: Iraqi banks reopened after two days' closure following the government's proclamation freezing
  # Jewish accounts and its decision to sequester the property of all Jews registered to emigrate to Israel; in
  # practice the freeze was reported extended to all Jews in Iraq; the airlift was speeded up, with "54,000 Jews
  # awaiting transfer" (the card's text has some 64,000).
  - { url: "https://www.jta.org/archive/anti-jewish-terror-continues-in-baghdad-airlift-of-jews-from-iraq-is-speeded-up", checked: 2026-10-14 }
  # JTA, 19 January 1951, citing Near East Radio: Iraq announced the end of the emigration of Israel-bound Jews "as of
  # March 1, 1951", and some 92,000 who registered "will lose their Iraqi citizenship and remain stranded in the Arab
  # country unless they can get out by March 1 or the deadline is extended". The source for the card's text on 15 February
  # 1951, before the asset-freeze law of 10 March (owner, 6 November 2026, on #2574's review: "Approve both (Recommended)").
  - { url: "https://www.jta.org/archive/iraq-to-ban-immigration-of-jews-after-february-92000-iraqi-jews-may-lose-citizenship", checked: 2026-11-06 }
status: fact-checked
