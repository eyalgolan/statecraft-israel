# yaml-language-server: $schema=../schema/event.schema.json
id: israel_bonds
title: Israel Bonds
text: 'The Knesset authorised a bond issue in February; it launches on 10 May. {finance_minister} proposes selling State of Israel bonds to Jews abroad, alongside the United Jewish Appeal donations.'
anchor: hard
office: finance_minister
# Knesset authorisation February 1951 (the vote is undated, so the window opens at the launch); launched 10 May 1951 at Madison Square Garden; over 52 million dollars sold in
# the first year against a 25 million goal (en.wiki and JVL; en.wiki "1950 in Israel" gives September 1950, which
# conflicts with both and is not used).
from: 1951-05-10
to: 1951-05-11
options:
  - id: launch
    text: Launch the bond issue in the United States
    historical: true
    recommended: true
    effects:
      - { target: fx_reserves, delta: 52 }
      - { target: intl_standing, delta: 0.02 }
  - id: donations_only
    text: Rely on donations and loans
    effects:
      - { target: fx_reserves, delta: 10 }
sources:
  - { url: "https://en.wikipedia.org/wiki/Israel_Bonds", checked: 2026-10-10 }
  - { url: "https://www.jewishvirtuallibrary.org/state-of-israel-bonds", checked: 2026-10-10 }
status: fact-checked
