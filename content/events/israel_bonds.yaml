  - { url: "https://en.wikipedia.org/wiki/Israel_Bonds", checked: 2026-10-10 }
  - { url: "https://www.jewishvirtuallibrary.org/state-of-israel-bonds", checked: 2026-10-10 }
  # First Knesset, 232nd sitting, 27 February 1951: Pinkas (chair, Finance Committee) brought the State of Israel Bonds
  # (Independence Loan) Law, 5711-1951, to its second reading: it empowers the Finance Minister to borrow 500 million
  # dollars in US currency, the first half of a billion-dollar loan asked of Jews abroad; it was the "Dollar Bonds Law"
  # at first reading. It passed by a majority with one against; the Speaker said only a Maki member opposed.
  - { url: "https://fs.knesset.gov.il/1/Plenum/1_ptm_250158.pdf", checked: 2026-10-14 }
  # The Knesset's law database (OData): State of Israel Bonds (Independence Loan) Law, 5711-1951, publication date 8
  # March 1951.
  - { url: "https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_IsraelLaw(2000053)", checked: 2026-10-14 }
  # JTA, 11 May 1951: Ben-Gurion spoke at the Madison Square Garden rally "which officially launched the Israel
  # Independence Bond sales campaign in this city", before 20,000 people; 35 million dollars of advance commitments.
  - { url: "https://www.jta.org/archive/ben-gurion-opens-israel-bond-campaign-in-new-york-35000000-raised-at-rally", checked: 2026-10-14 }
  # JTA, 2 May 1951: the sale of 500 million dollars of Israel bonds "was officially started today throughout the United
  # States"; Morgenthau bought the first bond from Kaplan.
  - { url: "https://www.jta.org/archive/sale-of-israeli-bonds-launched-throughout-u-s-z-o-a-sells-15000000-in-one-day", checked: 2026-10-14 }
  # JTA, 14 January 1952: 101,647,300 dollars subscribed in the United States in eight months; cash received on the
  # subscriptions as of 31 December was 54,100,000 dollars.
  - { url: "https://www.jta.org/archive/101647300-subscribed-for-israel-bonds-in-u-s-during-eight-months", checked: 2026-10-14 }
  # Israel Bonds (Development Company for Israel), "Bonds 75": the founding conference at the King David Hotel on
  # 3 September 1950; the official launch at Madison Square Garden on 10 May 1951, with over 20,000 attending.
  - { url: "https://israelbondsintl.com/bonds-75/", checked: 2026-10-14 }
