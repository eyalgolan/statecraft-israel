# yaml-language-server: $schema=../schema/event.schema.json
id: israel_bonds
title: Israel Bonds
text: 'The Knesset authorised a bond issue in February; it launches on 10 May. {finance_minister} proposes selling State of Israel bonds to Jews abroad, alongside the United Jewish Appeal donations.'
# For the native reviewer (#564): הכנסת and מלווה העצמאות follow the official Knesset record of the State of Israel
# Bonds (Independence Loan) Law (https://fs.knesset.gov.il/1/Plenum/1_ptm_250158.pdf); he.wiki "הבונדס" names the
# 1951 issue מלווה העצמאות and the bonds איגרות חוב של מדינת ישראל (https://he.wikipedia.org/wiki/הבונדס).
title_he: מלווה העצמאות
text_he: 'הכנסת אישרה בפברואר הנפקת איגרות חוב; היא תושק ב־10 במאי. הצעת {finance_minister} היא למכור איגרות חוב של מדינת ישראל ליהודים בחו״ל, לצד התרומות למגבית היהודית המאוחדת.'
text_he_review: agent-checked
anchor: hard
office: finance_minister
# Knesset authorisation February 1951 (second and third readings on 27 February, Knesset minutes; published 8 March, the
# Knesset's law database; the window opens at the launch); launched 10 May 1951 at Madison Square Garden; over 52
# million dollars sold in the first year against a 25 million goal (en.wiki and JVL; en.wiki "1950 in Israel" gives
# September 1950, which conflicts with both and is not used; Israel Bonds dates the Jerusalem conference that decided on
# the bonds to 3 September 1950). Launch [C]: 10 May 1951 at Madison Square Garden (Israel Bonds; JTA of 11 May, the
# rally "which officially launched the Israel Independence Bond sales campaign in this city"), used here; JTA's bulletin
# of 2 May has the sale "officially started today throughout the United States", eight or nine days before the rally.
# First year: JVL gives over 52 million dollars; JTA of 14 January 1952 has 101.6 million subscribed in eight months and
# 54.1 million in cash received by 31 December 1951 (Kaplan told the US ambassador on 18 October of 60 million in cash
# against 80 million pledged, FRUS 1951 v.V doc 513). The 25 million goal rests on en.wiki "Israel Bonds" (JVL says only
# that sales more than doubled Ben-Gurion's projections).
from: 1951-05-10
to: 1951-05-11
options:
  - id: launch
    text: Launch the bond issue in the United States
    text_he: להשיק את הנפקת איגרות החוב בארצות הברית
    historical: true
    recommended: true
    effects:
      - { target: fx_reserves, delta: 52 }
      - { target: intl_standing, delta: 0.02 }
  - id: donations_only
    text: Rely on donations and loans
    text_he: להסתמך על תרומות והלוואות
    alternative: { basis: design }
    effects:
      - { target: fx_reserves, delta: 10 }
sources:
