# yaml-language-server: $schema=../schema/event.schema.json
id: operation_horev
title: Operation Horev
text: '{defense_minister} proposes an offensive against the Egyptian army in the south, under Yigal Allon, with five brigades.'
# For the native reviewer (#564): מבצע חורב and יגאל אלון follow he.wiki "מבצע חורב"
# (https://he.wikipedia.org/wiki/מבצע_חורב).
title_he: מבצע חורב
text_he: 'הצעת {defense_minister} היא לפתוח במתקפה נגד הצבא המצרי בדרום, בפיקוד יגאל אלון ובהשתתפות חמש חטיבות.'
text_he_review: agent-checked
anchor: hard
tags: [security, war-casualties]
office: defense_minister
# Start [C]: 22 December 1948 (the IDF Archives; Security Council resolution 66 dates the hostilities from 22 December;
# JVL [S]), used here, vs 27 December (en.wiki "1948 in Israel", the date of the attack on al-Auja). The IDF Archives
# add that D-day, first set for 20 December, was put back 48 hours by rain to the night of 22-23 December. Ended
# 7 January 1949 (the IDF Archives: cease-fire at 14:00; the cease-fire agreement of 24 January: effective 7 January
# at 12:00 GMT). Commander Yigal Allon, five brigades (the IDF Archives: three brigades moved south to reinforce two
# southern ones). Research notes facts-1948.md section 9.
# The window opens on 15 December, the monthly turn date before the launch (game timing). Opening it earlier also lets
# the follow-ups (sinai_withdrawal, rhodes_talks) fire on 15 January 1949: they need Horev answered first.
from: 1948-12-15
to: 1948-12-23
options:
  - id: launch
    text: Launch Operation Horev
    text_he: לפתוח במבצע חורב
    historical: true
    recommended: true
    set_rung: 5
    effects:
      - { target: security, delta: 0.02 }
  - id: hold
    # Game assumption: the notes give no alternative to launching; this one names no advocate.
    text: Hold the lines and wait for talks with Egypt
    text_he: להחזיק בקווים ולהמתין לשיחות עם מצרים
    alternative: { basis: design }
    effects:
      - { target: security, delta: -0.01 }
sources:
  - { url: "https://www.jewishvirtuallibrary.org/jsource/History/horev.html", checked: 2026-10-10 }
  # IDF and Defence Establishment Archives (Ministry of Defence), "Operation Horev - Operation Ayin", 5 January 2015:
  # the operation began on 22 December 1948 and ended on 7 January 1949; three brigades from the north and centre were
  # moved south to reinforce two southern brigades; the commander was Yigal Allon as head of the Southern Front; the
  # forces were Golani, Harel, the 8th, the Negev and an artillery brigade; the cease-fire took effect on 7 January 1949
  # at 14:00. The page lists Wikipedia among its sources beside IDF Archives files.
  - { url: "https://archives.mod.gov.il/FocusOn/Pages/050115.aspx", checked: 2026-10-14 }
  # Security Council resolution 66 (S/1169), 29 December 1948: "the hostilities which broke out in southern Palestine on
  # 22 December 1948"; it calls for an immediate cease-fire.
  - { url: "https://avalon.law.yale.edu/20th_century/scres066.asp", checked: 2026-10-14 }
  # S/1225, the Acting Mediator's cable of 25 January 1949: the Egyptian-Israeli cease-fire agreement signed at Rhodes
  # on 24 January confirms the general cease-fire "which became effective on 7 January 1949 at 1200 GMT".
  - { url: "https://www.un.org/unispal/document/auto-insert-210639/", checked: 2026-10-14 }
status: sensitivity-reviewed
