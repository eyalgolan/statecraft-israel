id: elections_1949
title: Electing the Constituent Assembly
text: 'The Provisional State Council has set the Constituent Assembly at 120 seats, elected nationwide by proportional representation, and a national registration taken under curfew on 8 November built the voters'' roll. Postponed because of the war, the vote is set for 25 January.'
anchor: hard
office: prime_minister
# The Declaration of Independence required elected institutions by 1 October 1948; the vote was postponed twice because
# of the war (the dates of those decisions are a gap). 5 November 1948: the Provisional State Council set the assembly at
# 120 seats with nationwide PR (en.wiki and he.wiki election pages). Registration date [C]: 8 November 1948 (CBS,
# population.yaml; en.wiki and he.wiki election pages) vs "8 or 11" (en.wiki "1948 in Israel"); it ran under a seven-hour
# curfew (he.wiki). The vote: 25 January 1949, turnout 86.9% (en.wiki). When 25 January was fixed is a gap; the card
# comes on 23 January, by when the date was set. Research notes sections 10 and 11.
# One option (review I3): legislatures.yaml fixes the election and the First Knesset's sitting, so a "postpone" option
# could not change anything. The window opens on 17 January, so the card comes in the week of the vote.
from: 1949-01-17
to: 1949-01-26
options:
  - id: hold
    text: Hold the election on 25 January
    historical: true
    recommended: true
    effects:
      - { target: morale, delta: 0.03 }
      - { target: intl_standing, delta: 0.03 }
sources:
  - { url: "https://en.wikipedia.org/wiki/1949_Israeli_Constituent_Assembly_election", checked: 2026-10-10 }
  - { url: "https://he.wikipedia.org/wiki/הבחירות_לאספה_המכוננת", checked: 2026-10-10 }
status: fact-checked
