title: >-
  The force west of Rafah
title_he: >-
  הכוח שממערב לרפיח
text: >-
  In the record, Israel's Prime Minister told the US representative on 1 January 1949 that Britain had threatened action under its 1936 treaty with Egypt. On 5 January, the US Acting Secretary of State linked American pressure over the incursion into Egypt to the danger of a wider conflict outside Palestine. On this branch, {prime_minister} must decide whether to keep the force west of Rafah or complete its pullback.
text_he: >-
  בתיעוד ההיסטורי, ראש ממשלת ישראל מסר לנציג ארצות הברית ב־1 בינואר 1949 שבריטניה איימה לפעול מכוח ההסכם שלה עם מצרים משנת 1936. ב־5 בינואר קשר ממלא מקום מזכיר המדינה האמריקני את הלחץ האמריקני בעניין החדירה למצרים לסכנה של עימות רחב יותר מחוץ לארץ ישראל. במסלול הזה, {prime_minister} צריך להחליט אם להשאיר את הכוח ממערב לרפיח או להשלים את נסיגתו.
