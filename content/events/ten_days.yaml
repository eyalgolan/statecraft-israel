# yaml-language-server: $schema=../schema/event.schema.json
id: ten_days
title: The Ten Days
text: 'The first truce is due to end on 9 July. Where should the main effort go when the fighting resumes? In the centre, Operation Dani under Yigal Allon would take Lydda airport and secure the road to Jerusalem. {defense_minister} must decide.'
anchor: hard
tags: [security, war-casualties]
office: defense_minister
# The truce was due to expire on 9 July; Egypt renewed fighting on 8 July, one day early (en.wiki "1948 Arab-Israeli War";
# JVL/IDF). Start [C]: 8 July (en.wiki, "8-18 July") vs 9 July (en.wiki "Operation Danny", he.wiki). Operation Dani ran
# 9-19 July 1948 under Yigal Allon, Yitzhak Rabin his deputy; Lydda airport was taken on 10 July; the attacks on Latrun on
# 15-16 and 18 July failed. Owner ruling: the text describes the military operation only. Research notes section 4.
# The window opens on 3 July, the turn date before the truce ends (game timing). Only a player who accepted the first
# truce sees this card (its text is about the truce ending).
from: 1948-07-03
to: 1948-07-11
requires: { event: first_truce, option: accept }
options:
  - id: central_front
    text: Strike in the centre with Operation Dani, toward Lydda airport and the Jerusalem road
    historical: true
    recommended: true
    set_rung: 5
    effects:
      - { target: security, delta: 0.025 }
  - id: southern_front
    # Game assumption: a design alternative. The notes found no cabinet debate in July; Ben-Gurion's diary of 11 July
    # records Yadin asking where forces should go next [S].
    text: Strike against Egypt in the south first
    set_rung: 5
    effects:
      - { target: security, delta: 0.015 }
sources:
  - { url: "https://en.wikipedia.org/wiki/Operation_Danny", checked: 2026-10-10 }
  - { url: "https://en.wikipedia.org/wiki/1948_Arab–Israeli_War", checked: 2026-10-10 }
  - { url: "https://en.wikipedia.org/wiki/1948_in_Israel", checked: 2026-10-10 }
status: sensitivity-reviewed
