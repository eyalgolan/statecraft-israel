# yaml-language-server: $schema=../schema/event.schema.json
id: ten_days
title: The Ten Days
text: 'The first truce has ended and the fighting has resumed, with Egypt attacking in the south. In the centre, Operation Dani under Yigal Allon has taken Lydda airport and is pushing to secure the road to Jerusalem. {defense_minister} must decide where the main effort goes for the rest of the fighting.'
anchor: hard
tags: [security, war-casualties]
office: defense_minister
# The truce was due to expire on 9 July (the Mediator's report S/888); Egypt renewed fighting on 8 July, one day early
# (en.wiki "1948 Arab-Israeli War"; JVL/IDF; JTA reports the Defense Ministry's account of an Egyptian attack on the
# southern front before the truce ended; S/888 has hostilities resume on 9 July at the truce's end). Start [C]: 8 July
# (en.wiki, "8-18 July"; the Knesset's war summary has fighting resume on 8 July) vs 9 July (en.wiki "Operation Danny",
# he.wiki). Operation Dani ran 9-19 July 1948 (en.wiki; JVL/IDF gives 9-18 July, the Knesset summary's table 9-17 July)
# under Yigal Allon, Yitzhak Rabin his deputy; Lydda airport was taken on 10 July (en.wiki; JTA's bulletin of 12 July
# has it taken "yesterday", without a dateline); the attacks on Latrun on 15-16 and 18 July failed (en.wiki for the
# dates; the Knesset summary for the failure of the second phase). Owner ruling: the text describes the military
# operation only. Research notes section 4.
# The card is a decision during the fighting (owner decision, 15 October 2026, #567;
# docs/superpowers/specs/2026-10-14-event-timing-monthly.md):
# on monthly turns it cannot come before 15 July while it needs the first truce answered. The window opens on 10 July,
# when Lydda airport was taken, and ends on 17 July, before the second truce took effect on 18 July. Only a player who
# accepted the first truce sees this card (its text is about the truce ending).
from: 1948-07-10
to: 1948-07-18
requires: [{ event: first_truce, option: accept }]
options:
  - id: central_front
    text: Keep the main effort in the centre with Operation Dani, toward the Jerusalem road
    historical: true
    recommended: true
    set_rung: 5
    effects:
      - { target: security, delta: 0.025 }
  - id: southern_front
    # Game assumption: a design alternative. The notes found no cabinet debate in July; Ben-Gurion's diary of 11 July
    # records Yadin asking where forces should go next [S].
    text: Shift the main effort south, against Egypt
    set_rung: 5
    effects:
      - { target: security, delta: 0.015 }
