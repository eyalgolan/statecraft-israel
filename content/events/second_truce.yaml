# yaml-language-server: $schema=../schema/event.schema.json
id: second_truce
title: The Second Truce
text: 'The Security Council has found a threat to the peace under Article 39 of the Charter and ordered a cease-fire within three days, and an immediate cease-fire in Jerusalem. {prime_minister} must decide whether Israel complies.'
# For the native reviewer (#564): ההפוגה השנייה, מועצת הביטחון and האו״ם follow he.wiki "מבצע חירם"
# (https://he.wikipedia.org/wiki/מבצע_חירם); מגילת האו״ם follows he.wiki
# (https://he.wikipedia.org/wiki/מגילת_האומות_המאוחדות).
title_he: ההפוגה השנייה
text_he: 'מועצת הביטחון קבעה שקיים איום על השלום לפי סעיף 39 למגילת האו״ם, והורתה על הפסקת אש בתוך שלושה ימים ועל הפסקת אש מיידית בירושלים. ההחלטה אם ישראל תציית בידי {prime_minister}.'
text_he_review: agent-checked
anchor: hard
office: prime_minister
# Security Council Resolution 54, 15 July 1948 (S/902), 7-1 with 3 abstentions (the resolution as published by the UN).
# The truce took effect at 19:00 on 18 July (the IDF account; 1500 GMT in A/648) and lasted until 15 October (the IDF
# accounts and the Knesset's war summary date Operation Yoav from 15 October; the Acting Mediator's contemporaneous
# report of 18 October, S/1042, supports 15 October for the fighting: Israel's account of an all-out attack on its
# convoy on 15 October, and the observers' reports of attacks on 15 and 16 October; its one earlier item is an Egyptian
# complaint of an Israeli break-through at 2300 GMT on 14 October, and it asks both sides to return to the positions of
# 1200 GMT on 14 October; [C] S/1357, the Acting Mediator's report of July 1949, dates the clash from 14 October). The
# date of Israel's acceptance is a gap in the notes. Research notes facts-1948.md section 5. The text does not mention
# Latrun: a player who chose the southern front never attacked it.
from: 1948-07-15
to: 1948-07-19
options:
  - id: comply
    text: Comply with the cease-fire
    text_he: לציית לצו הפסקת האש
    historical: true
    recommended: true
    # Three months of truce: prolonged conflict (monthly turns) until the next offensive.
    set_rung: 4
    effects:
      - { target: intl_standing, delta: 0.03 }
  - id: defy
    # Game assumption: the notes name no advocate for defying the resolution.
    text: Defy the order and keep fighting
    text_he: להפר את הצו ולהמשיך בלחימה
    alternative: { basis: design }
    effects:
      - { target: intl_standing, delta: -0.10 }
      - { target: security, delta: 0.01 }
