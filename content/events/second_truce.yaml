# yaml-language-server: $schema=../schema/event.schema.json
id: second_truce
title: The Second Truce
text: 'The Security Council has found a threat to the peace under Article 39 of the Charter and ordered a cease-fire within three days, and an immediate cease-fire in Jerusalem. {prime_minister} must decide whether Israel complies.'
anchor: hard
office: prime_minister
# Security Council Resolution 54, 15 July 1948 (S/902), 7-1 with 3 abstentions. The truce took effect at 19:00 on 18 July
# and lasted until 15 October (en.wiki "1948 Arab-Israeli War"; he.wiki gives 18.7-15.10). The date of Israel's acceptance
# is a gap in the notes. Research notes facts-1948.md section 5. The text does not mention Latrun: a player who chose the
# southern front never attacked it.
from: 1948-07-15
to: 1948-07-19
options:
  - id: comply
    text: Comply with the cease-fire
    historical: true
    recommended: true
    # Three months of truce: prolonged conflict (monthly turns) until the next offensive.
    set_rung: 4
    effects:
      - { target: intl_standing, delta: 0.03 }
  - id: defy
    # Game assumption: the notes name no advocate for defying the resolution.
    text: Defy the order and keep fighting
    effects:
      - { target: intl_standing, delta: -0.10 }
      - { target: security, delta: 0.01 }
sources:
  - { url: "https://en.wikipedia.org/wiki/United_Nations_Security_Council_Resolution_54", checked: 2026-10-10 }
  - { url: "https://en.wikipedia.org/wiki/1948_Arab–Israeli_War", checked: 2026-10-10 }
status: fact-checked
