# GDD v0.1 corridors (docs/GDD.md "Pioneer work": build road, build railroad; docs/gdd/corridors.md; Phase 4 PR 2, #786).
# A corridor is built segment by segment by halutz units (R-COR-001 to R-COR-003); the state holds each segment's progress
# only. The owner took the plan's recommendations on 17 October 2026 (#782): the Burma Road on its traced line (Q-COR-1),
# one segment between each pair of consecutive sourced waypoints (Q-COR-2), and the 1949 Haifa to Tel Aviv rail link as
# the Yarkon link alone, since no source read gives the line of the bypass west of Tulkarm (Q-RAIL-1; research_notes/
# gdd-phase-4-sourcing.md). The Tel Aviv to Netanya road (Q-COR-3) is not on the 1946 map and no source read gives its
# 1950 line, so the owner decided (18 October 2026, #786) that it is drawn as straight draft lines between the five places
# The Jerusalem Post names (route tlv_netanya_road, `trace: straight`): four segments.
#
# Fields:
#   route     the route id in map/routes_1948.yaml whose traced line the corridor follows (map-only; the sim reads the hexes)
#   segments  in order along the route; `to` is the route waypoint the segment ends at (the first starts at the route's
#             first waypoint). Waypoint names stay map data: on screen a segment is the corridor's name and its number
#             (Q-SENS-1). `hexes` are GENERATED by tools/corridor_hexes.py from the traced line (do not edit by hand;
#             tools/tests/test_corridor_hexes.py fails when they drift).
# The Money and turns per segment are labelled design values in rules.yaml mvp: (Q-COR-6). The loader reads this file
# only when eras.yaml systems.loop is gdd.
corridors:
  - id: burma_road
    kind: road
    name: Burma Road
    name_he: דרך בורמה
    route: burma_road
    segments:
      - { to: Bayt Jiz, hexes: [[-3, 22], [-3, 23]] }
      - { to: Bayt Susin, hexes: [[-3, 23]] }
      - { to: Bayt Mahsir, hexes: [[-3, 23], [-2, 22], [-3, 23], [-2, 23]] }
      - { to: Saris, hexes: [[-2, 23]] }
    sources:
      # The route's line and its completion on 14 June 1948 (routes_1948.yaml burma_road, with that file's checked date).
      # G1 (owner, 14 October 2026, #384) put the Burma Road in the MVP.
      - { url: "https://en.wikipedia.org/wiki/Burma_Road_(Israel)", checked: 2026-10-11 }
    status: draft
  - id: tlv_haifa_rail
    kind: rail
    name: Haifa–Tel Aviv rail link
    # For the native reviewer (#564): "the Haifa to Tel Aviv rail link" (the 1949 Yarkon link).
    name_he: קישור הרכבת חיפה–תל אביב
    route: yarkon_rail_link
    segments:
      - { to: Tel Aviv North railway station, hexes: [[-2, 19], [-2, 18]] }
    sources:
      # Israel Railways, 50 Years of Israel Railways (1998), p. 15: the two sections laid in the summer of 1949 and the
      # service from 20 September 1949 (research_notes/gdd-phase-4-sourcing.md, section 2).
      - { url: "https://web.archive.org/web/20140327112217/http://www.rail.co.il/HE/Fun/Museum/Documents/50Years.pdf", checked: 2026-10-15 }
    status: draft
  - id: tlv_netanya_road
    kind: road
    name: Tel Aviv–Netanya road
    # For the native reviewer (#564): "the Tel Aviv–Netanya road" (the coastal road opened on 28 July 1950).
    name_he: כביש תל אביב–נתניה
    route: tlv_netanya_road
    segments:
      - { to: Herzliya, hexes: [[-3, 19], [-2, 18]] }
      - { to: Rishpon, hexes: [[-2, 18], [-1, 17]] }
      - { to: Wadi Falik (Nahal Poleg), hexes: [[-1, 17], [-1, 16]] }
      - { to: Netanya, hexes: [[-1, 16], [0, 15]] }
    sources:
      # The Jerusalem Post, 30 July 1950, pp. 1 and 3: the opening on 28 July 1950 and the five places the road passed
      # (research_notes/gdd-phase-4-sourcing.md, section 3). The line between them is the owner's straight draft (#786).
      - { url: "https://archive.org/details/per_jerusalem-post_the-jerusalem-post_1950-07-30_26_7318", checked: 2026-10-15 }
    status: draft
