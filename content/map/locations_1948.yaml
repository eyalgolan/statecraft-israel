  priority: must_have # DESIGN VALUE: owner-approved GDD v0.2 map priority, 17 October 2026.
  marker: true # DESIGN VALUE: this record is a map marker.
  managed_city: true # DESIGN VALUE: reuse the existing Jerusalem city economy.
  designated_site: false # DESIGN VALUE: Jerusalem is not a founding site.
  settlement_control_target: false # DESIGN VALUE: the roster does not select capture targets.
