# The railways and main roads of May 1948 (issue #35). Map-only: the sim never reads this file (ContentLoader reads
# only its own files), so it does not move the content hash; the map draws it (RouteLayer) and the sim could own the
# network later through road map actions (spec section 3: hexes hold infrastructure).
#
# Geometry: tools/routes_1948.py traces each route on the Survey of Palestine 1:250,000 map of 1946 (public domain;
# scanned and georeferenced by Palestine Open Maps), from one waypoint to the next along the route's own map symbol (the
# black railway line, the red main road; for the Burma Road, any track). The traced lines are in route_paths_1948.yaml.
# Waypoints are towns or stations the sources name on the route, at the coordinates their Wikipedia article gives
# (Wikipedia API prop=coordinates, as settlements_1948.yaml), or Wikidata's (CC0) where the article has none; they only
# steer the trace, which snaps them to the symbol. Where an article's point is a modern town off the 1946 road (Kfar
# Yona, Holon, Ashkelon for al-Majdal), the trace reaches it by a spur that the tool cuts, so the line passes up to
# about 3 km from that waypoint and stays on the road.
#
# trace: the map symbol the trace follows when it is not the kind's own (the 1,050 mm narrow-gauge lines are a thin
# line on the 1946 map, so they trace as `track`).
# status: draft = traced and checked by eye against the 1946 map (route previews), not yet by a historian.
# reviewed_by and reviewed_on (both or neither, beside status): a person's sign-off, their GitHub handle and the day; only
# that person writes them (owner, 15 October 2026, #375; docs/HISTORIAN_REVIEW.md). tools/routes_1948.py checks them; the
# traced route_paths_1948.yaml does not carry them.
# to_verify: what the sources leave open; a route with a to_verify line is not to be relied on beyond it.
# opened: the year a cited source gives for the route's opening; left out where no source states it. Every route
# except the Burma Road (1948) is on the 1946 map, so it ran by 1946 at the latest.
# from / to: the window in which the map draws the route (RouteLayer shows it while the game date is inside it): a year
# or a 'YYYY-MM-DD' date, quoted. `from` is the earliest date the cited sources support for the whole line as drawn
# (1946, the map's date, where no source gives an earlier one); `to` is left out while the line still exists.
map_source:
  name: Survey of Palestine, Palestine 1:250,000, 1946 (three sheets)
  url: https://palopenmaps.org/en/maps?basemap=pal250k1946
  tiles: https://palopenmaps.org/tiles/pal250k-1946/{z}/{x}/{y}.jpg
  licence: Public-Domain
  note: PD-UKGov (expired Crown copyright, 50 years from publication for published works; HMSO treats the expiry as
    worldwide) and PD-scan, as Wikimedia Commons files these sheets (e.g. File:Gaza_sh._04,_1946.jpg). Palestine Open
    Maps scanned and georeferenced it; its About page calls its maps public domain under the UK Copyright, Designs and
    Patents Act and publishes no terms of its own for the tiles or the georeferencing. The traced lines are our own
    derivative and copy none of its layers. Checked against station coordinates (about 100 m).
  checked: '2026-10-11'
routes:
# --- Railways (Palestine Railways, 1920-1948) ------------------------------------------------------------------------
- id: jaffa_jerusalem_railway
  name: Jaffa–Jerusalem railway
  kind: rail
  opened: 1892
  from: '1920-10-05'
  status: draft
  note: Jaffa terminus to Lydda junction, then Ramla, the Sorek valley and Battir to Jerusalem; opened 1892 as a metre
    gauge line. The Jaffa–Lydda track was removed by the Ottoman army in 1915 (Palestine Railways), relaid as a 600 mm
    line in February 1918, and rebuilt to standard gauge, finished in September 1920 and inaugurated on 5 October 1920
    (Jaffa–Jerusalem railway), so the line as drawn dates from then. Service stopped during the 1948 war (Jaffa–Jerusalem
    railway); regular trains between Ramla and Jerusalem resumed in March 1950 (Palestine Railways).
  to_verify:
  - The Jaffa station's closing date (August 1948 in the earlier note) is not in the cited articles' text.
  via:
