- id: jezreel_valley_railway
  name: Jezreel Valley railway (Haifa to Samakh and al-Hamma)
  kind: rail
  opened: 1905
  from: '1905-10-15'
  status: draft
  trace: track
  note: The narrow gauge branch of the Hejaz Railway, Haifa to Daraa (beyond the map), inaugurated on 15 October 1905.
    Its bridge between Samakh and al-Hamma was blown up in the Night of the Bridges (June 1946), cutting it off from
    the rest of the Hejaz line; a bridge near Geva was blown on 2 March 1948 and the Jordan bridge at Gesher on 14 May
    1948 (Jezreel Valley railway). Israel Railways repaired Haifa–Afula; that service ended in 1949, with occasional use
    until September 1951 (Jezreel Valley railway). The track stays drawn, as it still lay on the ground.
  via:
