- id: haifa_beirut_railway
  name: Haifa–Acre line and the Haifa–Beirut–Tripoli railway
  kind: rail
  opened: 1913
  from: '1942'
  status: draft
  note: Haifa to Acre (an extension of the Jezreel Valley line from Balad al-Sheikh, finished at the end of 1912 or in
    1913; the Jezreel Valley railway article gives both), continued north along the coast in 1942 by the wartime
    Haifa–Beirut–Tripoli line through Nahariya and the Ras an-Naqura tunnels (Rosh HaNikra grottoes), so the whole line
    as drawn dates from 1942. The Palmach destroyed the railway bridge at Rosh HaNikra in late February 1948, cutting the
    line at the border (Rosh HaNikra grottoes); in 1948 Israel's trains ran north from Haifa to Kiryat Motzkin and later
    Nahariya (Palestine Railways).
