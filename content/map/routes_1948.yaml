- id: burma_road
  name: Burma Road (1948)
  kind: track
  opened: 1948
  from: '1948-06-14'
  status: draft
  note: The makeshift bypass of Latrun built in May-June 1948, from just east of Dayr Muhaysin by Bayt Jiz and Bayt
    Susin, up to Bayt Mahsir and Saris, joining the old Jerusalem road. The first jeep attempt failed on the night of
    30-31 May and a second got through the next night (31 May - 1 June); the steepest section opened to vehicles on 10
    June and the road was completed on 14 June 1948 (Burma Road (Israel)), the date the map shows it from.
  to_verify:
  - Built after the 1946 map, so the trace follows the tracks the map shows between the places the source names; the
    1948 line differs where the builders cut new road (the steep ascent above Bayt Susin).
  via:
