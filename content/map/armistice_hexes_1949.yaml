fronts:   # each agreement; shown_from null: no line data, the Mandate sub-district layer stays on that front
  - { key: egypt, name: "Egypt", agreement: "Egypt-Israel General Armistice Agreement", signed: 1949-02-24, shown_from: 1949-02-24, low_accuracy: false, note: "Gap: from Gaza (about MR 102.4-100.1) to the Egyptian frontier the line is not drawn. Art. VI.1 says only 'continuing thus to the Egyptian frontier' and no map of the Memorandum or of the agreement was found. Art. VI.3 bounds it: Israel evacuates its outpost at the Cemetery (MR 0816-0723), so that point is inside the line, and new Israeli outposts may be set up at MR 0836-0700, east of it, so the line reaches the frontier south-east of Rafah, between about N 70 and N 72 km. Carrying the highway's bearing on from Gaza reaches the frontier at about MR 077.7-075.6, north of the Cemetery, and is therefore wrong; a 3-km offset of the coast road through Khan Yunis (MR 083.7-084.2) and Rafah (078.1-077.6), carried on its bearing, reaches the frontier near N 73, also north-west of the Cemetery. The Egyptian-held area is not drawn either, since it needs the whole line. From 22 Feb 1950 the line as drawn on the signed modus vivendi map (S/1471) is a separate feature (egypt_mv1950_demarcation), with its zone A and C lines (egypt_mv1950_zone_lines). Art. VI.4: in the Bethlehem-Hebron area no line was demarcated (left to a later agreement); nothing is drawn there." }
  - { key: lebanon, name: "Lebanon", agreement: "Lebanon-Israel General Armistice Agreement", signed: 1949-03-23, shown_from: 1949-03-23, low_accuracy: false, note: "" }
  - { key: jordan, name: "Jordan", agreement: "Hashemite Jordan Kingdom-Israel General Armistice Agreement", signed: 1949-04-03, shown_from: 1949-04-03, low_accuracy: true, note: "Not drawn (legibility, low-resolution scan): the Jerusalem sector (Art. V.1(b): the lines of the 30 November 1948 cease-fire, map 2, not on UNISPAL; on map 1 the city's lines merge into one blot at 51 m a pixel), so the line stops at the city's western edge on both sides; the Israeli and Jordanian lines and the no-man's-land between them, in Jerusalem and at Latrun (map 1 shows a double line at Latrun, but the two cannot be told apart at this resolution; the trace follows the outer drawn loop); the Mount Scopus enclave. To do from map 2 and a full-resolution map 1." }
  - { key: syria, name: "Syria", agreement: "Syria-Israel General Armistice Agreement", signed: 1949-07-20, shown_from: 1949-07-20, low_accuracy: false, note: "" }
