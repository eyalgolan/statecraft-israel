  number: 9th Brigade
  service: army
  side: israel
  sector: The sources conflict.
  wikipedia_only: false
  status: draft
  hidden: "The sources conflict and none names a place: en.wiki (Oded Brigade, Haganah) says it was headquartered in Jerusalem; he.wiki says it was formed on 1 June 1948 under Uri Yaffe (whose underground name was Oded; the brigade table in en.wiki's 1948 war article names Avraham Yoffe) from a Haifa-area battalion, local Guard Corps forces and new immigrants, to hold the east of the Galilee panhandle against the Golan, and it fought at al-Malkiyya in June 1948. Not yet formed on 15 May 1948 by he.wiki's date. P66: the Ministry of Defence memorial site (Izkor, Brigade 9 monument) has it formed in May 1948 as one of the three brigades for the north, named for Uri Yaffe's underground name, and fighting at al-Malkiyya; the Haganah Heritage lexicon (Golani) has Golani's 11th Battalion, posted in the eastern Upper Galilee, joining Oded at its formation at the end of May 1948. Both back he.wiki's northern account over en.wiki's Jerusalem headquarters; neither names a place. #197 pass (2026-10-16): Ben-Gurion's diary for 31 October 1948 (the Ben-Gurion Archive's English translation), giving Moshe Carmel's reports at the Northern Front's headquarters in Nazareth, has Tarshiha falling on the Saturday morning, 30 October, and then: \"The 9th Brigade attacked the villages between Tarshiha and Sa’sa’ and seized control of the northern road.\" he.wiki (Battles of al-Malkiyya) has the eastern Upper Galilee handed to Oded when Yiftach left, a company of its 11th Battalion taking over al-Malkiyya on 1 June 1948, and the Oded unit there attacked on 5 June (those lines carry no footnote); he.wiki (Battle of Tel Azaziyat, 1948) has a company of its 91st Battalion take the tell on the night of 9 to 10 July 1948. The one dated place near Jerusalem is en.wiki's: in July 1948 the brigade \"moved to capture the Arab villages Malha and Ein Karim\", footnoted to Bell, Terror out of Zion (1996), p. 331, which was not opened; en.wiki's \"headquartered in Jerusalem\" has no footnote of its own (the one before it, Tal 2004 p. 392, could not be opened). So the conflict stands, though the official and Hebrew sources all point north. No source names the brigade's headquarters or a place it held over a dated window: these are a company's post, a battalion's night action and a day of an attack. Hidden until a source names such a place, or the owner picks one of these."
  anchors: []
