# The military formations the map draws in 1948-49 (docs/units.md, "Units in play"). Map-only: the sim never reads this
# file (ContentLoader reads only its own files), so it does not move the content hash or the goldens. The map reads it
# (UnitRoster) together with the sim's security level and reserve call-up, and draws one token per unit.
#
# Owner rulings (2026-10-11): one token per brigade; the number of figures follows the call-up (1, 2 or 3); an Avia
# S-199 until the Spitfire's sourced date, then the Spitfire; brigades with no sourced position are listed but hidden;
# tokens stand only at dated, sourced positions and do not move with operation events; after the armistices only what a
# source says continued is shown; no orders (the unit panel links to the Defence screen). Controller rulings (review
# C1, I1, I3, I4): no invented end dates; "since" only from a sourced start; the squadron's bases where two sources agree.
#
# anchors: where the unit stood, each a named place a source gives for a dated window. The map draws the unit while the
#   game date is inside one of its windows: from (inclusive) to `to` (exclusive), 'YYYY-MM-DD', quoted. A window that a
#   source opens before the game starts opens on the game's first day (15 May 1948); `since` then gives the sourced start,
#   which the unit's card shows ("since February 1948"). With no `since`, the card gives no start.
#   precision: month marks a window edge that the source gives only as a month (the first of the month is used).
# end_basis: why a window ends.
#   source: a cited source moves the unit, ends its sector or disbands it; `end_note` says which.
#   front_armistice: no source gives an end, so the window ends on the day the armistice of the front it stood on was
#     signed (`front`: egypt 24 February, lebanon 23 March, jordan 3 April, syria 20 July 1949;
#     https://en.wikipedia.org/wiki/1949_Armistice_Agreements, checked 2026-10-11). This applies the owner's ruling
#     "after the armistices, show only what a source says continued"; no source yet gives a later position.
#   A window also ends no later than the unit's sourced disbandment (`disbanded`).
# The token stands on its anchor's hex or one next to it, clear of the settlement kits and the railways and roads
#   (UnitPlacer): a presentation offset of at most one hex step, not a claim about the position. Where the nearest such
#   spot would be the other side's ground, `toward` names a sourced place on the unit's own side and `place_hex` the hex
#   next to the anchor on that side ([q, r] in content/map/hexes.json); the token stands in that hex, nearest the place.
# Coordinates: the place's Wikipedia article (Wikipedia API prop=coordinates), or Wikidata (CC0) where it has none.
# wikipedia_only: true when every source of the row is a Wikipedia article (English or Hebrew) or a Wikidata item (for
#   coordinates only). Such a row is a draft until checked against a published history (Netanel Lorch, The Edge of the
#   Sword, 1961) or the IDF and Defense Establishment Archives. The card computes the same note per anchor.
# headgear: the riflemen's headgear, only where a source ties it to the unit (otherwise the uniform default: bush hat,
#   steel helmet, bush hat; docs/units.md).
# side: whose formation it is: israel (every row here), or egypt, jordan, syria, iraq, lebanon (#226). The token flies
#   that side's flag where the repo has a sourced one (Israel's only, for now; docs/units.md, "The plinth and the flag").
# hidden: a unit the sources name but do not place; the map does not draw it (owner ruling, 2026-10-11).
# status: draft = sourced and checked against the cited text, not yet by a historian.
# reviewed_by and reviewed_on (both or neither, beside status): a person's sign-off, their GitHub handle and the day; only
# that person writes them (owner, 15 October 2026, #375; docs/HISTORIAN_REVIEW.md).
units:
