- id: oded
  name: Oded Brigade
  name_he: "חטיבת עודד"
  name_he_review: agent-checked
  # Haganah Heritage lexicon, "Golani": "גדוד זה צורף לחטיבת עודד, עם הקמתה בסוף מאי 1948".
