# Localities on 15 May 1948 (status: draft): presentation only. The map's settlement kits and labels read this file;
# the sim never does (ContentLoader reads named files only), so it is outside the content hash and no save or golden
# depends on it (SaveGameTests.TheLocalitiesFileIsOutsideTheContentHash). It is NOT settlements_1948.yaml: that is the
# sim's list, and every id there needs a hex row (settlement_hexes.yaml).
#
# Scope (owner ruling 2026-10-11): every place of 1,000 or more people in Village Statistics, 1945 (VS) that is not one
# of the 25 game settlements, which keep their own entries (the mixed cities included). Smaller places, the 70 VS rows
# with no fixed point and the 29 foundings dated only "1948" are left for a later round.
# Start of game only: no later fate, depopulation date or post-May-1948 status is recorded (see docs/visual-v1.md).
#
# Fields:
#   name         the 1948 name shown on the map. name_basis vs1945: as VS lists it, with the article dropped ("Majdal,
#                El" -> Majdal), the "(Urban)"/"(includes ...)" notes and diacritics removed, and ayn as an apostrophe.
#                name_basis hebrew: a Jewish locality whose Hebrew name was the same in 1948, spelt as the game's 25
#                settlements are (Kfar Ata, renamed Kiryat Ata later, keeps its 1948 name).
#   today        only for a place that carries on today (owner ruling 2026-10-12): {name, name_he, source}, the name of
#                the living place (its Wikidata item's English Wikipedia title, else its label; Hebrew label), sourced to
#                that item; for a Jewish place merged into a later municipality, the municipality, sourced to the
#                place's article. A place whose item is a depopulated village or a former settlement has no today and
#                no tooltip (the item's class is not recorded here). Shown in the label's tooltip.
#   name_he/ar   Hebrew and Arabic names as the research draft took them (Wikidata labels, else the he/ar Wikipedia title),
#                re-checked against Wikidata on 2026-10-14. name_he is the 1948 form matching `name` (owner, 2026-10-14): where
#                the label is a later name (Beisan, Kfar Ata, Pardes Hanna) or there was none (Tarshiha), the 1948 Hebrew form
#                and the he.wiki page that gives it are in name_he_sources ({url, checked}); Majdal cites he.wiki's article
#                on the town.
#                Thirteen villages have no Hebrew label or article and no name_he: the map keeps the English (#558).
#                name_he_review: agent-checked on those five rows: an AI agent checked the name against its sources and no
#                person has read it yet (owner, 2026-10-15); a native speaker reviews it (#564) and removes the flag.
#   reviewed_by/on  a person's sign-off beside status (a place or a camp row), their GitHub handle and the day, both or
#                neither; only that person writes them (owner, 15 October 2026, #375; docs/HISTORIAN_REVIEW.md).
#   kind/type    finer kind and the repo's settlement type; the kit archetype follows type (village and arab_town:
#                Arab village houses; town, kibbutz, moshav: red-roofed Jewish settlement, moshav as a ring);
#                kind mixed_locality (Nesher): both, side by side.
#   landmark     from VS's religion columns over the place's rows: Muslim majority mosque, Christian majority church,
#                Druze ("others") none; Jewish places a water tower; a mixed locality (Nesher) both a mosque and a water
#                tower, each on its own side.
#   population   VS 1945 (1 April 1945), summed over listed_as; match: how the row was tied to the place (high, medium,
#                low = transliteration, manual = set by hand); owner_verify: true for low and manual, for a VS row that
#                names more than one place, and for a row with both Jews and Muslims over 10%.
# Bedouin (owner ruling 2026-10-11): encampments has one row per sub-district whose VS rows are labelled tribes, tribal
# units, nomads or nomadic, with no fixed point (plus the Jahalin, see its note), with their total. The map scatters
# symbolic camps, one per 1,000 people rounded half up with no floor (so Nablus's 220 draw none), over the
# sub-district's land hexes as content/map/subdistrict_hexes_1948.yaml draws them, read at load (no copy here); seeded,
# never named. Tulkarm's "Tribal Units" row has no figure in the transcription, so it has no camps. VS's own caveat: its
# nomad figures are the 1931 census estimate carried forward.
# sources: each row's URLs, all read on its `checked` date (a plain list, to keep the file small: the player parses it at
#   boot). By host: the en.wikipedia Village_Statistics,_1945 revision (oldid 1359600351) is the population and the 1948
#   name as listed (CC BY-SA 4.0); www.wikidata.org/wiki/Q... the coordinates, Hebrew and Arabic labels and whether the
#   place carries on today (CC0); an en.wikipedia article the identity check (CC BY-SA 4.0); a today's own source is in
#   today.source.
# Licences: Wikidata CC0; Wikipedia (the VS transcription, revision 1359600351; identity checks) CC BY-SA 4.0. The VS
# figures are the Mandate government's rough estimates, read from the transcription, not yet checked against a scan.
# Built from the research draft (.superpowers/handover-2026-10-11/promo/localities-1948.yaml and .md) on 2026-10-11;
# review fixes 2026-10-12 (.superpowers/handover-2026-10-11/promo/villages-review.md).
