# Population of each place in settlements_1948.yaml in the Mandate government's Village Statistics, 1945 (figures as of
# 1 April 1945). Presentation only: it sizes the settlement kits' footprints (owner ruling: towns spread over hexes in
# proportion to population; unity/Assets/Scripts/Map/Kits/KitPopulation.cs). The sim never reads it: ContentLoader reads
# named files only, so this file is outside the content hash and saves and goldens do not depend on it.
# Primary source: Government of Palestine, Village Statistics, April 1945 (Office of Statistics and Department of Lands;
# reprinted in S. Hadawi, Village Statistics of 1945, PLO Research Center, 1970). No scan of its town totals was reachable
# on 2026-10-11, so every figure was read from the Wikipedia table of the publication and stays owner-verify until it is
# checked against a scan. The page itself warns that locality figures are rough.
settlements:
