# Game rules. Values are game balance, except where a comment cites a source.
start: 1948-05-15                 # first day covered by the CBS 1948 immigration series (aliyah.yaml)
start_rung: 5                     # the war is under way when the game opens
attention_per_turn: 4                    # kept at 4 for monthly turns (owner, 15 October 2026, Q-CUT-5)
# Attention each order costs. The GDD orders' costs are design values (the owner's balance, not history), docs/rules/mvp.md
# R-LOOP-005; a unit order will be free (D-A6).
attention_cost:
  set_policy: 1
  allocate_budget: 2
  choose_event_option: 1
  set_mobilization: 1
  security_order: 1
  appoint: 2
  map_action: 1
  assign_workers: 0.5                    # DESIGN VALUE: owner-set balance, not a historical figure (D-A6)
  train: 1                               # DESIGN VALUE: owner-set balance, not a historical figure (D-A6)
  cancel_training: 0.5                   # DESIGN VALUE: owner-set balance, not a historical figure (D-A6)
  pioneer_work: 0                        # DESIGN VALUE: owner-set balance, not a historical figure (D-A6: unit orders are free)
  stop_work: 0                           # DESIGN VALUE: owner-set balance, not a historical figure (D-A6: unit orders are free)
  start_project: 1                       # DESIGN VALUE: owner-set balance, not a historical figure (D-A6, D-C5, Q-PROJ-5: the map action's cost)
  cancel_project: 0.5                    # DESIGN VALUE: owner-set balance, not a historical figure (D-A6, D-C5, Q-PROJ-5: cancel_training's cost)
# Turn length on each security rung, rungs 1 to 5 (R-TURN-001). The GDD MVP plays monthly turns on every rung (D-B1), so
# turns from 15 May 1948 end on the 15th of each month.
turn_lengths: [month, month, month, month, month]
# The GDD v0.1 rules (docs/rules/mvp.md). Every number here is a design value: the owner's balance, set or accepted in
# review (Q-CUT-1, owner, 15 October 2026: "Labelled design values"), never a historical claim. DesignValuesTests lists
# them all (R-LOOP-005); changing one is a balance edit that re-pins the goldens.
mvp:
  # The game ends on 15 January 1952, after 44 monthly turns (R-LOOP-004; owner, 15 October 2026, D-E5: "End on 15 Jan
  # 1952"). The founding era still runs to 1957 (G2), so its later content stays and loads, but play stops here.
  end: 1952-01-15
  people_per_unit: 1000                  # DESIGN VALUE: owner-set balance, not a historical figure (D-A1: people in one population unit)
  income_per_job_per_year: 0.06          # DESIGN VALUE: owner-set balance, not a historical figure (D-C6: IL millions per employed unit a year)
  craftsman_income_multiple: 2           # DESIGN VALUE: owner-set balance, not a historical figure (D-D4, Q-CRAFT-2: an employed craftsman earns this times income_per_job_per_year; R-CRAFT-002)
  # R-MONEY-002, option 3 (owner, 18 October 2026, #884): ordinary spending already represents aggregate public expense,
  # so no civilian place pays upkeep in the MVP. These are design values, not claims that historical upkeep was zero.
  city_upkeep_per_year: 0.0              # DESIGN VALUE: owner-set balance, not a historical figure (D-C6: IL millions per city a year)
  housing_upkeep_per_year: 0.0           # DESIGN VALUE: owner-set balance, not a historical figure (D-C6: IL millions per permanent-housing project a year)
  industry_upkeep_per_year: 0.0          # DESIGN VALUE: owner-set balance, not a historical figure (D-C6: IL millions per industry project a year)
  transit_camp_upkeep_per_year: 0.0      # DESIGN VALUE: owner-set balance, not a historical figure (D-C6: IL millions per transit camp a year)
  military_camp_upkeep_per_year: 0.0     # DESIGN VALUE: owner-set balance, not a historical figure (D-C6: IL millions per military camp a year)
  hakhshara_upkeep_per_year: 0.0         # DESIGN VALUE: owner-set balance, not a historical figure (D-C6: IL millions per Hakhshara a year)
  # The day the cities start taking arrivals (R-CITY-003; Q-ARRV-3, owner, 15 October 2026, #375): the census day of their
  # start values, 8 November 1948 (CBS Statistical Abstract of Israel No. 14, Table 11, pp. 30-31). The census already
  # counts the people who arrived from 15 May, so the cities take none before it; the national head count takes them all.
  city_arrivals_from: 1948-11-08         # https://www.cbs.gov.il/he/publications/DocLib/shnaton_saruk/shnaton1963_num14.pdf, checked 2026-10-15
  build_yishuv_turns: 6                  # DESIGN VALUE: owner-set balance, not a historical figure (D-D6: turns a pioneer build takes)
  build_yishuv_cost: 2                   # DESIGN VALUE: owner-set balance, not a historical figure (D-D6: IL millions, paid at the start)
  # Build a training camp (R-CAMP-001; D-D5, Q-CAMP-3). Proposed by an agent under "Agents propose design values" (owner,
  # 15 October 2026, #375): the yishuv build's pair, since no source sets a camp's cost in game units. The owner accepted
  # them ("Accept 6 turns, IL 2m", 17 October 2026, #927); the Phase 7 balance pass (#813) may tune them.
  build_camp_turns: 6                    # DESIGN VALUE: owner-set balance, not a historical figure (D-D5, Q-CAMP-3: turns a camp build takes)
  build_camp_cost: 2                     # DESIGN VALUE: owner-set balance, not a historical figure (D-D5, Q-CAMP-3: IL millions, paid at the start)
  # Plow fields (R-FIELD-001, R-FIELD-002; D-D10). Proposed by an agent and taken by the owner with the plan's other
  # recommendations (Q-FIELD-3, owner, 17 October 2026, #782: "1 Food a turn"): the smallest whole yield, about 0.1% of a
  # month's national need; plowing takes the recruit-training pair, the smallest project-sized values in the code.
  plow_fields_turns: 3                   # DESIGN VALUE: owner-set balance, not a historical figure (D-D10, Q-FIELD-3: turns plowing takes)
  plow_fields_cost: 0.5                  # DESIGN VALUE: owner-set balance, not a historical figure (D-D10, Q-FIELD-3: IL millions, paid at the start)
  # Dry swamp (R-SWAMP-001; D-D6, Q-SWAMP-1). Proposed by an agent under "Agents propose design values" (owner,
  # 15 October 2026, #375) and taken by the owner with the plan's other recommendations (17 October 2026, #782): twice
  # the yishuv build's pair, for the largest land work in the MVP. The owner may override them.
  dry_swamp_turns: 12                    # DESIGN VALUE: owner-set balance, not a historical figure (D-D6, Q-SWAMP-1: turns draining the Hula takes)
  dry_swamp_cost: 4                      # DESIGN VALUE: owner-set balance, not a historical figure (D-D6, Q-SWAMP-1: IL millions, paid at the start)
  field_food_per_turn: 1                 # DESIGN VALUE: owner-set balance, not a historical figure (D-D10, Q-FIELD-3: Food units a plowed field adds each turn)
  objective_points: 100                  # DESIGN VALUE: owner-set balance, not a historical figure (D-B6: points per objective)
  objective_bonus_per_month: 5           # DESIGN VALUE: owner-set balance, not a historical figure (D-B2: points per month early)
  objective_bonus_cap: 60                # DESIGN VALUE: owner-set balance, not a historical figure (D-B2: the most bonus points)
  # The national Food stock (R-FOOD-001 to R-FOOD-003; D-C2; maintainer decision of 16 October 2026, #382, option (b)). One
  # unit of Food is one population unit's food for a month. The stock starts at, and the monthly import keeps it at,
  # cover_months of the nation's need; the foreign currency crisis cuts the import. food_supply carries the term
  # k_food * (stock - full) / full, minus the unmet share: an empty stock costs k_food, which with food_supply's base of
  # 0.40 is the food_crisis line (0.30, model.yaml), so an empty larder brings the country to the edge of a food crisis
  # and any unmet need tips it over. Three months' cover makes one month of the 1951 crisis cost a third of k_food,
  # about what the legacy direct cut (fx_crisis_food_per_year) took over the same weeks. Neither is a historical figure.
  k_food: 0.1                            # DESIGN VALUE: owner-set balance, not a historical figure (D-C2: food_supply lost with an empty Food stock)
  cover_months: 3                        # DESIGN VALUE: owner-set balance, not a historical figure (D-C2: months of need a full Food stock holds)
  # The veteran pioneer (R-VET-001, R-VET-002; D-D9). Agent-proposed design values the owner took on 17 October 2026 (#782:
  # "take all of the plan's recommendations"; Phase 4 plan Q-VET-1, Q-VET-2). Service is build_yishuv_turns, so one
  # completed yishuv makes a veteran pioneer.
  veteran_halutz_service: 6              # DESIGN VALUE: owner-set balance, not a historical figure (D-D9, Q-VET-1: turns of work to become a veteran)
  veteran_progress: 2                    # DESIGN VALUE: owner-set balance, not a historical figure (D-D9, Q-VET-2: a veteran's turns of progress a turn)
  # Housing condition (R-HOUSE-001, R-HOUSE-002; D-D1, D-D2): each city's average condition, 0 to 1. Every city starts at
  # model.yaml's housing base, so the cities start where the national level does (Q-START-3), and each turn a city loses
  # overflow_condition_loss times its overflow share (people beyond its housing over its people). 0.15 is model.yaml's
  # homes_lift_morale k, borrowed: no closer comparable exists (Q-HOUSE-1). Agents proposed both numbers ("Agents propose
  # design values", owner, 15 October 2026, #375); the owner may override them. Neither is a historical figure.
  housing_start_condition: 0.35          # DESIGN VALUE: owner-set balance, not a historical figure (D-D2, Q-START-3: every city's start condition)
  overflow_condition_loss: 0.15          # DESIGN VALUE: owner-set balance, not a historical figure (D-D1, Q-HOUSE-1: condition lost a turn at a full overflow share)
  # The economic defeat (R-END-001, R-END-002; D-B5). Money is exhausted when the debt is at or above debt_ceiling (Q-DEF-1,
  # owner, 17 October 2026, #784: "a debt ceiling", first value IL 250m, as recommended), Food when the national stock is
  # 0; defeat_turns turn ends in a row with both end the game (Q-DEF-2, owner, 18 October 2026, #784: "3 turns"). Neither
  # is a historical figure; the Phase 7 balance pass (PR 12) sets the final ceiling.
  defeat_turns: 3                        # DESIGN VALUE: owner-set balance, not a historical figure (D-B5, Q-DEF-2: turn ends in a row with Money and Food exhausted)
  debt_ceiling: 250                      # DESIGN VALUE: owner-set balance, not a historical figure (D-B5, Q-DEF-1: IL millions of debt at which Money is exhausted)
  # Delegation and loyalty (R-EVT-003; #107, owner, 18 October 2026: "Yes: minister loyalty changes a delegated event's
  # outcome, with labelled values in the PR"). A minister below the floor still picks as competence says, but carries the
  # decision out half-heartedly: only the share of each numeric effect lands. The floor is 5 because people.yaml rates
  # the deputies 5 as a neutral rating, so neutral is not disloyal. Agent-proposed; the owner may override them.
  delegation_loyalty_floor: 5            # DESIGN VALUE: owner-set balance, not a historical figure (D-H1, #107: loyalty below which a delegated decision is half-done)
  disloyal_effect_share: 0.5             # DESIGN VALUE: owner-set balance, not a historical figure (D-H1, #107: share of each numeric effect a disloyal minister delivers)
# Coalition stability lost by replacing a minister (Cabinet.Appoint): a seat taken from the minister's party, or a
# reshuffle within it.
appoint_stability_cost_other_party: 0.06
appoint_stability_cost_same_party: 0.02
# Map actions (MapActions): from 1950, on land within one hex of a settlement. Transit camps also need the ma'abarot
# policy (the first ma'abara, Kesalon, opened in May 1950: https://en.wikipedia.org/wiki/Ma'abarot, checked 2026-10-10).
# Costs (IL millions) and effects are game balance: a camp is cheap and grim, permanent housing dear and welcome.
map_actions_from: 1950-01-01
map_action_max_distance: 1
map_actions_per_turn: 2
# name: the phrase the player reads in a sentence ("a transit camp"); required.
map_actions:
  transit_camp: { cost: 1.5, housing: 0.02, morale: -0.005, name: a transit camp }
  housing: { cost: 6, housing: 0.03, morale: 0.01, name: a housing project }
rung_attention_step: 0.25
rung_min_mobilization: [0.02, 0.05, 0.15, 0.4, 0.8]
ceasefire_weeks: 52               # long enough that the historical armistice events end the war first
# ---- Economy (calibrated in M3; checked by sim/Statecraft.Sim.Tests/EconomyCalibrationTests.cs) ----
# Units: treasury and debt in IL millions; fx_start, exports, donations/loans and imports in US$ millions.
# Formal rate 1950-51: IL 0.36 per US$ (IL 1 = $2.80), Michaely, Foreign Trade Regimes and Economic Development: Israel
# (NBER 1975) Table 5-1, https://www.nber.org/system/files/chapters/c4560/c4560.pdf (checked 2026-10-10).
treasury_start: 20
fx_start: 40
# Taxes finance the ordinary budget: FY 1950/51 IL 60 million, approved 29 June 1950
# (https://en.wikipedia.org/wiki/1950_in_Israel, checked 2026-10-10). 60m / ~1.10m Jews (CBS average 1950) = 0.0000545.
tax_per_capita_per_year: 0.0000545       # DESIGN VALUE: owner-set balance, not a historical figure (D-C6: derived ordinary-revenue abstraction retained by #884)
# Spending above taxes is borrowed. The gap is set so 1950-51 borrowing matches the rise in internal debt, IL 65.4m (1950)
# + 33.0m (1951) = 98.4m (Michaely Table 5-2, same chapter). The 1951 fiscal tightening is not modelled, so the model
# matches the two-year total, not each year. Job income (R-CITY-002) also reaches the Treasury, so the gap must cover it
# too (owner, 16 October 2026, #821, option (a)): the twelve cities' 211 employed units (cities.yaml; HistoricalAI assigns
# no workers) x mvp.income_per_job_per_year 0.06 x 2 years = 25.32m, and (98.4m - 6m reserve call-up + 25.32m) / ~2.40m
# person-years = 0.00004905 per person. Spending = tax 0.0000545 + 0.00004905 = 0.00010355, rounded to 0.0001036.
# (M3's value was 0.0000545 + 0.0000385 = 0.000093, derived before job income existed.)
spending_per_capita_per_year: 0.0001036  # DESIGN VALUE: owner-set balance, not a historical figure (D-C6: derived debt-path calibration retained by #884)
# Exports cover under a third of imports (spec section 3; EconomyCalibrationTests checks it every turn of 1950-51).
exports_per_year: 40
imports_per_capita_per_year: 0.00025
# Donations, loans and transfers, set so reserves run out in the last quarter of 1951: the October 1951 crisis
# (FRUS 1951 v.V doc 513, https://history.state.gov/historicaldocuments/frus1951v05/d513, checked 2026-10-10).
# History of this value: 192 (first fit, brief) -> 193.8 (re-fitted after Task 4 moved the Israel Bonds inflow to its
# 10 May 1951 launch; consistency anchor: first fx crisis in H2 1951, FRUS d513, 19 Oct 1951) -> 200. The 193.8 fit was
# knife-edged (valid range about 0.12 wide) because the model left out the documented drain of Q4 1951: about $45m of
# short-term credit matured Oct-Dec 1951 (FRUS d513), now applied by both options of forex_crisis_1951. With that drain the
# anchor (reserves not exhausted before the turn covering 19 Oct 1951; at its end below $45m; exhausted by the turn that
# covers the end of 1951) held for 193.78 to 206.62 (measured by bisection); 200 is the centre. Re-measured after the 1948
# war-period events (playtest 1 E, which moved the turn grid by a day): the range is 194.00 to 206.83 (bisection), and the
# margins at 200 are reserves $18.2m at the turn ending 1951-05-27 and $20.9m at the turn covering 19 Oct (against $45m
# falling due); first crisis in the turn ending 1952-02-27 (the one covering 31 Dec 1951); reserves -36.8 at the end of
# the run. The value was not retuned. Re-measured at the GDD cutover (monthly turns, play ending 15 January 1952): the
# anchor holds for 190.09 to 202.81 (bisection); at 200, reserves are $29.7m at the turn ending 1951-05-15 and $35.2m at
# the turn covering 19 Oct (ending 1951-11-15), against $45m falling due; the first crisis is in the turn ending
# 1951-12-15; reserves -13.0 at the game's end. The value was not retuned.
capital_inflow_per_year: 200
# While reserves are exhausted, food imports are cut: food_supply falls by this much per year. The legacy loop only: in the
# GDD loop the crisis cuts the Food stock's imports instead (R-FOOD-002, Q-POOL-4), and food_supply follows the stock.
fx_crisis_food_per_year: -0.2
mobilization_cost_per_year: 60
# Derived from CBS table 2.1 (1949): (end-1949 1,013.9k - end-1948 758.7k - 1949 immigrants 239,954) / average 1949 population 901.0k.
natural_increase_per_year: 0.0169
# Derived: CBS end-1948 Jewish population 758,700 minus 101,828 immigrants (15 May-31 Dec 1948) minus natural increase over
# 7.5 months at the rate above. Checked against the 8 Nov 1948 census by the calibration test.
# Arithmetic: 758,700 - 101,828 = 656,872. Natural-increase base = average of 656,872 and 758,700 = 707,786.
# Natural increase = 707,786 x 0.0169 x 7.5/12 = 7,476. 656,872 - 7,476 = 649,396, rounded to the nearest hundred = 649,400.
initial_population: { veterans: 649400 }
budget_start:
  defense_minister: 0.45
  finance_minister: 0.05
  # The Immigration line. Its id stays `prime_minister` (ids are stable: a rename would move every golden hash and break
  # the replay of saved budget orders), but it was the Ministry of Immigration's line until 8 October 1951:
  # budget_owners below says which office owns it on each date, and the Budget screen shows that office.
  prime_minister: 0.15
  labour_minister: 0.10
  health_minister: 0.07
  education_minister: 0.06
  agriculture_minister: 0.07
  interior_minister: 0.05
# Who owns a budget line, by date (issue #108). A line with no entry here belongs to the office with its own id for the
# whole era. The first owner starts on the era's first day; each later owner starts on its `from`; every owner's office
# must exist on its dates (the loader checks). The Ministry of Aliyah (immigration_minister) ends on 8 October 1951: the
# Knesset's government-positions table (KNS_PersonToPosition, GovernmentNum 2, read 2026-10-12) lists "Minister of
# Aliyah" (GovMinistryID 784) for Haim-Moshe Shapira (PersonID 2661) from 1 November 1950 to 8 October 1951, and
# GovernmentNum 3 (from 8 October 1951) lists no such ministry. The same table lists no immigration or absorption
# portfolio for the Prime Minister (Ben-Gurion, PersonID 2198) in the Third Government. That the line then sits with the
# Prime Minister is an assumption (research notes M3 1950-51, Addendum (a), unverified), as in M3: absorption is
# assumed to stay with the Jewish Agency and the Prime Minister. Re-point the second owner if a source shows otherwise.
# Source: https://knesset.gov.il/Odata/ParliamentInfo.svc/KNS_PersonToPosition?$filter=GovernmentNum%20eq%202 (and eq 3).
budget_owners:
  prime_minister:
    - { from: 1948-05-15, office: immigration_minister }
    - { from: 1951-10-08, office: prime_minister }
