# PROPOSAL, not content. Start values for the MVP's twelve Jewish cities and towns (issue #383; research note
# city-start-values-1948-cbs.md, next to this file). Nothing loads this file: it is outside content/, so the content hash
# and the goldens do not depend on it. It lands with Phase 3.
#
# Owner decision, 15 October 2026 ("Census values + defaults", recorded on PR #569):
# - The 8 November 1948 census counts are the start values, labelled with their date (no scaling back to May 1948).
# - All residents are counted (the census basis), not Jews only.
# - Tel Aviv-Yafo is one city (id tel_aviv, the CBS Tel Aviv-Yafo row). Jaffa stays a separate place on the map.
# - The Hebrew Wikipedia figures for Zikhron Ya'akov and Rosh Pinna are accepted.
# - Rishon LeZion is 10,433 (CBS SA 14), not 11,100.
# - Labelled design values fill the gaps where no source exists. The decision does not name the defaults; the ones below
#   are personal2's recommendation from the PR and are marked status: design.
#
# Why it is not content/cities.yaml yet:
# - The sim's cities.yaml (CityStart in sim/Statecraft.Sim/Content.cs) holds counts in population units of
#   mvp.people_per_unit people (D-A1), not people, and has no sources field. Turning people into units, and setting
#   housing_capacity and job_slots, are Phase 3 balance work (D-D1 to D-D4).
# - MvpSlice.Overlay uses content/cities.yaml as soon as it exists, so adding one would replace the slice's placeholder
#   Tel Aviv and move the MVP goldens. Controller ruling 2 (12 October 2026) keeps unset balance values out of content/.
#
# Statuses:
# - sourced: read from the CBS table named. wikipedia-only: owner-accepted Wikipedia figure.
# - derived: a CBS share for this city times the population.
# - design: a labelled design value, NOT a historical fact for this city. Method stated on each value.
#
# Field meanings:
# - population: residents on 8 November 1948 (the Registration of Population), all groups, as the CBS gives them.
# - population_series: CBS end-of-year estimates, for the calibration check against content/population.yaml.
# - employed / unemployed: people in the working population / unemployed on 8 November 1948. Mobilised soldiers are
#   counted in their civilian occupation (CBS note). Five cities have a CBS city share (derived); the other seven use the
#   national share (design): 314,781 working and 4,111 unemployed of 716,678 Jews (CBS SA No. 2, Table 9).
# - housing: no per-city stock was found for any city. Design default for all twelve: rooms (excluding kitchens) at the
#   national May 1948 ratio of 300,000 rooms for 650,000 people (Abrams, Commentary, April 1951), about 2.2 people per
#   room. At that density the city's housing capacity equals its start population: every city starts full.
# Rounding: to 100, or to 10 below 5,000 people.

sources:
  sa14: &sa14
    title: "CBS, Statistical Abstract of Israel No. 14 (1963), Table 11: Population in settlements numbering above 5,000 inhabitants on 31 XII 1962 (1948-1962), pp. 30-31"
    url: https://www.cbs.gov.il/he/publications/DocLib/shnaton_saruk/shnaton1963_num14.pdf
    checked: 2026-10-15
  sa1: &sa1
    title: "CBS, Statistical Abstract of Israel No. 1 (1949/50), Registration of Population (8 XI 1948), Table 9: Jewish population by occupational status and sex (%), p. 26"
    url: https://www.cbs.gov.il/he/publications/DocLib/shnaton_saruk/shnaton1950_num1.pdf
    checked: 2026-10-15
  he_zikhron: &he_zikhron
    title: "Hebrew Wikipedia, Zikhron Ya'akov, population timeline (1948 = 1,900); its source is not named"
    url: https://he.wikipedia.org/wiki/%D7%96%D7%9B%D7%A8%D7%95%D7%9F_%D7%99%D7%A2%D7%A7%D7%91
    checked: 2026-10-14
  he_rosh_pinna: &he_rosh_pinna
    title: "Hebrew Wikipedia, Rosh Pinna, text: about 350 people in May 1948"
    url: https://he.wikipedia.org/wiki/%D7%A8%D7%90%D7%A9_%D7%A4%D7%99%D7%A0%D7%94
    checked: 2026-10-14
  sa2: &sa2
    title: "CBS, Statistical Abstract of Israel No. 2 (1950/51), Table 9: Jewish population by occupational status and sex, 8 XI 1948, p. 24"
    url: https://www.cbs.gov.il/he/publications/DocLib/shnaton_saruk/shnaton1951_num2.pdf
    checked: 2026-10-15
  abrams: &abrams
    title: "Charles Abrams, Israel Grapples with Its Housing Crisis, Commentary, April 1951 (May 1948: 650,000 people, 300,000 rooms excluding kitchens)"
    url: https://www.commentary.org/articles/charles-abrams/israel-grapples-with-its-housing-crisisthe-new-states-number-one-problem/
    checked: 2026-10-15

