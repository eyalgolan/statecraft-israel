# A reckless player: full rationing from the rationing office's first turn and refuses the First Truce. The call-up follows
# the war rung (R-WAR-002, #750: the GDD loop refuses the set_mobilization order to call up everyone this scenario used to send).
name: reckless
until: 1949-04-01
steps:
  - on: 1948-06-01
    commands:
      - { kind: choose_event_option, event: first_truce, option: refuse }
  - on: 1949-03-10
    commands:
      - { kind: set_policy, policy: rationing, level: 1.0 }
