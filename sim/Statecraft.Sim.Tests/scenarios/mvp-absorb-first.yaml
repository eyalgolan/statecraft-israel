# A player who puts the city's people to work first (GDD Phase 1 PR 3), then uses the existing absorption tools to complete
# R-OBJ-004: halutz training frees city housing when it finishes (R-HOUSE-003), housing projects add capacity and industry
# projects add jobs (R-PROJ-003). Events nobody answered are delegated. It plays the real content (the GDD loop since the
# cutover), so it moves whenever a GDD rule or design value it reaches changes.
name: mvp-absorb-first
until: 1950-01-15
steps:
  - on: 1948-05-15
    commands:
      - { kind: assign_workers, city: tel_aviv, role: job, count: 90 }
      - { kind: train, city: tel_aviv, track: halutz, count: 158 }
  - on: 1948-06-15
    commands:
      - { kind: start_project, project: housing, city: haifa, q: 5, r: 8 }
      - { kind: start_project, project: housing, city: haifa, q: 4, r: 9 }
  - on: 1948-07-15
    commands:
      - { kind: start_project, project: housing, city: haifa, q: 5, r: 9 }
      - { kind: start_project, project: industry, city: haifa, q: 6, r: 8 }
  - on: 1948-08-15
    commands:
      - { kind: start_project, project: housing, city: jerusalem, q: 0, r: 22 }
      - { kind: start_project, project: housing, city: jerusalem, q: 1, r: 22 }
  - on: 1948-09-15
    commands:
      - { kind: start_project, project: housing, city: jerusalem, q: -1, r: 23 }
  - on: 1948-10-15
    commands:
      - { kind: start_project, project: housing, city: jerusalem, q: 1, r: 23 }
      - { kind: start_project, project: industry, city: jerusalem, q: -1, r: 24 }
  - on: 1948-11-15
    commands:
      - { kind: start_project, project: housing, city: petah_tikva, q: -2, r: 18 }
      - { kind: start_project, project: housing, city: petah_tikva, q: -1, r: 18 }
  - on: 1948-12-15
    commands:
      - { kind: start_project, project: housing, city: rehovot, q: -4, r: 20 }
      - { kind: start_project, project: housing, city: hadera, q: 2, r: 12 }
  - on: 1949-01-15
    commands:
      - { kind: start_project, project: housing, city: netanya, q: 0, r: 15 }
      - { kind: start_project, project: housing, city: jerusalem, q: 0, r: 23 }
  - on: 1949-02-15
    commands:
      - { kind: start_project, project: housing, city: rishon_lezion, q: -4, r: 21 }
  - on: 1949-09-15
    commands:
      - { kind: train, city: tel_aviv, track: halutz, count: 83 }
