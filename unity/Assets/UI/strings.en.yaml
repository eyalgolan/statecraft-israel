how_to_play.turn: "Each turn is one month. Look over the country, give your orders, then press End turn."
how_to_play.attention: "Most orders cost Attention, shown in the top bar. It refills at the start of each turn, and Attention you leave unspent does not carry over."
how_to_play.city: "Select a city on the map to review its housing and jobs. Choose how many people should work; the change takes effect when you end the turn."
how_to_play.training: "Train civilians without work as recruits at a military camp, or as halutzim (pioneers) at a Hakhshara (pioneer training camp). Each button shows the cost and training time."
how_to_play.events: "An event card asks for a decision. Answering it costs Attention, and your choice takes effect when you end the turn."
how_to_play.top_bar: "The top bar shows the date, your Attention, Money and the country's main indicators."
how_to_play.end_turn: "End turn moves to the next month. While one of your units still needs orders, the button selects it instead: move it, fortify it, hold or skip it. A card you leave unanswered, or have no Attention left to answer, goes to the responsible minister, who decides it for you."
how_to_play.why: "After a turn, open Why? to see each change and its cause."
