# UI strings (English). Code looks strings up by key (Statecraft.Game.UI.UiText); placeholders are string.Format
# arguments ({0}, {1}) formatted with the invariant culture. Static labels live in the UXML files.
# Most dates arrive already formatted by Statecraft.Sim.PlayerText ("15 May 1948"). The map's front-line date, the top
# bar's date, and the Budget, Why? and info panel dates are the exception: Control1948.DateText / LineDateText build
# them from the date.* strings below, so each language orders and names them (#687, #701).
# Money arrives formatted by PlayerText.Money / MoneyChange, its currency from content (model.yaml money): "IL 18.6m",
# "$41.5m", "+IL 1.2m". Shares and 0..1 indicators arrive on the 0-100 scale (PlayerText.Scale / Percent) and show "%".
hud.turn: "Turn {0}"
hud.date: "{0}"
hud.attention: "Attention {0:0.0} of {1:0.0}"
hud.people: "{0:N0}"
hud.level: "Level {0} of 5"
hud.score: "Score {0:N0}"
hud.delta_people: "{0:+#,##0;-#,##0}"
# A top-bar meter in words, kept as its tooltip for a later accessibility layer (HudModel.Spoken): {0} the caption, {1}
# the value, {2} the change without its sign. Money: {0} the sign and the currency prefix from content ("IL ", "-IL ",
# "$"), {1} the amount, already rounded ("18.6"). Points: a change of a 0-100 meter, shown as "+2%".
