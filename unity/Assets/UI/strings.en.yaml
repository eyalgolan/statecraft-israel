# The short guide (#1041). These describe the existing sim without balance values, so rule changes stay in the sim.
how_to_play.title: "How to play"
how_to_play.turn: "Each turn is one month. Look over the country, give your orders, then press End turn."
how_to_play.attention: "Most orders cost Attention, shown in the top bar. It refills at the start of each turn, and Attention you leave unspent does not carry over."
how_to_play.city: "Select a city on the map to see its housing and jobs, and set how many of its civilians are in work."
how_to_play.training: "In a city with a military camp or a Hakhshara, you can train civilians who have no work as recruits or halutzim. The button shows what the training costs and how many turns it takes."
how_to_play.events: "An event card asks for a decision. Answering it costs Attention, and your choice takes effect when you end the turn."
how_to_play.top_bar: "The top bar shows the date, your Attention, Money and the country's main indicators."
how_to_play.end_turn: "End turn carries out your orders and moves to the next month. A card you leave unanswered, or have no Attention left to answer, goes to the responsible minister, who decides it for you."
how_to_play.why: "After a turn, open Why? to see each change and its cause."
