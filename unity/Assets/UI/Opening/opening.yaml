      credit: "Benno Rothenberg / Meitar Collection / National Library of Israel / The Pritzker Family National Photography Collection · CC BY 4.0 · graded and cropped"
      alt: "Jewish detainees with their bundles and crates in front of the huts of a detention camp on Cyprus, February 1949."
      crop: [0.505, 0.56, 0.98]
      sensitive: true
      # The owner's sensitivity review: approved for use: https://github.com/eyalgolan/statecraft-israel/pull/1093#issuecomment-6338281251
      sensitivity_reviewed: true
      note: "Commons title 'מחנות המעצר בקפריסין' (the detention camps in Cyprus), dated February 1949, the last months of the camps, not 1946-47. About 15 identifiable adults, posed, no distress shown. NLI record 997008136325305171 (checked 2026-10-31): Benno Rothenberg, February 1949, ARC. 4* 2068 / 206, credit 'Meitar Collection, The Pritzker Family National Photography Collection, The National Library of Israel'; NLI marks it public domain in Israel, and Commons adds CC BY 4.0 with VRTS permission confirmed. The 'Meitar Collection (review needed)' category is a bulk backlog, not a rights flag. Alternate: Cyprus_(997008136324405171).jpg (the queue at the wire gate)."
  - id: arab_countries
    title: The Arab countries
    text: "In 1948 more than 135,000 Jews lived in Iraq. In March 1950 Iraq allowed them to leave only if they gave up their citizenship, and in March 1951 it froze the assets of those who had. The airlift, Operation Ezra and Nehemiah, began in May 1950, and by January 1952 some 120,000 Iraqi Jews had come to Israel. From Morocco, Libya, Egypt, Tunisia and other Arab lands, tens of thousands more came in the same years."
    title_he: "ארצות ערב"
    text_he: "ב־1948 חיו בעיראק יותר מ־135,000 יהודים. במרץ 1950 התירה להם עיראק לצאת רק אם יוותרו על אזרחותם, ובמרץ 1951 הקפיאה את נכסיהם של מי שוויתרו עליה. הרכבת האווירית, מבצע עזרא ונחמיה, החלה במאי 1950, ועד ינואר 1952 עלו לישראל כ־120,000 מיהודי עיראק. ממרוקו, מלוב, ממצרים, מתוניסיה ומארצות ערב אחרות הגיעו באותן שנים עוד עשרות אלפים."
    he_review: pending
    # CBS Publication 1365, Table 5, column "15 V 1948 - 1951", by country of birth.
    arrivals:
      - { country: Iraq, country_he: "עיראק", count: 123371 }
      - { country: Morocco, country_he: "מרוקו", count: 28263 }
    sources:
      - url: "https://israeled.org/airlift-iraqi-jews-begins/"
        supports: "Center for Israel Education: 'In 1948, Iraq had more than 135,000 Jews'; 19 May 1950, 'The first two flights of Operation Ezra and Nehemiah ... leave Baghdad'; 'the first of some 120,000 Jews who make aliyah by January 1952 after the Iraqi government makes a temporary change in the law to allow Jews to emigrate, as long as they renounce their Iraqi citizenship'"
        checked: 2026-10-31
      - url: "https://en.wikipedia.org/w/index.php?title=Operation_Ezra_and_Nehemiah&oldid=1377092685"
        supports: "'In March 1950, the Iraqi government ... passed a special bill of one-year duration permitting Jewish emigration on condition that Jews renounce their Iraqi citizenship' (the exact day of the law differs between sources, so the text gives only the month); 'On 10 March 1951 ... the government enacted a new law which extended the emigration period whilst also blocking the assets of Jews who had given up their citizenship' (the same page, citing Meir-Glitzenstein 2004, p. 206. Confirmed 2026-10-31 by UN document A/AC.25/IS.60 of 4 April 1951, a bill of 10 March 1951 freezing the assets of Jews who had forfeited Iraqi citizenship, and by the Iraqi Jewish Archive's gazette copies, IJA 2778, 'Law 5/1951'. The text claims only the freeze, not an extension)"
        checked: 2026-10-31
      - url: "https://www.cbs.gov.il/he/publications/DocLib/2009/1365/pdf/e_print.pdf"
        supports: "Table 5 (printed pages 38-39), column 15 V 1948 - 1951: Iraq 123,371; Morocco 28,263; Libya 30,972; Egypt, Sudan 16,028; Tunisia 13,293; Algeria 3,810 (the 'tens of thousands more' line)"
        checked: 2026-10-31
    image:
      file: opening_arab_countries.jpg
      commons: "https://commons.wikimedia.org/wiki/File:Ben_Gurion_International_Airport_(997008136550505171).jpg"
      original: "https://upload.wikimedia.org/wikipedia/commons/6/60/Ben_Gurion_International_Airport_%28997008136550505171%29.jpg"
