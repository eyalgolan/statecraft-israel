# R-GATE-002. An AI-assisted change must not set this to sensitivity-reviewed.
status: pending
strings:
  - { key: capture.intro, en: "Israeli units hold {0}, and no enemy unit is there. Choose what happens next. Your choice takes effect at End turn; until you choose, the units stay.", he: "כוחות ישראליים מחזיקים ב־{0}, ואין שם כוחות אויב. יש לבחור מה יקרה עכשיו. הבחירה תיכנס לתוקף בסיום התור; עד שתיבחר אפשרות, הכוחות נשארים במקום." }
  - { key: capture.option.raid, en: "Raid and withdraw", he: "פשיטה ונסיגה" }
  - { key: capture.option.occupy, en: "Occupy", he: "שחרור" }
  - { key: capture.option.deport, en: "Deport", he: "גירוש" }
  - { key: capture.about.raid, en: "The units leave at once, and the place is under enemy control again. Its residents are unchanged.", he: "הכוחות יוצאים מיד, והמקום חוזר לשליטת האויב. מצב התושבים לא משתנה." }
  - { key: capture.about.occupy, en: "One unit stays and holds the place for a set number of turns, at a Money cost each turn. Its residents are not affected.", he: "יחידה אחת נשארת ומחזיקה במקום מספר קבוע של תורות, בעלות כספית בכל תור. התושבים לא מושפעים." }
  - { key: capture.about.deport, en: "The residents are displaced, and the place is depopulated. Social cohesion and International support fall, and International support keeps falling for the rest of the game.", he: "התושבים נעקרים ממקומם, והמקום מתרוקן מתושביו. הלכידות החברתית והתמיכה הבינלאומית יורדות, והתמיכה הבינלאומית ממשיכה לרדת עד סוף המשחק." }
  - { key: capture.changes, en: "Changes at once:", he: "שינויים מיידיים:" }
  - { key: capture.changes_none, en: "Changes at once: none", he: "שינויים מיידיים: אין" }
  - { key: capture.caption.attention, en: "Attention", he: "תשומת לב" }
  - { key: capture.caption.food, en: "Food", he: "מזון" }
  - { key: capture.caption.arms, en: "Arms", he: "נשק" }
  - { key: capture.caption.score, en: "Score", he: "ניקוד" }
