  - { key: capture.delta_count, en: "{0:+#,##0;-#,##0}", he: "{0:+#,##0;-#,##0}" }
  - { key: capture.none, en: "None of the choices can be made this turn. The units stay, and the decision waits.", he: "אף אחת מהאפשרויות אינה זמינה בתור הזה. הכוחות נשארים במקום, וההחלטה ממתינה." }
  - { key: capture.reopen, en: "Decision waiting: {0}", he: "החלטה ממתינה: {0}" }
