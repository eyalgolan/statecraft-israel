# The advisors (docs/superpowers/specs/2026-10-23-advisors-design.md; docs/oss/DECISIONS.md D-ADV): who they are, what
# each says and when, and the encyclopedia's pages. A Unity-side file, never game content: it does not feed the content
# hash or the save. A message's text is advisor.<id>.text in strings.en.yaml and strings.he.yaml; a page's is
# advisor.page.<id>.title and .text. he_review stays pending until a native reviewer approves the Hebrew (spec OQ-4);
# a pending message or page never shows in Hebrew. The owner reviews every line before it ships (spec 17).
# person: the people.yaml id whose portrait the popup shows (PortraitCatalog); none drawn when the catalogue has none.
advisors:
  - { id: ben_gurion, person: ben_gurion }
  - { id: meyerson, person: golda_meir }
  - { id: dayan, person: dayan }
messages:
# The opening chain (spec 9.2): shown once on the first new game, step by step, each pointing at the part of the HUD the
# first-turn guide pointed at; its event step speaks before the card opens, and its Show me opens the card (spec 9.3).
  - { id: opening.greeting, advisor: ben_gurion, signal: opening, level: new, he_review: pending }
  - { id: opening.attention, advisor: ben_gurion, signal: opening, level: new, he_review: pending, requires: [opening.greeting], actions: [{ show_me: attention }] }
  - { id: opening.city, advisor: meyerson, signal: opening, level: new, he_review: pending, requires: [opening.attention], actions: [{ show_me: city_housing }] }
  - { id: opening.training, advisor: meyerson, signal: opening, level: new, he_review: pending, requires: [opening.city], actions: [{ show_me: city_training }] }
  - { id: opening.move, advisor: dayan, signal: opening, level: new, he_review: pending, requires: [opening.training], actions: [{ show_me: unit_move }] }
  - { id: opening.event, advisor: ben_gurion, signal: opening, level: new, he_review: pending, requires: [opening.move], when: { cards_waiting_at_least: 1 }, actions: [{ show_me: decision_waiting }, { open_card: true }] }
  - { id: opening.objectives, advisor: ben_gurion, signal: opening, level: new, he_review: pending, requires: [opening.event], actions: [{ show_me: nav_objectives }] }

# Spec 6's critical warnings (shown at every help level, Off included) and the defeat lines. debt_ratio_at_least 0.8: a
# presentation value for "close to the ceiling", for the owner to confirm; the ceiling itself is the sim's (R-END-001).
  - { id: ben_gurion.city_at_risk, advisor: ben_gurion, signal: city_at_risk, level: critical, he_review: pending, priority: 3, repeat: every, cooldown_turns: 1, actions: [{ open_screen: defence }] }
  - { id: ben_gurion.exhausted, advisor: ben_gurion, signal: exhausted, level: critical, he_review: pending, priority: 3, repeat: every, cooldown_turns: 1, actions: [{ open_screen: budget }] }
  - { id: meyerson.debt_ceiling, advisor: meyerson, signal: in_debt, when: { debt_ratio_at_least: 0.8 }, level: critical, he_review: pending, priority: 2, repeat: every, cooldown_turns: 3, actions: [{ open_screen: budget }] }
  - { id: meyerson.food_short, advisor: meyerson, signal: food_short, level: warnings, he_review: pending, priority: 2, repeat: every, cooldown_turns: 2 }
  - { id: ben_gurion.defeat_war, advisor: ben_gurion, signal: defeat_war, level: warnings, he_review: pending }
  - { id: ben_gurion.defeat_economy, advisor: ben_gurion, signal: defeat_economy, level: warnings, he_review: pending }

pages: []
