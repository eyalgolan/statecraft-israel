# The advisors (docs/superpowers/specs/2026-10-23-advisors-design.md; docs/oss/DECISIONS.md D-ADV): who they are, what
# each says and when, and the encyclopedia's pages. A Unity-side file, never game content: it does not feed the content
# hash or the save. A message's text is advisor.<id>.text in strings.en.yaml and strings.he.yaml; a page's is
# advisor.page.<id>.title and .text. he_review stays pending until a native reviewer approves the Hebrew (spec OQ-4);
# a pending message or page never shows in Hebrew. The owner reviews every line before it ships (spec 17).
# media (Task 26): the English clips under StreamingAssets/advisors, no Hebrew narration until OQ-4; cue starts
# come from faster-whisper word timestamps of the narration, one sentence (or clause) per cue.
# person: the people.yaml id whose portrait the popup shows (PortraitCatalog); none drawn when the catalogue has none.
advisors:
  - { id: ben_gurion, person: ben_gurion }
  - { id: meyerson, person: golda_meir }
  - { id: dayan, person: dayan }
messages:
# The opening chain (spec 9.2): shown once on the first new game, step by step, each pointing at the part of the HUD the
# first-turn guide pointed at; its event step speaks before the card opens, and its Show me opens the card (spec 9.3).
# The seven opening lines' Hebrew: approved by the owner, a native speaker, in chat on 24 October 2026 (about 11:42 IDT):
# "Approved".
  - { id: opening.greeting, advisor: ben_gurion, signal: opening, level: new, he_review: approved, media: { picture: opening.greeting.mp4, narration: { en: opening.greeting.en.wav }, cues: { en: [0.00, 4.31, 6.64] }, label: advisor.media_label, credit: advisor.credit.ben_gurion } }
# opening.attention and opening.event: copy-fix wording approved by the owner in chat, 24 October 2026, 04:14 UTC: "Approve all 8".
  - { id: opening.attention, advisor: ben_gurion, signal: opening, level: new, he_review: approved, requires: [opening.greeting], actions: [{ show_me: attention }], media: { picture: opening.attention.mp4, narration: { en: opening.attention.en.wav }, cues: { en: [0.00, 4.44] }, label: advisor.media_label, credit: advisor.credit.ben_gurion } }
  - { id: opening.city, advisor: meyerson, signal: opening, level: new, he_review: approved, requires: [opening.attention], actions: [{ show_me: city_housing }], media: { picture: opening.city.mp4, narration: { en: opening.city.en.wav }, cues: { en: [0.00, 4.81] }, label: advisor.media_label, credit: advisor.credit.meyerson } }
  - { id: opening.training, advisor: meyerson, signal: opening, level: new, he_review: approved, requires: [opening.city], actions: [{ show_me: city_training }], media: { picture: opening.training.mp4, narration: { en: opening.training.en.wav }, cues: { en: [0.00, 4.52, 8.30] }, label: advisor.media_label, credit: advisor.credit.meyerson } }
  - { id: opening.move, advisor: dayan, signal: opening, level: new, he_review: approved, requires: [opening.training], actions: [{ show_me: unit_move }], media: { picture: opening.move.mp4, narration: { en: opening.move.en.wav }, cues: { en: [0.00, 5.77] }, label: advisor.media_label, credit: advisor.credit.dayan } }
  - { id: opening.event, advisor: ben_gurion, signal: opening, level: new, he_review: approved, requires: [opening.move], when: { cards_waiting_at_least: 1 }, actions: [{ show_me: decision_waiting }, { open_card: true }] }
  - { id: opening.objectives, advisor: ben_gurion, signal: opening, level: new, he_review: approved, requires: [opening.event], actions: [{ show_me: nav_objectives }] }

# Spec 6's critical warnings (shown at every help level, Off included) and the defeat lines. Their words and speakers are the
# recorded clips' (owner, 24 October 2026: "Adopt clip words"; talking-v3/lines.csv): dayan.city_at_risk is
# warning.city_under_attack, meyerson.exhausted warning.economic_defeat_countdown.fix1, meyerson.debt_ceiling
# warning.debt_ceiling (so it waits for the ceiling itself, R-END-001: debt at or above it; owner, 24 October
# 2026, asked about an earlier warning: "No, at the ceiling is fine"), dayan.defeat_war
# warning.city_held_defeat and dayan.arms_out teach.arms, which fires when Arms are low (owner, 24 October 2026: "Fire
# when low"; the threshold, AdvisorSignals.ArmsReserve, is an owner-set DESIGN VALUE: "Approve 3 / costliest action", same day).
# The three critical warnings' Hebrew is approved by the owner, a native speaker (24 October 2026, asked what Hebrew players
# should see while the critical warnings wait for review: "Hebrew approved"), as worded in the S4 review sheet; any change
# to their Hebrew sets them back to pending. The other five rows' Hebrew is approved by the owner too (24 October 2026,
# asked about the S4 warning and teaching lines: "approved"), defeat_economy with the sheet's grammar fix (תורים, not
# תורות); any later change to their Hebrew sets them back to pending.
  - { id: dayan.city_at_risk, advisor: dayan, signal: city_at_risk, level: critical, he_review: approved, priority: 3, repeat: every, cooldown_turns: 1, actions: [{ open_screen: defence }] }
  - { id: meyerson.exhausted, advisor: meyerson, signal: exhausted, level: critical, he_review: approved, priority: 3, repeat: every, cooldown_turns: 1, actions: [{ open_screen: budget }] }
  - { id: meyerson.debt_ceiling, advisor: meyerson, signal: in_debt, when: { debt_ratio_at_least: 1 }, level: critical, he_review: approved, priority: 2, repeat: every, cooldown_turns: 3, actions: [{ open_screen: budget }] }
  - { id: meyerson.food_short, advisor: meyerson, signal: food_short, level: warnings, he_review: approved, priority: 2, repeat: every, cooldown_turns: 2 }
  - { id: dayan.defeat_war, advisor: dayan, signal: defeat_war, level: warnings, he_review: approved }
  - { id: ben_gurion.defeat_economy, advisor: ben_gurion, signal: defeat_economy, level: warnings, he_review: approved }
# Tasks 18 and 20's two warnings that need no encyclopedia page; the teaching rows wait for S3 (#1519).
  - { id: meyerson.budget_unsubmitted, advisor: meyerson, signal: budget_unsubmitted, level: warnings, he_review: approved, repeat: every, cooldown_turns: 1, actions: [{ open_screen: budget }] }
  - { id: dayan.arms_out, advisor: dayan, signal: arms_low, level: warnings, he_review: approved, repeat: every, cooldown_turns: 3, actions: [{ open_screen: defence }] }

pages: []
