# Decision-card illustration loops: silent AI-generated clips behind the card's Illustration switch (decision videos, owner
# rulings 2026-10-13; docs/event-videos.md). The archival photograph always shows first; a clip is never the only picture
# of a real event, and an event without a photograph gets no clip.
# This file maps event ids to clips for the Unity card only. It is NOT game content: content/events/*.yaml feed the content
# hash and save compatibility, and this file must never move there (EventVideoMappingTests).
# Each row: the event id; the shipped file (unity/Assets/StreamingAssets/video/); the promo shot it is made from (a path
# under promo/, which is not in the repository) and its SHA-256; the generator; the date the shot was made (its file date);
# what it shows (the alt text, the switch's tooltip); and the sensitivity flags.
# sensitive: true rows may not ship in a -shareable build until sensitivity_reviewed: true (an OWNER step; Build.cs).
# Owner ruling of 2026-10-14, relayed by the coordinator, after watching the three sensitive clips (operation_yoav,
# ten_days and the operation_horev outcome): "the 3 ilustration clips are great but no need to say there were created by
# ai". So those three rows are sensitivity_reviewed: true, and no clip carries a burned-in caption any more
# (docs/oss/DECISIONS.md G4). The four Dreamina (Seedance) clips keep Dreamina's own small "AI" watermark: owner ruling
# "Keep the badge", 2026-10-14 (G5).
# Owner ruling of 2026-10-20 (#1102, https://github.com/eyalgolan/statecraft-israel/issues/1102#issuecomment-6300646067), after
# watching the five shots A27, A05, TILE1, A07 and A09: "looks good". That approves seven uses and nothing else: the
# altalena loop and enforce outcome (A27), the operation_horev loop (A05), the first_new_yishuv loop and continue outcome
# (TILE1, a generic Negev settlement, not Mefalsim), the iraqi_exodus airlift outcome (A07) and the austerity_1949 impose
# outcome (A09). The three sensitive ones (both altalena rows, the operation_horev loop) are sensitivity_reviewed: true on
# that ruling.
# Owner rulings of 2026-10-24, given in chat after the demo-clip sheet: absorb_immigrants "Add v8, 6 s" (K04b, the demo 3 v8
# take t1, as the card loop and the continue outcome, frames 11-94). burma_road_complete "Add, check headlights first": A02
# was not added, because its trucks show headlights in every frame and no source was found for lit convoys on the Burma
# Road track (docs/event-videos.md).
# Rights: owner ruling D-V (docs/oss/DECISIONS.md), "no need to check, just use them"; ai_generated: true on every row.
# Deport never gets a clip (GDD owner ruling 1): EventVideoMapping refuses a row for an event with a deport option.
# tools/encode_event_videos.py makes the files from the shots: 960x540 H.264, no audio, no burned-in caption (owner ruling
# 2026-10-14 above; ai_generated: true stays on every row).
