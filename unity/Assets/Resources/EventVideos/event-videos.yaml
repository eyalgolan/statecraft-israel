# Esc, Enter or Space; Esc skips them all), captioned as the order ("Your order: ..."), never for a counterfactual option,
# never for Deport. start_frame and frames are the steadiest window of the shot (tools/encode_event_videos.py
# --steadiest), in frames at 24 fps after decimate (which drops the repeated frames of the 60 fps Dreamina files).
