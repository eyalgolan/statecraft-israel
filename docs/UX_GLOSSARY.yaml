- id: seat-and-member
  status: preferred
  category: politics
  definition: 'A seat is one place in a legislature, used when counting a party or coalition. A member is a person who holds
    one. In Hebrew the unit of a count depends on the body: seats of an elected body, members of the appointed one.'
  scope:
  - ui
  - docs
  en:
    preferred: seats (for counts), members (for people in a body)
    avoid: []
    in_use:
    - form: seats
      where: strings.en.yaml cabinet.seats
    - form: seats
      where: strings.en.yaml cabinet.seats_appointed
    - form: '{1} members'
      where: strings.en.yaml cabinet.legislature
    - form: members
      where: strings.en.yaml cabinet.members_unit
  he:
    preferred: מנדטים (an elected body), חברים (the appointed Provisional State Council)
    avoid: []
    in_use:
    - form: מנדטים
      where: strings.he.yaml cabinet.seats
    - form: חברים
      where: strings.he.yaml cabinet.seats_appointed
    - form: חברים
      where: strings.he.yaml cabinet.legislature, cabinet.members_unit
  recommendation:
    en: No change; 'seats' and 'members' already work for both bodies.
    he: 'Closed in #550: the unit is its own string (''cabinet.seats'' or ''cabinet.seats_appointed''), chosen by whether
      the legislature has an election date in content/legislatures.yaml (CabinetPresenter.SeatUnit), and no template hard-codes
      either word. The native reviewer can still confirm the two words, and a Knesset source for them is still missing.'
    reasons:
    - English needs no split, Hebrew does.
    - A new body is handled by its election date, so no string changes.
  decision_owner: Closed by Eyal (#550); native reviewer to confirm
