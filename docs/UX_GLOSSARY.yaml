# Statecraft: Israel glossary, draft for discussion
# Draft document. Adopted decisions are identified; other recommendations remain proposals.
# Cited forms were checked where snapshot evidence was available; unresolved evidence remains identified. Snapshot date 2026-10-17.
schema: '0.1'
status: DRAFT, unapproved
snapshot_date: '2026-10-17'
version: '0.5'
snapshot_commit: 46abd99c
# Revision 21 October 2026: targeted budget and map-hint checks at upstream/main 001a59d0.
conventions:
- id: spelling
  status: preferred
  summary: 'The rule exists but only as a comment in content/offices.yaml: office titles keep Israel''s official English (''Ministry
    of Defense'', ''Minister of Defense'') because they are proper nouns, and the UI is otherwise British English, so the
    screen and its button say ''Defence''. The comment says not to ''fix'' it (playtest 1, item 8). No document in docs/ or
    CONTRIBUTING.md states it, no reference dictionary is named, and docs/GDD.md mixes both spellings (''defence'' in the
    soldier actions table, ''defense'' under settlement control).'
  recommendation: Move the rule from the offices.yaml comment into docs/WRITING_GUIDE.md so it covers every surface, name
    one reference dictionary for the British spelling, and say which spelling the GDD and docs follow. Pattern from the Google
    developer documentation style guide and the GOV.UK style guide.
  decision_owner: 'Eyal: where the rule is documented and the dictionary; the rule itself is already his'
- id: transliteration
  status: decision-needed
  summary: 'Hebrew terms in English text are transliterated in several ways: ma''abarot (README), Halutz and Hakhshara (GDD),
    yishuv and yishuvim (GDD), Knesset. No scheme is written down.'
  recommendation: Pick one scheme, list each term once in this glossary, define each at first use, and keep the Hebrew spelling
    beside it in the glossary.
  decision_owner: Eyal
- id: button-names
  status: preferred
  summary: 'A named button is written in running text as the button shows it, in sentence case since #630 (''takes effect
    at End turn'', ''Press New game again''), while the action described in general is lowercase (''end the turn to see its
    causes''). This follows the Google rule that a UI label is written as it appears.'
  recommendation: Keep it as the rule. New buttons follow it.
  decision_owner: Eyal
- id: counts
  status: preferred
  summary: 'Counts are written ''Label: N'' where the sentence would otherwise change with N. The Hebrew ''event.more'' already
    does this; the English still says ''decision(s)''.'
  recommendation: Adopt now for both languages; a real plural mechanism is a separate proposal.
  decision_owner: Eyal
- id: dates
  status: preferred
  summary: 'English dates are written ''15 May 1948'' (CONTRIBUTING rule 4). Since #550 the strings files hold the twelve
    month names and two patterns (date.day_month_year, date.month_year), with Hebrew versions (''{0} ב{1} {2}'', so the prefix
    ב joins the month name with no hyphen). The map''s control captions use them (''9 July 1948'' and ''9 ביולי 1948''). The
    map, top bar, Budget, Why and info panel dates now use the language''s date keys (#687, #701). PlayerText.Date itself
    remains English, so other callers still need checking. Since #543 the UI puts invisible left-to-right marks round every
    value it inserts into a Hebrew line, so an English date or amount reads as one run and a minus sign stays on the correct
    side; the text itself is still English.'
  recommendation: Preserve the adopted localized date paths; check any remaining caller individually. Money localization remains
    open.
  decision_owner: Eyal
- id: label-capitalisation
  status: preferred
  summary: 'Settled by the maintainer in #630 (merged 15 October 2026): every static label is sentence case, button names
    included (''New game'', ''End turn'', ''Public support'', ''International support'', ''Foreign currency''). The top-bar
    captions are the content display names as written (the test is HudTests.TopBarCaptionsAreTheContentNames). ''DRAFT'' on
    a decision card stays in capitals. The Hebrew has no capitals, so the rule is for English only.'
  recommendation: Keep it as the rule. A new label, caption or button follows it, and so does text that names one.
  decision_owner: Eyal
concepts:
- id: security-level
  status: contested
  category: game-system
  definition: The five-step scale of the country's security posture, from 1 (routine threat) to 5 (full war), that the player
    orders up or down on the Defence screen. At level 5 a countdown to a UN-imposed ceasefire runs.
  scope:
  - ui
  - docs
  - marketing
  - code
  en:
    preferred: security level
    avoid:
    - rung (in player text and prose; it stays in code and content/rules.yaml)
    in_use:
    - form: Level {0} of 5
      where: strings.en.yaml hud.level
    - form: Security level
      where: strings.en.yaml defence.section_ladder
    - form: Lower the level
      where: strings.en.yaml defence.lower
    - form: Raise the level
      where: strings.en.yaml defence.raise
    - form: security level {1} of 5
      where: strings.en.yaml unit.national
    - form: level {0} to {1}
      where: strings.en.yaml defence.order
    - form: five-level escalation ladder
      where: README.md
    - form: start_rung
      where: content/rules.yaml
  he:
    preferred: null
    avoid: []
    in_use:
    - form: דרגה {0} מתוך 5
      where: strings.he.yaml hud.level
    - form: המצב הביטחוני
      where: strings.he.yaml defence.section_ladder
    - form: הורדת הדרגה
      where: strings.he.yaml defence.lower
    - form: העלאת הדרגה
      where: strings.he.yaml defence.raise
    - form: רמת ביטחון {1} מתוך 5
      where: strings.he.yaml unit.national
    - form: מדרגה {0} לדרגה {1}
      where: strings.he.yaml defence.order
    - form: סולם הסלמה
      where: README.he.md
    options:
    - דרגה
    - רמת ביטחון
    - 'רמת כוננות (Eyal''s suggestion on #193, if the ladder is read as an alert level)'
  recommendation:
    en: Say 'security level' in full where the player first meets it (the Defence screen caption and the HUD), then 'level'
      alone in the same view. Keep 'escalation ladder' for prose that describes the system, as the README does. Never 'rung'
      in player text.
    he: Choose one Hebrew word for 'level' and use it in every key. Which word is for the native reviewer; the options are
      listed. Since 14 October the section caption reads 'המצב הביטחוני' (the security situation) while the English caption
      still reads 'Security level', so the two languages no longer name the same thing there; confirm that this is intended.
    reasons:
    - Two of the three English UI forms already say 'security level'.
    - '''Level 5 of 5'' on its own does not say what the level measures.'
    - '''Rung'' appears only in code and rules.'
    - The Hebrew uses 'דרגה' (hud.level, defence.lower and defence.raise), 'רמת ביטחון' (unit.national) and 'המצב הביטחוני'
      (the caption) for one scale, and the README adds 'סולם הסלמה'.
  decision_owner: Eyal and the native reviewer
  pending_gdd: The GDD plan (section 5, D-C4) proposes that the level become derived from the war state. The wording may change
    with it.
- id: attention
  status: decision-needed
  category: game-system
  definition: The per-turn allowance that limits how many orders the player can give. Each kind of order costs some Attention,
    and an order is refused when there is not enough left.
  scope:
  - ui
  - docs
  - code
  en:
    preferred: Attention at the start of a label, attention inside a sentence (sentence case, as in the strings)
    avoid: []
    in_use:
    - form: Attention {0:0.0} of {1:0.0}
      where: strings.en.yaml hud.attention
    - form: Not enough attention (need {0:0.0}, have {1:0.0})
      where: strings.en.yaml order.no_attention
    - form: 4 Attention per turn
      where: 'issue #42 body'
    - form: 'attention_per_turn: 4'
      where: content/rules.yaml
  he:
    preferred: null
    avoid: []
    in_use:
    - form: תשומת לב {0:0.0} מתוך {1:0.0}
      where: strings.he.yaml hud.attention
    - form: אין מספיק תשומת לב
      where: strings.he.yaml order.no_attention
  recommendation:
    en: Keep sentence case everywhere, in prose as well as in the UI, so one rule covers both, and define the term once at
      first use in each document. The alternative, a capital for the named resource in prose only, would split the rule between
      UI and docs.
    he: No Hebrew change proposed. A native check of 'תשומת לב' as the name of a resource is advisable.
    reasons:
    - No document gives a player-facing definition.
    - One rule for UI and docs is simpler to apply and to check, and the strings already follow sentence case.
  decision_owner: Eyal
  pending_gdd: Kept by the owner (decision D-C5, 12 October). Its role in the GDD core loop is listed as open in docs/GDD.md.
- id: turn
  status: preferred
  category: game-system
  definition: One step of the game. The current MVP uses monthly turns on every security rung, from 15 May 1948 to 15 January
    1952 (docs/GDD.md and content/rules.yaml). Legacy turn-length strings remain in the files; their presence does not describe
    the current MVP cadence.
  scope:
  - ui
  - docs
  - marketing
  - code
  en:
    preferred: turn
    avoid: []
    in_use:
    - form: Turn {0}
      where: strings.en.yaml hud.turn
    - form: turns of a quarter / month / week
      where: strings.en.yaml defence.turn_quarter, defence.turn_month, defence.turn_week
    - form: Each turn advances history by one month
      where: docs/GDD.md
    - form: 'turn_lengths: [month, month, month, month, month]'
      where: content/rules.yaml
  he:
    preferred: תור
    avoid: []
    in_use:
    - form: תור {0}
      where: strings.he.yaml hud.turn
    - form: תורות של רבעון / חודש / שבוע
      where: strings.he.yaml defence.turn_*
    - form: '{0} תורות'
      where: strings.he.yaml city.turns (#869)
  recommendation:
    en: Use turn. When duration matters, say one month for the current MVP. Do not infer a quarter or week from unused legacy
      strings.
    he: 'The plural of תור is תורות everywhere (city.turns, defence.turn_*; owner, 24 October 2026: "plural of תור is תורות").'
    reasons:
    - The current rules set all five turn lengths to month.
  decision_owner: Eyal
