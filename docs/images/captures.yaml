# The in-engine screenshots in this folder (build-*.jpg), as the website shows them. site/src/lib/media.ts reads this
# file and the pictures at build time, so retaking the README screenshots updates the site at its next build.
# When the screenshots are retaken: replace the files, then set `build` and `date` below (the label reads
# "In-engine capture — <build>, <date>"). A new build-*.jpg needs an entry here, and an entry needs its file: the site's
# build fails otherwise. The first entry is the home page's hero image.
# `ai_part` names any AI-generated part of a real screenshot, shown with the picture (the start screen's painting).
# `video` (optional) is the real gameplay clip, the home page's hero loop (muted, looping, with a pause button):
#   video:
#     files: [build-gameplay.webm, build-gameplay.mp4]
#     title: { en: "...", he: "..." }
#     description: { en: "...", he: "..." }
#     alt: { en: "...", he: "..." }
#     build: main abc1234      # optional; defaults to the build above
#     date: 2026-10-13         # optional; defaults to the date above
# A build-*.mp4 or .webm that is not listed there fails the site's build.
build: main f93fd5e
date: 2026-10-13
video:
  files: [build-gameplay.webm, build-gameplay.mp4]
  title: { en: "Real gameplay: 22 to 29 May 1948", he: "משחק אמיתי: 22 עד 29 במאי 1948" }
  description:
    en: "About 11 seconds of real play, recorded from the game's own browser build: a pan across Tel Aviv, Jaffa and the coastal plain, a click on a hex that opens its panel, the One Army decision, and End Turn."
    he: "כ־11 שניות של משחק אמיתי, שהוקלטו מגרסת הדפדפן של המשחק עצמו: מעבר על תל אביב, יפו ומישור החוף, לחיצה על משושה שפותחת את הלוח שלו, ההחלטה על צבא אחד, וסיום תור."
  alt:
    en: "22 to 29 May 1948: the camera pans across Tel Aviv's white blocks, Jaffa and the coastal plain; a click on a hex opens its panel; the player answers the One Army event card and ends the turn, and the date moves to 29 May."
    he: "22 עד 29 במאי 1948: המצלמה עוברת על הבתים הלבנים של תל אביב, על יפו ועל מישור החוף; לחיצה על משושה פותחת את הלוח שלו; השחקן עונה על כרטיס האירוע \"צבא אחד\" ומסיים את התור, והתאריך מתקדם ל־29 במאי."
# `hero` is the home page's hero still: a clean in-engine render with no interface, composed for the title, with its
# own build and date (it is not a README screenshot, so it is not in the gallery). tools/: MapCapture.Promo with
# -extraPose, on the Mobile tier, which is the WebGL tier (docs/visual-v1.md).
hero:
  file: hero-engine-coast.jpg
  build: main 98515c5
  date: 2026-10-15
  title: { en: "Tel Aviv, Jaffa and the coast, without the interface", he: "תל אביב, יפו והחוף, בלי הממשק" }
  alt:
    en: "An in-engine render of the 1948 map with no interface: the coast at Jaffa and Tel Aviv, with sailing boats off Jaffa's breakwater, Tel Aviv's white blocks, a train on the coastal railway, groves, villages and the sub-district borders."
    he: "תמונה מתוך מנוע המשחק של מפת 1948 בלי הממשק: החוף ביפו ובתל אביב, עם סירות מפרש מול שובר הגלים של יפו, הבתים הלבנים של תל אביב, רכבת על מסילת החוף, מטעים, כפרים וגבולות הנפות."
images:
  - file: build-m3-city.jpg
    title: { en: "Tel Aviv’s white blocks and Jaffa", he: "הבתים הלבנים של תל אביב, ויפו" }
    alt:
      en: "The current build, 22 May 1948: a close-up of Tel Aviv's white blocks and Jaffa's stone town and harbour, with a brigade token, groves, villages, railways and the Mandate sub-district borders."
      he: "הגרסה הנוכחית, 22 במאי 1948: תקריב של הבתים הלבנים של תל אביב ושל העיר העתיקה של יפו ונמלה, עם אסימון של חטיבה, מטעים, כפרים, מסילות ברזל וגבולות נפות המנדט."
  - file: build-m3-map.jpg
    title: { en: "The map, the top bar and an event card", he: "המפה, הסרגל העליון וכרטיס אירוע" }
    alt:
      en: "The current build, 22 May 1948: the coastal plain from Tel Aviv and Jaffa to Jerusalem with Tel Aviv's white blocks, towns and villages, groves, railways and roads, brigade tokens and an aircraft, the top bar, and the One Army event card with an archival photograph."
      he: "הגרסה הנוכחית, 22 במאי 1948: מישור החוף מתל אביב ויפו ועד ירושלים, עם הבתים הלבנים של תל אביב, עיירות וכפרים, מטעים, מסילות ודרכים, אסימוני חטיבות ומטוס, הסרגל העליון, וכרטיס האירוע \"צבא אחד\" עם צילום ארכיון."
  - file: build-m3-start.jpg
    title: { en: "The start screen", he: "מסך הפתיחה" }
    alt:
      en: "The current build: the start screen, with two lines of the Declaration of Independence in Hebrew and English over an AI-generated painting of the 14 May 1948 ceremony."
      he: "הגרסה הנוכחית: מסך הפתיחה, ובו שתי שורות ממגילת העצמאות בעברית ובאנגלית, על רקע ציור של טקס 14 במאי 1948 שנוצר בבינה מלאכותית."
    ai_part: { en: "The painting behind the text is AI-generated, with no identifiable person.", he: "הציור שמאחורי הטקסט נוצר בבינה מלאכותית, ואין בו אדם שאפשר לזהות." }
  - file: build-m3-cabinet.jpg
    title: { en: "The Cabinet screen", he: "מסך הממשלה" }
    alt:
      en: "The current build: the Cabinet screen, with the Provisional State Council as a half circle of seats and the ministers' portrait cards."
      he: "הגרסה הנוכחית: מסך הממשלה, ובו מועצת המדינה הזמנית כחצי עיגול של מושבים וכרטיסי השרים עם תמונותיהם."
  - file: build-m3-why.jpg
    title: { en: "The “Why?” panel", he: "לוח \"למה?\"" }
    alt:
      en: "The current build: the Why panel, which lists what changed in a turn and the cause of each change."
      he: "הגרסה הנוכחית: לוח \"למה?\", שמפרט מה השתנה בתור ומה גרם לכל שינוי."
