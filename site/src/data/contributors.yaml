# The website's contributors grid (site/src/pages/[lang]/contributors.astro) reads this file and nothing else.
#
# github: the GitHub handle. name: shown instead of the handle when the person wants a display name; en and he
#   spellings, each optional (an empty one falls back to the other, then to the handle). A display name comes only from
#   the person or from the repo's NOTICE or CREDITS files.
# title: shown under the name, in the page's language.
# photo: a file in site/src/assets/contributors/ (for example eyalgolan.jpg), supplied by the owner with the person's
#   consent. Leave it empty and the card shows a monogram. Never a GitHub avatar, and never a generated or AI image of a
#   person.
# category (optional): team (the default), historian or sensitivity-reviewer. Historians and sensitivity reviewers get
#   their own section on the page.
# since, until (optional): when the person took part, as YYYY or YYYY-MM, quoted or not. An entry with `until` moves to
#   the Past contributors section with its years. Only the person or the owner supplies these dates.
# The two sections appear only when someone is in them.
#
# Hebrew titles are gendered. Where the person's preference is not known, the Hebrew uses a neutral wording.
